<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <title>트랙 보기 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- html2canvas + jsPDF (PDF 저장용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      /* 시뮬레이터 톤 */
      --beige: #FFF8E7;
      --beige-deep: #FFE9B3;
      --beige-card: #FFFBF0;
      --brown: #6B4423;
      --brown-dark: #4A2E14;
      --sky-blue-dark: #4A8AB8;
      --sky-blue: #87BAD7;
      --check-brown: #4A2E14;
      /* 태그 색상 */
      --tag-fixed-bg: #FEF3C7;
      --tag-fixed-text: #B45309;
      --tag-area-bg: #DBEAFE;
      --tag-area-text: #1D4ED8;
      --tag-common-bg: #E0F2FE;
      --tag-common-text: #0369A1;
      --tag-core-bg: #FFE9B3;
      --tag-core-text: #B45309;
      --tag-recommend-bg: #DBEAFE;
      --tag-recommend-text: #1D4ED8;
      --tag-credit-bg: #DCFCE7;
      --tag-credit-text: #15803D;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 32px rgba(74, 144, 217, 0.12);
      --shadow-beige: 0 4px 14px rgba(120, 80, 30, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark { width: 42px; height: 42px; }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-school { background: var(--primary-soft); color: var(--primary-dark); }
    .badge-admin { background: var(--admin-soft); color: var(--admin); }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: white;
      border: 1.5px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .logout-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 28px 80px;
    }
    .page-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .top-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1.5px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .top-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }
    .top-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .top-btn.primary:hover { background: var(--primary-hover); }
    .top-btn.pdf {
      background: #ec6f8e;
      color: white;
      border-color: #ec6f8e;
      box-shadow: 0 2px 8px rgba(236, 111, 142, 0.25);
    }
    .top-btn.pdf:hover { background: #d65878; }
    .top-btn.share {
      background: #FEE500;
      color: #3A1D1D;
      border-color: #FEE500;
      box-shadow: 0 2px 8px rgba(254, 229, 0, 0.35);
    }
    .top-btn.share:hover { background: #fdd400; }
    
    /* 시뮬레이터 톤의 메인 카드 */
    .track-card {
      background: var(--beige-card);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: var(--shadow-beige);
      margin-bottom: 20px;
    }
    
    /* 트랙 타이틀 영역 (시뮬레이터의 학교명 영역 같은 느낌) */
    .track-title-block {
      text-align: center;
      padding-bottom: 28px;
      border-bottom: 2px dashed var(--beige-deep);
      margin-bottom: 28px;
    }
    .track-title-block .school-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 30px;
      color: var(--sky-blue-dark);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .track-title-block .track-title {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 22px;
      color: var(--brown);
      margin-bottom: 12px;
    }
    .track-title-block .meta-line {
      font-size: 14px;
      color: var(--text-muted);
      display: inline-flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .category-tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
    }
    .cat-social_science { background: #DBEAFE; color: #1D4ED8; }
    .cat-business { background: #FEF3C7; color: #B45309; }
    .cat-engineering { background: #DCFCE7; color: #15803D; }
    .cat-medical { background: #FEE2E2; color: #B91C1C; }
    .cat-other { background: #F1F5F9; color: #475569; }
    
    /* 트랙 설명 */
    .description-box {
      background: var(--beige);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--brown);
      line-height: 1.7;
      white-space: pre-wrap;
    }
    
    /* 범례 (시뮬레이터의 통계 칩 느낌) */
    .legend-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 28px;
    }
    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: white;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(120, 80, 30, 0.06);
    }
    .legend-chip .dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .legend-chip .dot.fixed { background: #FEF3C7; border: 2px solid #B45309; }
    .legend-chip .dot.core { background: #FFE9B3; border: 2px solid #B45309; }
    .legend-chip .dot.recommend { background: #DBEAFE; border: 2px solid #1D4ED8; }
    
    /* 학년 섹션 */
    .grade-section {
      margin-bottom: 24px;
    }
    .grade-title {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 24px;
      color: var(--sky-blue-dark);
      margin-bottom: 14px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .grade-title-icon {
      width: 36px;
      height: 36px;
      background: var(--sky-blue-dark);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }
    
    /* 학기별 표 */
    .semester-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 768px) {
      .semester-row { grid-template-columns: 1fr; }
    }
    .semester-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(120, 80, 30, 0.05);
    }
    .semester-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1.5px dashed var(--beige-deep);
    }
    .semester-label {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      color: var(--brown);
    }
    .semester-credit-chip {
      padding: 5px 12px;
      background: var(--tag-credit-bg);
      color: var(--tag-credit-text);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }
    
    /* 교과군별 그룹 */
    .area-block {
      margin-bottom: 14px;
    }
    .area-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 6px;
      padding: 3px 10px;
      background: #FEF3C7;
      border-radius: 8px;
      display: inline-block;
    }
    
    /* 과목 카드 (시뮬레이터의 과목 카드 스타일) */
    .subject-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #FAFAFA;
      border: 1.5px solid transparent;
      border-radius: 12px;
      margin-bottom: 5px;
      transition: all 0.15s ease;
    }
    .subject-card.fixed {
      background: var(--beige);
      border-color: #FEF3C7;
    }
    .subject-card.core {
      background: #FFFBEB;
      border-left: 4px solid #F59E0B;
    }
    .subject-card.recommend {
      background: #EFF6FF;
      border-left: 4px solid #3B82F6;
    }
    .subject-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--check-brown);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      flex-shrink: 0;
    }
    .subject-check.empty {
      background: transparent;
      border: 2px solid #D1D5DB;
    }
    .subject-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .subject-row-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .subject-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--brown-dark);
    }
    .subject-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .stag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      white-space: nowrap;
    }
    .stag-fixed { background: var(--tag-fixed-bg); color: var(--tag-fixed-text); }
    .stag-core { background: #FEF3C7; color: #B45309; }
    .stag-recommend { background: #DBEAFE; color: #1D4ED8; }
    .subject-credit {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      color: var(--sky-blue-dark);
      font-size: 15px;
      flex-shrink: 0;
    }
    
    /* 선택군 그룹 헤더 */
    .choice-group-label {
      font-size: 12px;
      color: var(--brown);
      margin: 8px 0 6px;
      padding: 4px 10px;
      background: #FFEBC1;
      border-radius: 8px;
      display: inline-block;
      font-weight: 700;
    }
    
    /* 빈 학기 메시지 */
    .empty-msg {
      text-align: center;
      color: var(--text-light);
      font-size: 13px;
      padding: 20px;
    }
    
    /* 로딩 */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      background: var(--beige-card);
      border-radius: 24px;
      box-shadow: var(--shadow-beige);
    }
    .loading-state .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .error-box {
      background: #FEE2E2;
      border-left: 4px solid #DC2626;
      padding: 16px 20px;
      border-radius: 12px;
      color: #991B1B;
      font-size: 14px;
      margin-bottom: 16px;
    }
    
    /* 공유 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-card h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 22px;
      color: var(--primary-dark);
      margin-bottom: 8px;
      text-align: center;
    }
    .modal-card p {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 22px;
    }
    .share-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .share-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 10px;
      background: #f8fbfd;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .share-opt:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .share-opt .icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .share-opt.kakao .icon { background: #FEE500; }
    .share-opt.link .icon { background: var(--primary-soft); color: var(--primary); }
    .share-opt.copy .icon { background: #f1f5f9; }
    .modal-close {
      background: #f1f5f9;
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      font-family: inherit;
      color: var(--text);
    }
    .modal-close:hover { background: #e2e8f0; }
    
    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 200;
      opacity: 0;
      transition: all 0.3s ease;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    @media (max-width: 768px) {
      .header-inner { padding: 14px 18px; }
      main { padding: 24px 16px 60px; }
      .track-card { padding: 24px 18px; }
      .track-title-block .school-name { font-size: 24px; }
      .track-title-block .track-title { font-size: 17px; }
      .grade-title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="dashboard.html">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <span class="brand-name">대전광역시 고등학교 교육과정 업무담당자 워크스페이스</span>
      </a>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div id="content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>트랙을 불러오는 중입니다...</p>
      </div>
    </div>
  </main>

  <!-- 공유 모달 -->
  <div class="modal-overlay" id="shareModal" onclick="if(event.target===this)closeShareModal()">
    <div class="modal-card">
      <h3>트랙 공유하기</h3>
      <p>이 트랙을 다른 사람과 공유해보세요</p>
      <div class="share-options">
        <a class="share-opt kakao" href="#" onclick="shareKakao(event)">
          <span class="icon">💬</span>
          <span>카카오톡</span>
        </a>
        <a class="share-opt link" href="#" onclick="shareLink(event)">
          <span class="icon">🔗</span>
          <span>링크 공유</span>
        </a>
        <a class="share-opt copy" href="#" onclick="copyLink(event)">
          <span class="icon">📋</span>
          <span>URL 복사</span>
        </a>
      </div>
      <button class="modal-close" onclick="closeShareModal()">닫기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    const GOOGLE_API_KEY = 'AIzaSyBC95kjuGRE0cgsHHWWco0-MnBt9XiPfCY';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = null;
    let currentProfile = null;
    let isAdmin = false;
    let currentTrack = null;
    
    const CATEGORY_LABELS = {
      social_science: '사회과학계열',
      business: '경영경제계열',
      engineering: '자연공학계열',
      medical: '의료생명계열',
      other: '기타'
    };
    const SEMESTERS = [
      { key: '1-1', label: '1학기', grade: 1 },
      { key: '1-2', label: '2학기', grade: 1 },
      { key: '2-1', label: '1학기', grade: 2 },
      { key: '2-2', label: '2학기', grade: 2 },
      { key: '3-1', label: '1학기', grade: 3 },
      { key: '3-2', label: '2학기', grade: 3 },
    ];
    const GRADE_GROUPS = [
      { grade: 1, sems: ['1-1', '1-2'] },
      { grade: 2, sems: ['2-1', '2-2'] },
      { grade: 3, sems: ['3-1', '3-2'] },
    ];
    
    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      
      const { data: profile } = await supabase
        .from('profiles')
        .select('display_name, role, school_id, schools(name, code)')
        .eq('id', user.id)
        .single();
      currentProfile = profile;
      isAdmin = profile.role === 'admin';
      
      const userInfoEl = document.getElementById('userInfo');
      if (isAdmin) {
        userInfoEl.innerHTML = `
          <span class="badge badge-admin">관리자</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
      } else {
        userInfoEl.innerHTML = `
          <span class="badge badge-school">${profile.schools.name}</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
      }
      
      const params = new URLSearchParams(window.location.search);
      const trackId = params.get('id');
      if (!trackId) {
        showError('트랙 ID가 지정되지 않았습니다.');
        return;
      }
      
      try {
        await loadAndRender(trackId);
      } catch (err) {
        showError('트랙을 불러올 수 없습니다: ' + err.message);
      }
    }
    
    async function loadAndRender(trackId) {
      const { data: track, error } = await supabase
        .from('tracks')
        .select('*, schools(name, code), curriculums(title, spreadsheet_url)')
        .eq('id', trackId)
        .single();
      
      if (error || !track) {
        showError('트랙을 찾을 수 없습니다.');
        return;
      }
      currentTrack = track;
      
      if (!track.curriculum_id || !track.curriculums) {
        showError('연결된 편성표가 없습니다. 트랙을 수정해주세요.');
        return;
      }
      
      const url = track.curriculums.spreadsheet_url;
      const sheetIdMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (!sheetIdMatch) {
        showError('편성표 URL 형식이 올바르지 않습니다.');
        return;
      }
      const sheetId = sheetIdMatch[1];
      
      const curriculumData = await loadCurriculumFromSheet(sheetId);
      render(track, curriculumData);
    }
    
    async function loadCurriculumFromSheet(sheetId) {
      const sheetName = encodeURIComponent('편성표');
      const range = `${sheetName}!A1:M500`;
      const fields = encodeURIComponent('sheets(merges,data.rowData.values(formattedValue))');
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?ranges=${range}&fields=${fields}&key=${GOOGLE_API_KEY}`;
      
      const res = await fetch(url);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `${res.status} 오류`);
      }
      
      const data = await res.json();
      const sheet = data.sheets[0];
      const merges = sheet.merges || [];
      const rowData = sheet.data[0]?.rowData || [];
      
      const grid = rowData.map(r => 
        (r.values || []).map(c => (c && c.formattedValue) || '')
      );
      
      const expandedGrid = grid.map(r => [...r]);
      for (const m of merges) {
        const startVal = (grid[m.startRowIndex] || [])[m.startColumnIndex] || '';
        for (let r = m.startRowIndex; r < m.endRowIndex; r++) {
          for (let c = m.startColumnIndex; c < m.endColumnIndex; c++) {
            if (!expandedGrid[r]) expandedGrid[r] = [];
            expandedGrid[r][c] = startVal;
          }
        }
      }
      
      const dataStartRow = 3;
      const COL = {
        section: 0, area: 1, subject: 2, type: 3,
        baseCredit: 4, completion: 5,
        sem: { '1-1': 6, '1-2': 7, '2-1': 8, '2-2': 9, '3-1': 10, '3-2': 11 },
        totalCredit: 12,
      };
      
      let endRow = expandedGrid.length;
      for (let r = dataStartRow; r < expandedGrid.length; r++) {
        const text = (expandedGrid[r] || []).join(' ');
        if (text.includes('편성 조건') && text.includes('점검')) {
          endRow = r;
          break;
        }
      }
      
      // 학기별로 정리 (보기는 학기 단위로 카드)
      const semesters = {};
      for (const sem of Object.keys(COL.sem)) {
        semesters[sem] = { fixed: [], choiceGroups: {}, choiceOrder: [] };
      }
      
      for (let r = dataStartRow; r < endRow; r++) {
        const row = expandedGrid[r] || [];
        const sectionRaw = (row[COL.section] || '').toString().trim();
        const area = (row[COL.area] || '').toString().trim();
        const subject = (row[COL.subject] || '').toString().trim();
        const baseCredit = parseFloat(row[COL.baseCredit]) || 0;
        const completion = (row[COL.completion] || '').toString().trim();
        
        if (!subject) continue;
        if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(sectionRaw)) continue;
        if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(subject)) continue;
        
        const isFixed = sectionRaw.includes('학교') && sectionRaw.includes('지정');
        
        const totalCreditCell = (row[COL.totalCredit] || '').toString().trim();
        const totalCreditMatch = totalCreditCell.match(/(\d+(?:\.\d+)?)/);
        const rowTotalCredit = totalCreditMatch ? parseFloat(totalCreditMatch[1]) : null;
        
        for (const [semKey, semCol] of Object.entries(COL.sem)) {
          const cellVal = (row[semCol] || '').toString().trim();
          if (!cellVal) continue;
          
          const isCrossSem = cellVal.includes('학기교차') || cellVal.includes('교차');
          const creditMatch = cellVal.match(/(\d+(?:\.\d+)?)/);
          let cellCredit = creditMatch ? parseFloat(creditMatch[1]) : null;
          
          let credit;
          if (cellCredit !== null && baseCredit > 0 && cellCredit > baseCredit * 1.5) {
            credit = (rowTotalCredit !== null && rowTotalCredit <= baseCredit + 1) ? rowTotalCredit : baseCredit;
          } else if (rowTotalCredit !== null && rowTotalCredit <= baseCredit + 1 && rowTotalCredit > 0) {
            credit = rowTotalCredit;
          } else if (cellCredit !== null) {
            credit = cellCredit;
          } else {
            credit = baseCredit;
          }
          
          const subjInfo = { name: subject, area, credit, crossSem: isCrossSem, rowIndex: r };
          
          if (isFixed) {
            semesters[semKey].fixed.push(subjInfo);
          } else {
            let groupName = '선택';
            let takeN = null;
            let takeMin = null;
            let takeMax = null;
            const groupMatch = completion.match(/(선택군\s*[A-Z\d]+|[A-Z]\s*그룹|선택\s*\w+)/);
            if (groupMatch) groupName = groupMatch[1].replace(/\s+/g, '');
            
            const rangeMatch = completion.match(/택\s*(\d+)\s*[~∼\-–]\s*(\d+)/);
            if (rangeMatch) {
              takeMin = parseInt(rangeMatch[1]);
              takeMax = parseInt(rangeMatch[2]);
              takeN = takeMax;
            } else {
              const takeMatch = completion.match(/택\s*(\d+)/);
              if (takeMatch) takeN = parseInt(takeMatch[1]);
            }
            
            if (!semesters[semKey].choiceGroups[groupName]) {
              semesters[semKey].choiceGroups[groupName] = {
                name: groupName, takeN, takeMin, takeMax, subjects: []
              };
              semesters[semKey].choiceOrder.push(groupName);
            }
            semesters[semKey].choiceGroups[groupName].subjects.push(subjInfo);
          }
        }
      }
      
      // 학기교차 페어링
      function pairCrossSem(sem1Key, sem2Key) {
        const sem1Cross = semesters[sem1Key].fixed.filter(s => s.crossSem).sort((a,b) => a.rowIndex - b.rowIndex);
        const sem2Cross = semesters[sem2Key].fixed.filter(s => s.crossSem).sort((a,b) => a.rowIndex - b.rowIndex);
        const sem1RowIdx = new Set(sem1Cross.map(s => s.rowIndex));
        const sem2RowIdx = new Set(sem2Cross.map(s => s.rowIndex));
        const commonRowIdx = [...sem1RowIdx].filter(idx => sem2RowIdx.has(idx)).sort((a,b) => a - b);
        commonRowIdx.forEach((rowIdx, i) => {
          if (i % 2 === 0) {
            const idx = semesters[sem2Key].fixed.findIndex(s => s.rowIndex === rowIdx);
            if (idx >= 0) semesters[sem2Key].fixed.splice(idx, 1);
          } else {
            const idx = semesters[sem1Key].fixed.findIndex(s => s.rowIndex === rowIdx);
            if (idx >= 0) semesters[sem1Key].fixed.splice(idx, 1);
          }
        });
      }
      pairCrossSem('1-1', '1-2');
      pairCrossSem('2-1', '2-2');
      pairCrossSem('3-1', '3-2');
      
      return { semesters };
    }
    
    function render(track, curriculumData) {
      // 선택 데이터 정규화
      const selections = {};
      for (const [semKey, semData] of Object.entries(track.recommended_subjects || {})) {
        selections[semKey] = {};
        if (Array.isArray(semData)) {
          for (const name of semData) selections[semKey][name] = 'recommend';
        } else if (semData && typeof semData === 'object') {
          for (const name of (semData.core || [])) selections[semKey][name] = 'core';
          for (const name of (semData.recommend || [])) selections[semKey][name] = 'recommend';
        }
      }
      
      const editLink = isAdmin || (currentProfile.school_id === track.school_id);
      const editBtn = editLink ? `<a class="top-btn primary" href="track-edit.html?id=${track.id}">✎ 수정</a>` : '';
      
      const gradesHtml = GRADE_GROUPS.map(g => renderGrade(g, curriculumData, selections)).join('');
      
      const content = `
        <div class="page-header-bar">
          <a class="top-btn" href="track.html">← 트랙 목록</a>
          <div class="top-actions">
            <button class="top-btn pdf" onclick="downloadPDF()">📄 PDF 저장</button>
            <button class="top-btn share" onclick="openShareModal()">↗ 공유</button>
            ${editBtn}
          </div>
        </div>
        
        <div class="track-card" id="trackCardForPdf">
          <div class="track-title-block">
            <div class="school-name">${escapeHtml(track.schools.name)}</div>
            <div class="track-title">${escapeHtml(track.title)}</div>
            <div class="meta-line">
              <span class="category-tag cat-${track.track_category}">${CATEGORY_LABELS[track.track_category]}</span>
              <span>📄 ${escapeHtml(track.curriculums.title)}</span>
            </div>
          </div>
          
          ${track.description ? `<div class="description-box">${escapeHtml(track.description)}</div>` : ''}
          
          <div class="legend-chips">
            <div class="legend-chip"><span class="dot fixed"></span>학교지정 (필수)</div>
            <div class="legend-chip"><span class="dot core"></span>⭐ 핵심 추천</div>
            <div class="legend-chip"><span class="dot recommend"></span>✓ 권장</div>
          </div>
          
          ${gradesHtml}
        </div>
      `;
      
      document.getElementById('content').innerHTML = content;
    }
    
    function renderGrade(gradeGroup, curriculumData, selections) {
      const semCards = gradeGroup.sems.map(semKey => 
        renderSemesterCard(semKey, curriculumData.semesters[semKey], selections[semKey] || {})
      ).join('');
      
      return `
        <div class="grade-section">
          <div class="grade-title">
            <span class="grade-title-icon">${gradeGroup.grade}</span>
            ${gradeGroup.grade}학년
          </div>
          <div class="semester-row">
            ${semCards}
          </div>
        </div>
      `;
    }
    
    function renderSemesterCard(semKey, semData, semSelections) {
      const semObj = SEMESTERS.find(s => s.key === semKey);
      const label = semObj ? `${semObj.grade}학년 ${semObj.label}` : semKey;
      
      if (!semData) {
        return `
          <div class="semester-card">
            <div class="semester-header">
              <div class="semester-label">${label}</div>
            </div>
            <div class="empty-msg">데이터 없음</div>
          </div>
        `;
      }
      
      // 학교지정 + 선택한 과목들로 학점 계산
      let totalCredit = 0;
      
      // 학교지정 과목 카드 + 영역별 그룹화
      const fixedByArea = {};
      const fixedAreaOrder = [];
      for (const s of semData.fixed) {
        totalCredit += s.credit || 0;
        if (!fixedByArea[s.area]) {
          fixedByArea[s.area] = [];
          fixedAreaOrder.push(s.area);
        }
        fixedByArea[s.area].push(s);
      }
      
      const fixedHtml = fixedAreaOrder.length > 0 ? fixedAreaOrder.map(area => `
        <div class="area-block">
          <div class="area-label">📌 ${escapeHtml(area)}</div>
          ${fixedByArea[area].map(s => `
            <div class="subject-card fixed">
              <span class="subject-check">✓</span>
              <div class="subject-info">
                <div class="subject-row-top">
                  <span class="subject-name">${escapeHtml(s.name)}</span>
                  <span class="subject-tags"><span class="stag stag-fixed">학교지정</span></span>
                </div>
              </div>
              <span class="subject-credit">${s.credit}학점</span>
            </div>
          `).join('')}
        </div>
      `).join('') : '';
      
      // 선택 그룹별
      let selectedAny = false;
      const choiceHtml = semData.choiceOrder.map(groupName => {
        const group = semData.choiceGroups[groupName];
        const items = group.subjects.filter(s => semSelections[s.name]);
        if (items.length === 0) return '';
        selectedAny = true;
        
        const takeText = group.takeMin && group.takeMax 
          ? `중 택 ${group.takeMin}~${group.takeMax}개`
          : group.takeN ? `중 택 ${group.takeN}개` : '';
        
        const itemsHtml = items.map(s => {
          const lv = semSelections[s.name];
          totalCredit += s.credit || 0;
          const cardClass = lv === 'core' ? 'core' : 'recommend';
          const tagHtml = lv === 'core' 
            ? '<span class="stag stag-core">⭐ 핵심</span>' 
            : '<span class="stag stag-recommend">✓ 권장</span>';
          return `
            <div class="subject-card ${cardClass}">
              <span class="subject-check">✓</span>
              <div class="subject-info">
                <div class="subject-row-top">
                  <span class="subject-name">${escapeHtml(s.name)}</span>
                  <span class="subject-tags">${tagHtml}</span>
                </div>
              </div>
              <span class="subject-credit">${s.credit}학점</span>
            </div>
          `;
        }).join('');
        
        return `
          <div class="area-block">
            <div class="choice-group-label">${escapeHtml(groupName)}${takeText ? ' · ' + takeText : ''}</div>
            ${itemsHtml}
          </div>
        `;
      }).join('');
      
      const hasContent = fixedHtml || choiceHtml;
      
      return `
        <div class="semester-card">
          <div class="semester-header">
            <div class="semester-label">${label}</div>
            ${hasContent ? `<div class="semester-credit-chip">${totalCredit}학점</div>` : ''}
          </div>
          ${hasContent ? (fixedHtml + choiceHtml) : '<div class="empty-msg">선택된 과목이 없습니다</div>'}
        </div>
      `;
    }
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    
    function showError(msg) {
      document.getElementById('content').innerHTML = `
        <div class="page-header-bar">
          <a class="top-btn" href="track.html">← 트랙 목록</a>
        </div>
        <div class="track-card">
          <div class="error-box">${escapeHtml(msg)}</div>
        </div>
      `;
    }
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    // ============================================
    // PDF 저장
    // ============================================
    window.downloadPDF = async function() {
      const card = document.getElementById('trackCardForPdf');
      if (!card) return;
      
      showToast('PDF를 만드는 중입니다...');
      
      try {
        const canvas = await html2canvas(card, {
          scale: 2,
          backgroundColor: '#FFFBF0',
          useCORS: true,
          logging: false,
        });
        
        const imgWidth = 210; // A4
        const pageHeight = 297;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        let heightLeft = imgHeight;
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        let position = 0;
        
        pdf.addImage(canvas, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        
        while (heightLeft > 0) {
          position -= pageHeight;
          pdf.addPage();
          pdf.addImage(canvas, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }
        
        const filename = `${currentTrack.schools.name}_${currentTrack.title}.pdf`.replace(/[\\/:*?"<>|]/g, '_');
        pdf.save(filename);
        showToast('PDF가 저장되었습니다.');
      } catch (err) {
        console.error(err);
        showToast('PDF 저장 실패: ' + err.message);
      }
    };
    
    // ============================================
    // 공유 기능
    // ============================================
    window.openShareModal = function() {
      document.getElementById('shareModal').classList.add('show');
    };
    window.closeShareModal = function() {
      document.getElementById('shareModal').classList.remove('show');
    };
    
    window.shareKakao = function(e) {
      e.preventDefault();
      const url = window.location.href;
      const title = `${currentTrack.schools.name} - ${currentTrack.title}`;
      const text = `${title}\n${url}`;
      // 모바일 카카오톡 공유 (URL Scheme)
      const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
      if (isMobile) {
        window.location.href = `kakaotalk://msg/text?text=${encodeURIComponent(text)}`;
        setTimeout(() => {
          // 카카오톡 안 깔린 경우 클립보드 복사로 폴백
          navigator.clipboard.writeText(text).then(() => {
            showToast('카카오톡이 열리지 않으면, 복사된 텍스트를 붙여넣어 공유하세요');
          });
        }, 1500);
      } else {
        // PC: 클립보드 복사 후 안내
        navigator.clipboard.writeText(text).then(() => {
          showToast('링크가 복사되었습니다. 카카오톡에 붙여넣어 공유하세요');
        });
      }
      closeShareModal();
    };
    
    window.shareLink = async function(e) {
      e.preventDefault();
      const url = window.location.href;
      const title = `${currentTrack.schools.name} - ${currentTrack.title}`;
      
      if (navigator.share) {
        try {
          await navigator.share({ title, url });
          closeShareModal();
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      } else {
        copyLink(e);
      }
    };
    
    window.copyLink = function(e) {
      e.preventDefault();
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        showToast('URL이 복사되었습니다');
        closeShareModal();
      }).catch(() => {
        showToast('복사에 실패했습니다');
      });
    };
    
    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };
    
    init();
  </script>
