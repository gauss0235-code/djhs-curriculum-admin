<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="shortcut icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <title>교육과정 편성표 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <meta name="description" content="대전광역시 고등학교별 교육과정 편성표를 관리합니다.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --border-strong: #b8d4e8;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      --danger: #DC2626;
      --danger-soft: #fdeaea;
      --green: #7cb342;
      --green-soft: #eef7e3;
      --orange: #f4a261;
      --orange-soft: #fef0e3;
      --blue: #5a9fd4;
      --blue-soft: #e3f0fa;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 32px rgba(74, 144, 217, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-school {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .badge-admin {
      background: var(--admin-soft);
      color: var(--admin);
    }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: #374151;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .logout-btn:hover {
      background: #1f2937;
    }
    /* 토스트 메시지 (성공/에러 알림) */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-dark);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-weight: normal;
      font-size: 15px;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      max-width: calc(100vw - 40px);
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    .toast.success { background: #16A34A; }

    /* 정보수정 버튼: 로그아웃과 같은 크기, 색상만 살짝 강조 */
    .profile-btn {
      background: #374151;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .profile-btn:hover {
      background: #1f2937;
    }
    /* 비밀번호 변경 모달 */
    .pw-modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .pw-modal-bg.hidden { display: none; }
    .pw-modal {
      background: white;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .pw-modal h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 24px;
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-weight: normal;
    }
    .pw-modal .pw-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .pw-field { margin-bottom: 16px; }
    .pw-field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .pw-field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .pw-field input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .pw-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .pw-btn-cancel {
      background: white;
      border: 1.5px solid var(--border);
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }
    .pw-btn-cancel:hover { background: var(--bg-sky, #f4f8fc); }
    .pw-btn-submit {
      background: var(--primary);
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      color: white;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .pw-btn-submit:hover { background: var(--primary-hover, var(--primary-dark)); }
    .pw-btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 36px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 32px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .page-header .desc {
      font-size: 16px;
      color: var(--text-muted);
    }
    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      border-color: var(--border-strong);
      background: var(--bg-sky);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #6B7280;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(107, 114, 128, 0.3);
      text-decoration: none;
    }
    .back-btn:hover {
      background: #4B5563;
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(107, 114, 128, 0.4);
    }
    .filter-bar {
      background: white;
      border: 1.5px solid #E5E7EB;
      padding: 18px 24px;
      border-radius: 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(120, 80, 30, 0.06);
    }
    .filter-bar label {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 15px;
      color: #4A8AB8;
    }
    .filter-bar select {
      padding: 11px 16px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      color: #2C3E50;
      flex: 1;
      max-width: 320px;
      cursor: pointer;
    }
    .filter-bar select:focus {
      outline: none;
      border-color: #4A8AB8;
      box-shadow: 0 0 0 3px rgba(74, 138, 184, 0.15);
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #6B7280;
      background: white;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(120, 80, 30, 0.06);
    }
    .empty-state .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      color: #4A8AB8;
      background: #FFF8E7;
      border: 2px dashed #F59E0B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-state .icon svg {
      width: 34px;
      height: 34px;
      color: #F59E0B;
    }
    .empty-state p {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 18px;
      margin-bottom: 8px;
      color: #4A8AB8;
    }
    .empty-state p:last-child {
      font-family: 'Pretendard', sans-serif;
      color: #6B7280;
      font-size: 14px;
      font-weight: 400;
    }
    .sheet-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sheet-item {
      background: var(--surface);
      border: 2px solid transparent;
      padding: 24px 28px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-soft);
    }
    .sheet-item:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }
    .sheet-info { flex: 1; min-width: 0; }
    .sheet-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .sheet-title-row h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 18px;
      font-weight: normal;
      color: #2C3E50;
    }
    .type-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .type-practice {
      background: var(--green-soft);
      color: var(--green);
    }
    .type-first_draft {
      background: var(--orange-soft);
      color: var(--orange);
    }
    .type-second_draft {
      background: #f0e9fa;
      color: #9b6fc9;
    }
    .type-final {
      background: var(--blue-soft);
      color: var(--blue);
    }
    .sheet-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 6px;
    }
    .sheet-meta {
      font-size: 13px;
      color: #6B7280;
    }
    .sheet-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }
    /* 열기/수정/삭제 버튼 공통 (이전 수정/삭제 버튼 크기 기준) */
    .open-btn, .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      font-family: inherit;
      color: white;
      transition: all 0.15s ease;
      box-sizing: border-box;
      vertical-align: middle;
    }
    
    /* 열기 버튼 (베이지 - Track의 보기 버튼과 동일) */
    .open-btn {
      background: #D4A574;
      box-shadow: 0 2px 8px rgba(212, 165, 116, 0.25);
    }
    .open-btn:hover {
      background: #B8895A;
    }
    
    /* 수정 버튼 (하늘색 - Track의 수정과 동일) */
    .icon-btn {
      background: var(--primary);
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .icon-btn:hover {
      background: var(--primary-hover);
    }
    
    /* 삭제 버튼 (핑크 - Track의 삭제와 동일) */
    .icon-btn.danger {
      background: #ec6f8e;
      box-shadow: 0 2px 8px rgba(236, 111, 142, 0.25);
    }
    .icon-btn.danger:hover {
      background: #d65878;
    }
    .modal-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30, 58, 95, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-bg.hidden { display: none; }
    .modal {
      background: var(--surface);
      padding: 36px;
      border-radius: 24px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(30, 58, 95, 0.3);
    }
    .modal h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 22px;
      font-weight: normal;
      color: var(--primary-dark);
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: #f8fbfd;
      transition: all 0.15s ease;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .field textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.5;
    }
    .form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .hidden { display: none !important; }
    footer {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 28px 32px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .header-inner { padding: 14px 18px; }
      main { padding: 32px 18px 60px; }
      .page-header h2 { font-size: 24px; }
      .page-header .desc { font-size: 14px; }
      .user-info { font-size: 12px; gap: 4px; }
      .profile-btn, .logout-btn { padding: 6px 12px; font-size: 12px; }
      .brand-line1, .brand-line2 { display: block; }
      .brand-name { font-size: 15px; line-height: 1.25; }
      .sheet-item { flex-direction: column; align-items: stretch; padding: 20px 22px; }
      .sheet-actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="dashboard.html">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <div class="brand-text">
          <span class="brand-name"><span class="brand-line1">대전광역시 고등학교</span> <span class="brand-line2">교육과정 업무담당자 워크스페이스</span></span>
        </div>
      </a>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div class="page-header">
      <div>
        <h2 id="pageTitle">&nbsp;</h2>
        <div class="desc" id="pageDesc">교육과정 편성표를 확인하세요.</div>
      </div>
      <div class="page-header-actions">
        <button id="addBtn" class="btn-primary hidden" onclick="showAddForm()">+ 새 교육과정 편성표 등록</button>
        <a class="back-btn" href="dashboard.html">← 대시보드로</a>
      </div>
    </div>
    
    <div id="schoolFilter" class="filter-bar hidden">
      <label>🏫 학교 선택</label>
      <select id="schoolSelect" onchange="loadSheets()">
        <option value="">학교를 선택하세요</option>
      </select>
    </div>
    
    <div id="sheetList">
      <div class="empty-state">
        <div class="icon">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <p>불러오는 중...</p>
      </div>
    </div>
  </main>
  
  <footer>
    Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.
  </footer>
  
  <div id="modal" class="modal-bg hidden">
    <div class="modal">
      <h3 id="modalTitle">새 교육과정 편성표 등록</h3>
      <div class="field">
        <label>학교 *</label>
        <select id="formSchool"></select>
      </div>
      <div class="field">
        <label>제목 *</label>
        <input type="text" id="formTitle" placeholder="예: 2027학년도 입학생 교육과정 편성표 - 연습용">
      </div>
      <div class="field">
        <label>종류 *</label>
        <select id="formType" onchange="updateTitlePlaceholder()">
          <option value="practice">연습용</option>
          <option value="first_draft">1차본</option>
          <option value="second_draft">2차본</option>
          <option value="final">최종본</option>
        </select>
      </div>
      <div class="field">
        <label>교육과정 편성표(스프레드시트, PDF) URL *</label>
        <input type="url" id="formUrl" placeholder="https://docs.google.com/spreadsheets/d/...">
      </div>
      <div class="field">

    function toReadOnlyUrl(url) {
      if (!url) return url;
      // 구글 스프레드시트 URL 패턴 감지
      const sheetsPattern = /docs\.google\.com\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/;
      const match = url.match(sheetsPattern);
      if (!match) return url; // 구글 시트가 아니면 변환 안 함
      
      // 시트 ID 추출
      const sheetId = match[1];
      // preview 모드 URL로 변환 (편집 불가, 모든 탭 보기 가능)
      return `https://docs.google.com/spreadsheets/d/${sheetId}/preview`;

          <span class="badge badge-admin">교육과정지원단</span>

          <button class="profile-btn" onclick="openPasswordModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>정보수정</button>
          <button class="logout-btn" onclick="handleLogout()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>로그아웃</button>

        document.getElementById('pageTitle').textContent = '교육과정 편성표 조회';
        document.title = '교육과정 편성표 조회' + TITLE_SUFFIX;
        document.getElementById('schoolFilter').classList.remove('hidden');
        document.getElementById('pageDesc').textContent = '학교를 선택해서 등록된 교육과정 편성표를 조회하세요. (구글 스프레드시트는 읽기 전용으로 열립니다)';
        await loadSchools();
      } else {
        userInfoEl.innerHTML = `
          <span class="badge badge-school">${profile.schools.name}</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="profile-btn" onclick="openPasswordModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>정보수정</button>

    async function loadSchools() {
      const { data, error } = await supabase
        .from('schools')
        .select('id, name, code')
        .order('name');
      
      if (error) { console.error(error); return; }
      
      const select = document.getElementById('schoolSelect');
      select.innerHTML = '<option value="">학교를 선택하세요</option>' + 
        data.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      
      const formSelect = document.getElementById('formSchool');
      formSelect.innerHTML = data.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }
    
    window.loadSheets = async function() {
      const listEl = document.getElementById('sheetList');
      
      let schoolId;
      if (isAdmin || isSupport) {
        schoolId = document.getElementById('schoolSelect').value;
        if (!schoolId) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="icon">${EMPTY_ICONS.school}</div>
              <p>위에서 학교를 선택하세요</p>
              <p>선택한 학교의 교육과정 편성표가 표시됩니다</p>
            </div>
          `;
          return;
        }
      } else {
        schoolId = currentProfile.school_id;
      }
      
      const { data, error } = await supabase
        .from('curriculums')
        .select('*')
        .eq('school_id', schoolId)
        .order('display_order', { ascending: true })
        .order('created_at', { ascending: true });
      
      if (error) {
        listEl.innerHTML = `<div class="empty-state" style="color: var(--danger);">오류: ${error.message}</div>`;
        return;
      }
      
      if (!data || data.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">${EMPTY_ICONS.empty}</div>
            <p>아직 등록된 교육과정 편성표가 없어요</p>
            <p>${isAdmin ? '위 버튼으로 새 교육과정 편성표를 등록해보세요' : '지원단에서 교육과정 편성표를 등록하면 여기에 표시됩니다'}</p>
          </div>
        `;
        return;
      }
      
      listEl.innerHTML = `<div class="sheet-list">` + data.map(item => {
        const updatedDate = new Date(item.updated_at).toLocaleString('ko-KR', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false
        });
        return `
          <div class="sheet-item">
            <div class="sheet-info">
              <div class="sheet-title-row">
                <h3>${item.title}</h3>
                <span class="type-tag type-${item.sheet_type}">${TYPE_LABELS[item.sheet_type]}</span>
              </div>
              ${item.description ? `<div class="sheet-desc">${item.description}</div>` : ''}
              <div class="sheet-meta">최종 수정 ${updatedDate}</div>
            </div>
            <div class="sheet-actions">
              <a class="open-btn" href="${isSupport ? toReadOnlyUrl(item.spreadsheet_url) : item.spreadsheet_url}" target="_blank">열기 ↗</a>
              ${isAdmin ? `
                <button class="icon-btn" onclick="editSheet('${item.id}')">✎ 수정</button>
                <button class="icon-btn danger" onclick="deleteSheet('${item.id}')">🗑 삭제</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    };
    
    window.showAddForm = function() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '새 교육과정 편성표 등록';
      document.getElementById('formTitle').value = '';
      document.getElementById('formType').value = 'practice';
      document.getElementById('formUrl').value = '';
      document.getElementById('formDesc').value = '';
      window.updateTitlePlaceholder();
      
      const selectedSchool = document.getElementById('schoolSelect').value;
      if (selectedSchool) {
        document.getElementById('formSchool').value = selectedSchool;
      }
      document.getElementById('modal').classList.remove('hidden');
    };
    
    window.editSheet = async function(id) {
      const { data } = await supabase
        .from('curriculums').select('*').eq('id', id).single();
      if (!data) return;
      
      editingId = id;
      document.getElementById('modalTitle').textContent = '교육과정 편성표 수정';
      document.getElementById('formSchool').value = data.school_id;
      document.getElementById('formTitle').value = data.title;
      document.getElementById('formType').value = data.sheet_type;
      document.getElementById('formUrl').value = data.spreadsheet_url;
      document.getElementById('formDesc').value = data.description || '';
      document.getElementById('modal').classList.remove('hidden');
    };
    
    window.hideModal = function() {
      document.getElementById('modal').classList.add('hidden');
      editingId = null;
    };
    
    window.saveSheet = async function() {
      const school_id = document.getElementById('formSchool').value;
      const title = document.getElementById('formTitle').value.trim();
      const sheet_type = document.getElementById('formType').value;
      const spreadsheet_url = document.getElementById('formUrl').value.trim();
      const description = document.getElementById('formDesc').value.trim();
      
      if (!title || !spreadsheet_url) {
        alert('제목과 URL은 필수입니다.');
        return;
      }
      
      if (editingId) {
        const { error } = await supabase
          .from('curriculums')
          .update({ school_id, title, sheet_type, spreadsheet_url, description: description || null })
          .eq('id', editingId);
        if (error) { alert('수정 실패: ' + error.message); return; }
      } else {
        const { error } = await supabase
          .from('curriculums')
          .insert({ school_id, title, sheet_type, spreadsheet_url, description: description || null, created_by: currentUser.id });
        if (error) { alert('등록 실패: ' + error.message); return; }
      }
      
      hideModal();
      loadSheets();
    };
    
    window.deleteSheet = async function(id) {
      const ok = confirm('정말 삭제하시겠습니까?');
      if (!ok) return;
      
      const { error } = await supabase.from('curriculums').delete().eq('id', id);
      if (error) { alert('삭제 실패: ' + error.message); return; }
      loadSheets();
    };
    
    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };    
    // ====== 토스트 메시지 ======
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = `toast ${type}`; }, 3000);
    }
    
    // ====== 비밀번호 변경 (본인) ======
    window.openPasswordModal = function() {
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwNew').value = '';
      document.getElementById('pwConfirm').value = '';
      document.getElementById('pwModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('pwCurrent').focus(), 50);
    };
    
    window.closePasswordModal = function() {
      document.getElementById('pwModal').classList.add('hidden');
    };
    
    window.submitPasswordChange = async function() {
      const currentPw = document.getElementById('pwCurrent').value;
      const newPw = document.getElementById('pwNew').value;
      const confirmPw = document.getElementById('pwConfirm').value;
      
      if (!currentPw || !newPw || !confirmPw) {
        showToast('❌ 모든 항목을 입력하세요', 'error');
        return;
      }
      if (newPw.length < 6) {
        showToast('❌ 새 비밀번호는 6자 이상이어야 합니다', 'error');
        return;
      }
      if (newPw !== confirmPw) {
        showToast('❌ 새 비밀번호와 확인이 일치하지 않습니다', 'error');
        return;
      }
      if (currentPw === newPw) {
        showToast('❌ 현재 비밀번호와 새 비밀번호가 같습니다', 'error');
        return;
      }
      
      const btn = document.getElementById('pwSubmitBtn');
      btn.disabled = true;
      btn.textContent = '변경 중...';
      
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user || !user.email) {
          showToast('❌ 사용자 정보를 가져올 수 없습니다', 'error');
          return;
        }
        
        const verifyResp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: user.email, password: currentPw })
        });
        
        if (!verifyResp.ok) {
          showToast('❌ 현재 비밀번호가 올바르지 않습니다', 'error');
          return;
        }
        
        const { error } = await supabase.auth.updateUser({ password: newPw });
        if (error) {
          showToast('❌ 비밀번호 변경 실패: ' + error.message, 'error');
          return;
        }
        
        showToast('✅ 비밀번호가 변경되었습니다', 'success');
        closePasswordModal();
      } catch (e) {
        showToast('❌ 오류: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '변경';
      }
    };

    
    init();
  </script>

  <!-- 비밀번호 변경 모달 -->

    <div class="pw-modal">
      <h3>비밀번호 변경</h3>
      <div class="pw-desc">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</div>
      <div class="pw-field">
        <label>현재 비밀번호</label>
        <input type="password" id="pwCurrent" autocomplete="current-password">
      </div>
      <div class="pw-field">
        <label>새 비밀번호 (6자 이상)</label>
        <input type="password" id="pwNew" autocomplete="new-password">
      </div>
      <div class="pw-field">
        <label>새 비밀번호 확인</label>
        <input type="password" id="pwConfirm" autocomplete="new-password">
      </div>
      <div class="pw-actions">
        <button class="pw-btn-cancel" onclick="closePasswordModal()">취소</button>
        <button class="pw-btn-submit" id="pwSubmitBtn" onclick="submitPasswordChange()">변경</button>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 -->
  <div class="toast" id="toast"></div>

</body>
</html>
