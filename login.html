<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      overflow: hidden;
      background: transparent;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand h1 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 24px;
      font-weight: normal;
      letter-spacing: -0.01em;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow-md);
    }
    .card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      transition: all 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    button {
      width: 100%;
      padding: 12px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 6px;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled {
      background: var(--text-light);
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      line-height: 1.5;
    }
    .message.error {
      background: var(--danger-soft);
      color: var(--danger);
      display: block;
    }
    .message.success {
      background: var(--success-soft);
      color: var(--success);
      display: block;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
      <h1>대전광역시 고등학교<br>교육과정 업무담당자 워크스페이스</h1>
    </div>
    
    <div class="card">
      <h2>교육과정 업무담당자 로그인</h2>
      
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일 주소를 입력하세요">
      </div>
      
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요">
      </div>
      
      <button id="loginBtn" onclick="handleLogin()">로그인</button>
      
      <div id="message" class="message"></div>
    </div>
    
    <div class="footer">Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.</div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    window.handleLogin = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');
      const btn = document.getElementById('loginBtn');
      
      if (!email || !password) {
        messageEl.className = 'message error';
        messageEl.textContent = '이메일과 비밀번호를 입력해주세요.';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = '로그인 중...';
      
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      if (error) {
        messageEl.className = 'message error';
        messageEl.textContent = '로그인 실패: ' + error.message;
        btn.disabled = false;
        btn.textContent = '로그인';
        return;
      }
      
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('display_name, role, schools(name, code)')
        .eq('id', data.user.id)
        .single();
      
      if (profileError) {
        messageEl.className = 'message error';
        messageEl.textContent = '프로필 정보를 가져오지 못했습니다: ' + profileError.message;
        btn.disabled = false;
        btn.textContent = '로그인';
        return;
      }
      
      messageEl.className = 'message success';
      if (profile.role === 'admin') {
        messageEl.textContent = `관리자(${profile.display_name})로 로그인했습니다.`;
      } else if (profile.schools) {
        messageEl.textContent = `${profile.schools.name} 담당자(${profile.display_name})로 로그인했습니다.`;
      } else {
        messageEl.textContent = `${profile.display_name}로 로그인했습니다.`;
      }
      
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    };
    
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') window.handleLogin();
    });
  </script>
</body>
</html>
