<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <title>대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --border-strong: #b8d4e8;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --accent: #ffd966;
      --danger: #e57373;
      --danger-soft: #fdeaea;
      --success: #66bb6a;
      --success-soft: #e8f5e9;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 32px rgba(74, 144, 217, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 100px;
      pointer-events: none;
    }
    .cloud-1 {
      width: 100px;
      height: 30px;
      top: 10%;
      left: 8%;
    }
    .cloud-2 {
      width: 140px;
      height: 36px;
      top: 25%;
      right: 12%;
    }
    .cloud-3 {
      width: 80px;
      height: 24px;
      bottom: 18%;
      left: 15%;
    }
    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand h1 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 24px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .brand p {
      font-size: 14px;
      color: var(--text-muted);
    }
    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 36px;
      box-shadow: var(--shadow-card);
    }
    .card h2 {
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 26px;
      text-align: center;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: #f8fbfd;
      transition: all 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    button {
      width: 100%;
      padding: 14px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 10px;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled {
      background: var(--text-light);
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      line-height: 1.5;
      text-align: center;
    }
    .message.error {
      background: var(--danger-soft);
      color: var(--danger);
      display: block;
    }
    .message.success {
      background: var(--success-soft);
      color: var(--success);
      display: block;
    }
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-light);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
      <h1>대전광역시 고등학교<br>교육과정 업무담당자 워크스페이스</h1>
    </div>
    
    <div class="card">
      <h2>교육과정 업무담당자 로그인</h2>
      
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일 주소를 입력하세요">
      </div>
      
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요">
      </div>
      
      <button id="loginBtn" onclick="handleLogin()">로그인</button>
      
      <div id="message" class="message"></div>
    </div>
    
    <div class="footer">Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.</div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    window.handleLogin = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');
      const btn = document.getElementById('loginBtn');
      
      if (!email || !password) {
        messageEl.className = 'message error';
        messageEl.textContent = '이메일과 비밀번호를 입력해주세요.';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = '로그인 중...';
      
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      if (error) {
        messageEl.className = 'message error';
        messageEl.textContent = '로그인 실패: ' + error.message;
        btn.disabled = false;
        btn.textContent = '로그인';
        return;
      }
      
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('display_name, role, schools(name, code)')
        .eq('id', data.user.id)
        .single();
      
      if (profileError) {
        messageEl.className = 'message error';
        messageEl.textContent = '프로필 정보를 가져오지 못했습니다: ' + profileError.message;
        btn.disabled = false;
        btn.textContent = '로그인';
        return;
      }
      
      messageEl.className = 'message success';
      if (profile.role === 'admin') {
        messageEl.textContent = `관리자(${profile.display_name})로 로그인했습니다.`;
      } else if (profile.schools) {
        messageEl.textContent = `${profile.schools.name} 담당자(${profile.display_name})로 로그인했습니다.`;
      } else {
        messageEl.textContent = `${profile.display_name}로 로그인했습니다.`;
      }
      
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    };
    
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') window.handleLogin();
    });
  </script>
</body>
</html>
