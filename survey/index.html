<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="shortcut icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <title>공동교육과정 만족도 조사 결과 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <meta name="description" content="대전 너두나두 공동교육과정 학생 만족도 조사 결과 화면입니다.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap">
  <link rel="preload" href="../fonts/Paperlogy-7Bold.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Paperlogy';
      src: url('../fonts/Paperlogy-7Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --border-strong: #b8d4e8;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --danger: #DC2626;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --accent: #ffd966;
      --accent-soft: #fff8e1;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 32px rgba(74, 144, 217, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Asta Sans', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .brand-name {
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-school {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .badge-admin {
      background: var(--admin-soft);
      color: var(--admin);
    }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: #374151;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .logout-btn:hover {
      background: #1f2937;
    }
    /* 토스트 메시지 (성공/에러 알림) */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-dark);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      max-width: calc(100vw - 40px);
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    .toast.success { background: #16A34A; }

    /* 정보수정 버튼: 로그아웃과 같은 크기, 색상만 살짝 강조 */
    .profile-btn {
      background: #374151;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .profile-btn:hover {
      background: #1f2937;
    }
    /* 비밀번호 변경 모달 */
    .pw-modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .pw-modal-bg.hidden { display: none; }
    .pw-modal {
      background: white;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .pw-modal h3 {
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-size: 24px;
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .pw-modal .pw-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .pw-field { margin-bottom: 16px; }
    .pw-field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .pw-field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .pw-field input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .pw-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .pw-btn-cancel {
      background: white;
      border: 1.5px solid var(--border);
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }
    .pw-btn-cancel:hover { background: var(--bg-sky, #f4f8fc); }
    .pw-btn-submit {
      background: var(--primary);
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      color: white;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .pw-btn-submit:hover { background: var(--primary-hover, var(--primary-dark)); }
    .pw-btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 36px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .page-header .desc {
      font-size: 16px;
      color: var(--text-muted);
    }
    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #6B7280;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(107, 114, 128, 0.3);
      text-decoration: none;
    }
    .back-btn:hover {
      background: #4B5563;
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(107, 114, 128, 0.4);
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #6B7280;
      background: white;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(120, 80, 30, 0.06);
    }
    .empty-state .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      color: #4A8AB8;
      background: #FFF8E7;
      border: 2px dashed #F59E0B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-state .icon svg {
      width: 34px;
      height: 34px;
      color: #F59E0B;
    }
    .empty-state p {
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 8px;
      color: #4A8AB8;
    }
    .empty-state p:last-child {
      font-family: 'Asta Sans', 'Malgun Gothic', sans-serif;
      color: #6B7280;
      font-size: 14px;
      font-weight: 400;
    }
    footer {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 28px 32px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .header-inner { padding: 14px 18px; }
      main { padding: 32px 18px 60px; }
      .page-header h2 { font-size: 24px; }
      .page-header .desc { font-size: 14px; }
      .user-info { font-size: 12px; gap: 4px; }
      .profile-btn, .logout-btn { padding: 6px 12px; font-size: 12px; }
      .brand-line1, .brand-line2 { display: block; }
      .brand-name { font-size: 15px; line-height: 1.25; }
      .empty-state { padding: 56px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="../dashboard.html">
        <div class="brand-mark"><img src="../images/logo.png" alt="대전광역시교육청"></div>
        <div class="brand-text">
          <span class="brand-name"><span class="brand-line1">대전광역시 고등학교</span> <span class="brand-line2">교육과정 업무담당자 워크스페이스</span></span>
        </div>
      </a>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div>
        <h2 id="pageTitle">공동교육과정 만족도 조사 결과</h2>
        <div class="desc" id="pageDesc">대전 너두나두 공동교육과정 학생 만족도 조사 결과입니다.</div>
      </div>
      <div class="page-header-actions">
        <a class="back-btn" href="../dashboard.html">← 대시보드로</a>
      </div>
    </div>

    <div id="content">
      <div class="empty-state">
        <div class="icon">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <p>불러오는 중...</p>
      </div>
    </div>
  </main>

  <footer>
    Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const ICON_SVG = {
      profile: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
      logout: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
      survey: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>`
    };

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = '../login.html';
        return;
      }

      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('display_name, role, school_id, schools(name, code)')
        .eq('id', user.id)
        .single();

      if (profileError || !profile) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>프로필을 불러오지 못했습니다.</p>
            <p>${profileError ? profileError.message : '잠시 후 다시 시도해 주세요.'}</p>
          </div>`;
        return;
      }

      const isAdmin = profile.role === 'admin';
      const isSupport = profile.role === 'support';
      const schoolName = profile.schools ? profile.schools.name : '소속 학교 미지정';

      const badge = isAdmin
        ? '<span class="badge badge-admin">관리자</span>'
        : isSupport
          ? '<span class="badge badge-admin">교육과정지원단</span>'
          : `<span class="badge badge-school">${schoolName}</span>`;
      document.getElementById('userInfo').innerHTML = `
        ${badge}
        <span class="user-name">${profile.display_name}</span>
        <button class="profile-btn" onclick="openPasswordModal()">${ICON_SVG.profile}정보수정</button>
        <button class="logout-btn" onclick="handleLogout()">${ICON_SVG.logout}로그아웃</button>
      `;

      // 결과 화면을 붙이기 전까지 역할별 안내만 보여 준다
      let title, desc, notice;
      if (isAdmin) {
        title = '공동교육과정 만족도 조사';
        desc = '만족도 조사 결과를 확인하고 설문·강좌를 관리합니다.';
        notice = '모든 거점학교의 결과 확인과 설문·강좌 관리를 이곳에서 하게 됩니다.';
      } else if (isSupport) {
        title = '공동교육과정 만족도 조사 결과';
        desc = '거점학교별 만족도 조사 결과를 조회합니다.';
        notice = '모든 거점학교의 만족도 조사 결과를 이곳에서 조회할 수 있습니다.';
      } else {
        title = '공동교육과정 만족도 조사 결과';
        desc = `${schoolName} 거점 강좌의 만족도 조사 결과입니다.`;
        notice = '우리 학교가 거점학교로 개설한 강좌의 결과를 이곳에서 볼 수 있습니다.';
      }
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('pageDesc').textContent = desc;
      document.title = title + ' — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스';
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div class="icon">${ICON_SVG.survey}</div>
          <p>결과 화면을 준비하고 있습니다</p>
          <p>${notice}</p>
        </div>`;
    }

    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = '../login.html';
    };
    // ====== 토스트 메시지 ======
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = `toast ${type}`; }, 3000);
    }

    // ====== 비밀번호 변경 (본인) ======
    window.openPasswordModal = function() {
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwNew').value = '';
      document.getElementById('pwConfirm').value = '';
      document.getElementById('pwModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('pwCurrent').focus(), 50);
    };

    window.closePasswordModal = function() {
      document.getElementById('pwModal').classList.add('hidden');
    };

    window.submitPasswordChange = async function() {
      const currentPw = document.getElementById('pwCurrent').value;
      const newPw = document.getElementById('pwNew').value;
      const confirmPw = document.getElementById('pwConfirm').value;

      if (!currentPw || !newPw || !confirmPw) {
        showToast('❌ 모든 항목을 입력하세요', 'error');
        return;
      }
      if (newPw.length < 6) {
        showToast('❌ 새 비밀번호는 6자 이상이어야 합니다', 'error');
        return;
      }
      if (newPw !== confirmPw) {
        showToast('❌ 새 비밀번호와 확인이 일치하지 않습니다', 'error');
        return;
      }
      if (currentPw === newPw) {
        showToast('❌ 현재 비밀번호와 새 비밀번호가 같습니다', 'error');
        return;
      }

      const btn = document.getElementById('pwSubmitBtn');
      btn.disabled = true;
      btn.textContent = '변경 중...';

      try {
        // 1. 현재 비밀번호 검증: 같은 이메일로 재로그인 시도
        const { data: { user } } = await supabase.auth.getUser();
        if (!user || !user.email) {
          showToast('❌ 사용자 정보를 가져올 수 없습니다', 'error');
          return;
        }

        // 별도 fetch로 현재 세션에 영향 없이 비번 검증
        const verifyResp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: user.email, password: currentPw })
        });

        if (!verifyResp.ok) {
          showToast('❌ 현재 비밀번호가 올바르지 않습니다', 'error');
          return;
        }

        // 2. 비밀번호 업데이트
        const { error } = await supabase.auth.updateUser({ password: newPw });
        if (error) {
          showToast('❌ 비밀번호 변경 실패: ' + error.message, 'error');
          return;
        }

        showToast('✅ 비밀번호가 변경되었습니다', 'success');
        closePasswordModal();
      } catch (e) {
        showToast('❌ 오류: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '변경';
      }
    };

    init();
  </script>

  <!-- 비밀번호 변경 모달 -->
  <div id="pwModal" class="pw-modal-bg hidden">
    <div class="pw-modal">
      <h3>비밀번호 변경</h3>
      <div class="pw-desc">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</div>
      <div class="pw-field">
        <label>현재 비밀번호</label>
        <input type="password" id="pwCurrent" autocomplete="current-password">
      </div>
      <div class="pw-field">
        <label>새 비밀번호 (6자 이상)</label>
        <input type="password" id="pwNew" autocomplete="new-password">
      </div>
      <div class="pw-field">
        <label>새 비밀번호 확인</label>
        <input type="password" id="pwConfirm" autocomplete="new-password">
      </div>
      <div class="pw-actions">
        <button class="pw-btn-cancel" onclick="closePasswordModal()">취소</button>
        <button class="pw-btn-submit" id="pwSubmitBtn" onclick="submitPasswordChange()">변경</button>
      </div>
    </div>
  </div>
  <!-- 토스트 메시지 -->
  <div class="toast" id="toast"></div>

</body>
</html>
