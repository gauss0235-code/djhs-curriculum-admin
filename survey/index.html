<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="shortcut icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <title>공동교육과정 만족도 조사 결과 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <meta name="description" content="대전 공동교육과정 학생 만족도 조사 결과 화면입니다.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap">
  <link rel="preload" href="../fonts/Paperlogy-7Bold.woff2" as="font" type="font/woff2" crossorigin>
  <!-- 결과 화면 본체 스타일 (워크스페이스 디자인에 맞춘 버전) -->
  <link rel="stylesheet" href="assets/base.css?v=20261022b">
  <link rel="stylesheet" href="assets/admin.css?v=20261022g">
  <!-- 워크스페이스 공통 틀: 헤더·페이지 제목·뒤로가기·비밀번호 모달 (다른 페이지와 같은 규칙) -->
  <style>
    @font-face {
      font-family: 'Paperlogy';
      src: url('../fonts/Paperlogy-7Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --border-strong: #b8d4e8;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --danger: #DC2626;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --accent: #ffd966;
      --accent-soft: #fff8e1;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 32px rgba(74, 144, 217, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* 스크롤바가 있든 없든 헤더 위치가 페이지마다 같도록 자리 고정 */
    html { scrollbar-gutter: stable; }
    body {
      font-family: 'Asta Sans', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    body > header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    header .brand-mark {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    header .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    header .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    header .brand-name {
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .user-info .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      line-height: 1.5;
    }
    .user-info .badge-school {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .user-info .badge-admin {
      background: var(--admin-soft);
      color: var(--admin);
    }
    .user-info .user-name { font-weight: 500; }
    .logout-btn {
      background: #374151;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .logout-btn:hover {
      background: #1f2937;
    }
    /* 정보수정 버튼: 로그아웃과 같은 크기, 색상만 살짝 강조 */
    .profile-btn {
      background: #374151;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .profile-btn:hover {
      background: #1f2937;
    }
    /* 비밀번호 변경 모달 */
    .pw-modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .pw-modal-bg.hidden { display: none; }
    .pw-modal {
      background: white;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .pw-modal h3 {
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-size: 24px;
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .pw-modal .pw-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .pw-field { margin-bottom: 16px; }
    .pw-field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .pw-field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .pw-field input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .pw-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .pw-btn-cancel {
      background: white;
      border: 1.5px solid var(--border);
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }
    .pw-btn-cancel:hover { background: var(--bg-sky, #f4f8fc); }
    .pw-btn-submit {
      background: var(--primary);
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      color: white;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .pw-btn-submit:hover { background: var(--primary-hover, var(--primary-dark)); }
    .pw-btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .ws-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .page-header .desc {
      font-size: 16px;
      color: var(--text-muted);
    }
    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #6B7280;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(107, 114, 128, 0.3);
      text-decoration: none;
    }
    .back-btn:hover {
      background: #4B5563;
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(107, 114, 128, 0.4);
    }
    /* 로그인 확인·권한 없음·오류 안내 (워크스페이스 empty-state와 같은 모양) */
    .gate .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #6B7280;
      background: white;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(120, 80, 30, 0.06);
    }
    .gate .empty-state .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: #FFF8E7;
      border: 2px dashed #F59E0B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gate .empty-state .icon svg {
      width: 34px;
      height: 34px;
      color: #F59E0B;
    }
    .gate .empty-state p {
      font-family: 'Paperlogy', 'Asta Sans', sans-serif;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 8px;
      color: #4A8AB8;
    }
    .gate .empty-state p:last-child {
      font-family: 'Asta Sans', 'Malgun Gothic', sans-serif;
      color: #6B7280;
      font-size: 14px;
      font-weight: 400;
    }
    .ws-footer {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 28px 32px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      header .header-inner { padding: 14px 18px; }
      .ws-main { padding: 32px 18px 60px; }
      .page-header h2 { font-size: 24px; }
      .page-header .desc { font-size: 14px; }
      .user-info { font-size: 12px; gap: 4px; }
      .profile-btn, .logout-btn { padding: 6px 12px; font-size: 12px; }
      header .brand-line1, header .brand-line2 { display: block; }
      header .brand-name { font-size: 15px; line-height: 1.25; }
      .gate .empty-state { padding: 56px 20px; }
    }
  </style>
</head>
<body>
  <div id="demo-banner" class="demo-banner hidden">데모 모드 — 가상 학교·강좌·응답으로 화면을 미리 보는 중입니다. 변경 사항은 저장되지 않습니다.</div>

  <header>
    <div class="header-inner">
      <a class="brand" href="../dashboard.html">
        <div class="brand-mark"><img src="../images/logo.png" alt="대전광역시교육청"></div>
        <div class="brand-text">
          <span class="brand-name"><span class="brand-line1">대전광역시 고등학교</span> <span class="brand-line2">교육과정 업무담당자 워크스페이스</span></span>
        </div>
      </a>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>

  <main class="ws-main">
    <div class="page-header">
      <div>
        <h2 id="pageTitle">공동교육과정 만족도 조사 결과</h2>
        <div class="desc" id="pageDesc">대전 공동교육과정 학생 만족도 조사 결과입니다.</div>
      </div>
      <div class="page-header-actions">
        <button class="btn outline refresh-btn hidden" id="refresh-btn" type="button" title="응답 새로고침">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          <span id="refresh-label">새로고침</span>
        </button>
        <a class="back-btn" href="../dashboard.html">← 대시보드로</a>
      </div>
    </div>

    <!-- 로그인 확인 중 / 권한 없음 / 오류 안내 -->
    <div id="gate-view" class="gate">
      <div class="empty-state">
        <div class="icon">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <p>불러오는 중...</p>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="app-view" class="app hidden">
      <div class="survey-bar">
        <div class="survey-pick">
          <label for="survey-select">설문</label>
          <select id="survey-select" class="input"></select>
          <span id="survey-status"></span>
        </div>
        <button class="btn sm" id="new-survey-btn" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 설문 만들기
        </button>
      </div>
      <nav class="tabbar" id="tabs" role="tablist" aria-label="메뉴"></nav>
      <section class="view" id="view"></section>
    </div>
  </main>

  <footer class="ws-footer">
    Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.
  </footer>

  <!-- 강좌 상세 서랍 -->
  <div class="drawer-backdrop hidden" id="drawer-backdrop"></div>
  <aside class="drawer hidden" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div id="drawer-title-wrap"></div>
      <button class="btn sm ghost icon-btn" id="drawer-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <!-- 모달 -->
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h2 id="modal-title"></h2>
        <button class="btn sm ghost icon-btn" id="modal-close" aria-label="닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <!-- 비밀번호 변경 모달 (워크스페이스 공통) -->
  <div id="pwModal" class="pw-modal-bg hidden">
    <div class="pw-modal">
      <h3>비밀번호 변경</h3>
      <div class="pw-desc">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</div>
      <!-- 비밀번호 칸은 모달을 열 때만 만든다(admin.js). 페이지에 비밀번호 칸이 있으면
           브라우저가 검색창 같은 글자 칸에 로그인 이메일을 자동으로 채우기 때문 -->
      <div class="pw-field">
        <label for="pwCurrent">현재 비밀번호</label>
        <span class="pw-slot" data-pw="pwCurrent" data-ac="current-password"></span>
      </div>
      <div class="pw-field">
        <label for="pwNew">새 비밀번호 (6자 이상)</label>
        <span class="pw-slot" data-pw="pwNew" data-ac="new-password"></span>
      </div>
      <div class="pw-field">
        <label for="pwConfirm">새 비밀번호 확인</label>
        <span class="pw-slot" data-pw="pwConfirm" data-ac="new-password"></span>
      </div>
      <div class="pw-actions">
        <button class="pw-btn-cancel" onclick="closePasswordModal()">취소</button>
        <button class="pw-btn-submit" id="pwSubmitBtn" onclick="submitPasswordChange()">변경</button>
      </div>
    </div>
  </div>

  <!-- 인쇄 전용 영역 -->
  <div id="print-root"></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
  <script src="assets/config.js?v=20261022b"></script>
  <script src="assets/default-questions.js?v=20261022d"></script>
  <script src="assets/api.js?v=20261022d"></script>
  <script src="assets/stats.js?v=20261022b"></script>
  <script src="assets/admin.js?v=20261022d"></script>
  <script src="assets/admin-results.js?v=20261022d"></script>
  <script src="assets/admin-manage.js?v=20261022g"></script>
</body>
</html>
