<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="shortcut icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <title>대시보드 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <meta name="description" content="대전광역시 고등학교 교육과정 업무담당자 워크스페이스의 대시보드입니다.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --border-strong: #b8d4e8;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --accent: #ffd966;
      --accent-soft: #fff8e1;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 32px rgba(74, 144, 217, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-school {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .badge-admin {
      background: var(--admin-soft);
      color: var(--admin);
    }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: white;
      border: 1.5px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .logout-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    /* 토스트 메시지 (성공/에러 알림) */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-dark);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      max-width: calc(100vw - 40px);
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    .toast.success { background: #16A34A; }

    /* 정보수정 버튼: 로그아웃과 같은 크기, 색상만 살짝 강조 */
    .profile-btn {
      background: white;
      border: 1.5px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .profile-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    /* 비밀번호 변경 모달 */
    .pw-modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .pw-modal-bg.hidden { display: none; }
    .pw-modal {
      background: white;
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }
    .pw-modal h3 {
      font-size: 18px;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }
    .pw-modal .pw-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .pw-field { margin-bottom: 14px; }
    .pw-field label {
      display: block;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .pw-field input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .pw-field input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .pw-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .pw-btn-cancel {
      background: white;
      border: 1.5px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      font-family: inherit;
    }
    .pw-btn-submit {
      background: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: white;
      font-weight: 600;
      font-family: inherit;
    }
    .pw-btn-submit:hover { background: var(--primary-dark); }
    .pw-btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }
    .welcome {
      margin-bottom: 48px;
      text-align: center;
    }
    .welcome-tag {
      display: inline-block;
      padding: 6px 16px;
      background: var(--primary);
      color: white;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .welcome h2 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 38px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .welcome p {
      font-size: 17px;
      color: var(--text-muted);
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 720px;
      margin: 0 auto;
    }
    @media (max-width: 768px) {
      .menu-grid { grid-template-columns: 1fr; }
    }
    .menu-card {
      background: var(--surface);
      border: 2px solid transparent;
      padding: 26px 26px;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      min-height: 170px;
      box-shadow: var(--shadow-soft);
    }
    .menu-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: var(--shadow-card);
    }
    .menu-card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .menu-card.disabled:hover {
      border-color: transparent;
      transform: none;
      box-shadow: var(--shadow-soft);
    }
    .menu-icon {
      width: 48px;
      height: 48px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .menu-icon svg {
      width: 24px;
      height: 24px;
    }
    .menu-card.disabled .menu-icon {
      background: #eef3f7;
      color: var(--text-light);
    }
    .menu-card h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 20px;
      font-weight: normal;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .menu-card p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .menu-card .arrow {
      margin-top: auto;
      font-size: 14px;
      color: var(--primary);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .menu-card.disabled .arrow {
      color: var(--text-light);
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 15px;
    }
    footer {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 28px 32px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .header-inner { padding: 14px 18px; }
      main { padding: 32px 18px 60px; }
      .welcome h2 { font-size: 24px; }
      .welcome p { font-size: 14px; }
      .welcome-name { display: block; }
      .user-info { font-size: 12px; gap: 6px; }
      .profile-btn, .logout-btn { padding: 6px 12px; font-size: 12px; }
      .brand-line1, .brand-line2 { display: block; }
      .brand-name { font-size: 15px; line-height: 1.25; }
      .menu-card { padding: 26px 22px; min-height: auto; }
      .menu-icon { width: 52px; height: 52px; }
      .menu-icon svg { width: 26px; height: 26px; }
      .menu-card h3 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <div class="brand-text">
          <span class="brand-name"><span class="brand-line1">대전광역시 고등학교</span> <span class="brand-line2">교육과정 업무담당자 워크스페이스</span></span>
        </div>
      </div>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div id="content">
      <div class="loading">로그인 정보를 확인하는 중입니다...</div>
    </div>
  </main>

  <footer>
    Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const NOTEBOOKLM_URL = 'https://notebooklm.google.com/notebook/b599e81a-4d0b-4091-b641-d4cf1f61beff';
    
    const ICONS = {
      curriculum: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`,
      track: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2" fill="currentColor"/><path d="M 5 18 Q 5 12 10 11 Q 15 10 15 6" stroke-dasharray="2 2"/><path d="M 15 6 L 15 3 L 20 4.5 L 15 6 Z" fill="currentColor"/></svg>`,
      users: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>`,
      check: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>`,
      bot: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>`
    };
    
    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      
      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }
      
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('display_name, role, schools(name, code)')
        .eq('id', user.id)
        .single();
      
      if (profileError) {
        document.getElementById('content').innerHTML = 
          `<div class="loading" style="color: var(--admin);">프로필을 불러오지 못했습니다: ${profileError.message}</div>`;
        return;
      }
      
      const isAdmin = profile.role === 'admin';
      const isSupport = profile.role === 'support';
      
      if (isAdmin) {
        document.getElementById('userInfo').innerHTML = `
          <span class="badge badge-admin">관리자</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="profile-btn" onclick="openPasswordModal()">정보수정</button>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <span class="welcome-tag">관리자 대시보드</span>
            <h2>안녕하세요, <span class="welcome-name">${profile.display_name}님</span></h2>
            <p>관리자 권한으로 모든 학교의 데이터를 관리할 수 있습니다.</p>
          </div>
          <div class="menu-grid">
            <a class="menu-card" href="curriculum.html">
              <div class="menu-icon">${ICONS.curriculum}</div>
              <div>
                <h3>교육과정 편성표 관리</h3>
                <p>학교별 교육과정 편성표 등록·수정·삭제</p>
              </div>
              <span class="arrow">관리하기 →</span>
            </a>
            <a class="menu-card" href="track.html">
              <div class="menu-icon">${ICONS.track}</div>
              <div>
                <h3>과목 선택 트랙 관리</h3>
                <p>학교별 과목 선택 트랙 관리</p>
              </div>
              <span class="arrow">관리하기 →</span>
            </a>
            <a class="menu-card" href="inspection.html">
              <div class="menu-icon">${ICONS.check}</div>
              <div>
                <h3>교육과정 편성표 점검</h3>
                <p>학교별 편성표 점검 결과 등록·관리</p>
              </div>
              <span class="arrow">관리하기 →</span>
            </a>
            <a class="menu-card" href="management.html">
              <div class="menu-icon">${ICONS.users}</div>
              <div>
                <h3>학교·담당자 관리</h3>
                <p>학교 등록 및 담당자 계정 관리</p>
              </div>
              <span class="arrow">관리하기 →</span>
            </a>
          </div>
        `;
      } else if (isSupport) {
        document.getElementById('userInfo').innerHTML = `
          <span class="badge badge-admin">교육과정지원단</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="profile-btn" onclick="openPasswordModal()">정보수정</button>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <span class="welcome-tag">교육과정지원단 대시보드</span>
            <h2>안녕하세요, <span class="welcome-name">${profile.display_name}님</span></h2>
            <p>모든 학교의 교육과정 편성표와 과목 선택 트랙을 조회할 수 있습니다.</p>
          </div>
          <div class="menu-grid">
            <a class="menu-card" href="curriculum.html">
              <div class="menu-icon">${ICONS.curriculum}</div>
              <div>
                <h3>교육과정 편성표 조회</h3>
                <p>학교별 교육과정 편성표 보기</p>
              </div>
              <span class="arrow">조회하기 →</span>
            </a>
            <a class="menu-card" href="track.html">
              <div class="menu-icon">${ICONS.track}</div>
              <div>
                <h3>과목 선택 트랙 조회</h3>
                <p>학교별 과목 선택 트랙 보기</p>
              </div>
              <span class="arrow">조회하기 →</span>
            </a>
            <a class="menu-card" href="inspection.html">
              <div class="menu-icon">${ICONS.check}</div>
              <div>
                <h3>교육과정 편성표 점검</h3>
                <p>학교별 편성표 점검 결과 보기</p>
              </div>
              <span class="arrow">조회하기 →</span>
            </a>
            <a class="menu-card" href="${NOTEBOOKLM_URL}" target="_blank">
              <div class="menu-icon">${ICONS.bot}</div>
              <div>
                <h3>교육과정 업무 도우미 챗봇</h3>
                <p>NotebookLM 문서 기반 질의응답</p>
              </div>
              <span class="arrow">새 탭에서 열기 ↗</span>
            </a>
          </div>
        `;
      } else {
        const schoolName = profile.schools ? profile.schools.name : '소속 학교 미지정';
        document.getElementById('userInfo').innerHTML = `
          <span class="badge badge-school">${schoolName}</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="profile-btn" onclick="openPasswordModal()">정보수정</button>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <span class="welcome-tag">${schoolName}</span>
            <h2>안녕하세요, <span class="welcome-name">${profile.display_name}님</span></h2>
            <p>${schoolName}의 교육과정 작업 공간입니다.</p>
          </div>
          <div class="menu-grid">
            <a class="menu-card" href="curriculum.html">
              <div class="menu-icon">${ICONS.curriculum}</div>
              <div>

    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };    
    // ====== 토스트 메시지 ======
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = `toast ${type}`; }, 3000);
    }

    
    // ====== 비밀번호 변경 (본인) ======
    window.openPasswordModal = function() {
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwNew').value = '';
      document.getElementById('pwConfirm').value = '';
      document.getElementById('pwModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('pwCurrent').focus(), 50);
    };
    
    window.closePasswordModal = function() {
      document.getElementById('pwModal').classList.add('hidden');
    };
    
    window.submitPasswordChange = async function() {
      const currentPw = document.getElementById('pwCurrent').value;
      const newPw = document.getElementById('pwNew').value;
      const confirmPw = document.getElementById('pwConfirm').value;
      
      if (!currentPw || !newPw || !confirmPw) {
        showToast('❌ 모든 항목을 입력하세요', 'error');
        return;
      }
      if (newPw.length < 6) {
        showToast('❌ 새 비밀번호는 6자 이상이어야 합니다', 'error');
        return;
      }
      if (newPw !== confirmPw) {
        showToast('❌ 새 비밀번호와 확인이 일치하지 않습니다', 'error');
        return;
      }
      if (currentPw === newPw) {
        showToast('❌ 현재 비밀번호와 새 비밀번호가 같습니다', 'error');
        return;
      }
      
      const btn = document.getElementById('pwSubmitBtn');
      btn.disabled = true;
      btn.textContent = '변경 중...';
      
      try {
        // 1. 현재 비밀번호 검증: 같은 이메일로 재로그인 시도
        const { data: { user } } = await supabase.auth.getUser();
        if (!user || !user.email) {
          showToast('❌ 사용자 정보를 가져올 수 없습니다', 'error');
          return;
        }
        
        // 별도 fetch로 현재 세션에 영향 없이 비번 검증
        const verifyResp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: user.email, password: currentPw })
        });
        
        if (!verifyResp.ok) {
          showToast('❌ 현재 비밀번호가 올바르지 않습니다', 'error');
          return;
        }
        
        // 2. 비밀번호 업데이트
        const { error } = await supabase.auth.updateUser({ password: newPw });
        if (error) {
          showToast('❌ 비밀번호 변경 실패: ' + error.message, 'error');
          return;
        }
        
        showToast('✅ 비밀번호가 변경되었습니다', 'success');
        closePasswordModal();
      } catch (e) {
        showToast('❌ 오류: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '변경';
      }
    };
    
    init();
  </script>
  
  <!-- 비밀번호 변경 모달 -->
  <div id="pwModal" class="pw-modal-bg hidden">
    <div class="pw-modal">
      <h3>비밀번호 변경</h3>
      <div class="pw-desc">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</div>
      <div class="pw-field">
        <label>현재 비밀번호</label>
        <input type="password" id="pwCurrent" autocomplete="current-password">
      </div>
      <div class="pw-field">
        <label>새 비밀번호 (6자 이상)</label>
        <input type="password" id="pwNew" autocomplete="new-password">
      </div>
      <div class="pw-field">
        <label>새 비밀번호 확인</label>
        <input type="password" id="pwConfirm" autocomplete="new-password">
      </div>
      <div class="pw-actions">
        <button class="pw-btn-cancel" onclick="closePasswordModal()">취소</button>
        <button class="pw-btn-submit" id="pwSubmitBtn" onclick="submitPasswordChange()">변경</button>
      </div>
    </div>
  </div>
  <!-- 토스트 메시지 -->
  <div class="toast" id="toast"></div>

</body>
