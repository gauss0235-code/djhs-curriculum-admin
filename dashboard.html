<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <title>대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --primary-dark: #3730a3;
      --admin: #be185d;
      --admin-soft: #fdf2f8;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 16px;
      font-weight: normal;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-school {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .badge-admin {
      background: var(--admin-soft);
      color: var(--admin);
    }
    .user-name {
      color: var(--text);
      font-weight: 500;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-muted);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .logout-btn:hover {
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 28px 80px;
    }
    .welcome {
      margin-bottom: 32px;
    }
    .welcome h2 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .welcome p {
      font-size: 15px;
      color: var(--text-muted);
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .menu-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .menu-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .menu-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .menu-card.disabled:hover {
      border-color: var(--border);
      transform: none;
      box-shadow: none;
    }
    .menu-icon {
      width: 40px;
      height: 40px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .menu-card.disabled .menu-icon {
      background: var(--bg);
      color: var(--text-light);
    }
    .menu-card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .menu-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .menu-card .arrow {
      margin-top: auto;
      font-size: 13px;
      color: var(--primary);
      font-weight: 500;
    }
    .menu-card.disabled .arrow {
      color: var(--text-light);
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 14px;
    }
    footer {
      max-width: 1100px;
      margin: 40px auto 0;
      padding: 24px 28px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 768px) {
      .header-inner { padding: 12px 16px; }
      main { padding: 28px 16px 60px; }
      .welcome h2 { font-size: 22px; }
      .user-info { font-size: 12px; gap: 8px; }
      .brand-name { font-size: 13px; }
      .brand-mark { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <div class="brand-text">
          <span class="brand-name">대전광역시 고등학교 교육과정 업무담당자 워크스페이스</span>
        </div>
      </div>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div id="content">
      <div class="loading">로그인 정보를 확인하는 중입니다...</div>
    </div>
  </main>

  <footer>
    Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      
      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }
      
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('display_name, role, schools(name, code)')
        .eq('id', user.id)
        .single();
      
      if (profileError) {
        document.getElementById('content').innerHTML = 
          `<div class="loading" style="color: #dc2626;">프로필을 불러오지 못했습니다: ${profileError.message}</div>`;
        return;
      }
      
      const isAdmin = profile.role === 'admin';
      
      if (isAdmin) {
        document.getElementById('userInfo').innerHTML = `
          <span class="badge badge-admin">관리자</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <h2>안녕하세요, ${profile.display_name}님</h2>
            <p>관리자 권한으로 모든 학교의 데이터를 관리할 수 있습니다.</p>
          </div>
          <div class="menu-grid">
            <a class="menu-card" href="curriculum.html">
              <div class="menu-icon">📋</div>
              <div>
                <h3>교육과정 편성표</h3>
                <p>학교별 시트 등록·수정·삭제</p>
              </div>
              <span class="arrow">관리하기 →</span>
            </a>
            <div class="menu-card disabled">
              <div class="menu-icon">🎯</div>
              <div>
                <h3>과목 트랙 관리</h3>
                <p>곧 추가될 예정입니다</p>
              </div>
              <span class="arrow">준비 중</span>
            </div>
            <div class="menu-card disabled">
              <div class="menu-icon">👥</div>
              <div>
                <h3>학교·담당자 관리</h3>
                <p>곧 추가될 예정입니다</p>
              </div>
              <span class="arrow">준비 중</span>
            </div>
            <a class="menu-card" href="https://notebooklm.google.com" target="_blank">
              <div class="menu-icon">🤖</div>
              <div>
                <h3>교육과정 챗봇</h3>
                <p>NotebookLM 문서 기반 질의응답</p>
              </div>
              <span class="arrow">새 탭에서 열기 ↗</span>
            </a>
          </div>
        `;
      } else {
        const schoolName = profile.schools ? profile.schools.name : '소속 학교 미지정';
        document.getElementById('userInfo').innerHTML = `
          <span class="badge badge-school">${schoolName}</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <h2>안녕하세요, ${profile.display_name}님</h2>
            <p>${schoolName}의 교육과정 작업 공간입니다.</p>
          </div>
          <div class="menu-grid">
            <a class="menu-card" href="curriculum.html">
              <div class="menu-icon">📋</div>
              <div>
                <h3>교육과정 편성표</h3>
                <p>우리 학교 편성표 시트 보기</p>
              </div>
              <span class="arrow">바로가기 →</span>
            </a>
            <div class="menu-card disabled">
              <div class="menu-icon">🎯</div>
              <div>
                <h3>과목 트랙 만들기</h3>
                <p>곧 추가될 예정입니다</p>
              </div>
              <span class="arrow">준비 중</span>
            </div>
            <div class="menu-card disabled">
              <div class="menu-icon">💬</div>
              <div>
                <h3>담당자 댓글</h3>
                <p>곧 추가될 예정입니다</p>
              </div>
              <span class="arrow">준비 중</span>
            </div>
            <a class="menu-card" href="https://notebooklm.google.com" target="_blank">
              <div class="menu-icon">🤖</div>
              <div>
                <h3>교육과정 챗봇</h3>
                <p>NotebookLM 문서 기반 질의응답</p>
              </div>
              <span class="arrow">새 탭에서 열기 ↗</span>
            </a>
          </div>
        `;
      }
    }
    
    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };
    
    init();
  </script>
</body>
</html>
