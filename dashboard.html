<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="shortcut icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <title>대시보드 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <meta name="description" content="대전광역시 고등학교 교육과정 업무담당자 워크스페이스의 대시보드입니다.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --border-strong: #b8d4e8;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --accent: #ffd966;
      --accent-soft: #fff8e1;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 32px rgba(74, 144, 217, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-school {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .badge-admin {
      background: var(--admin-soft);
      color: var(--admin);
    }
    .user-name {
      color: var(--text);
      font-weight: 500;
    }
    .logout-btn {
      background: white;
      border: 1.5px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .logout-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 32px 80px;
    }
    .welcome {
      margin-bottom: 48px;
      text-align: center;
    }
    .welcome-tag {
      display: inline-block;
      padding: 6px 16px;
      background: var(--primary);
      color: white;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .welcome h2 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 38px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .welcome p {
      font-size: 17px;
      color: var(--text-muted);
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 768px) {
      .menu-grid { grid-template-columns: 1fr; }
    }
    .menu-card {
      background: var(--surface);
      border: 2px solid transparent;
      padding: 22px 24px;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      min-height: 150px;
      box-shadow: var(--shadow-soft);
    }
    .menu-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: var(--shadow-card);
    }
    .menu-card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .menu-card.disabled:hover {
      border-color: transparent;
      transform: none;
      box-shadow: var(--shadow-soft);
    }
    .menu-icon {
      width: 48px;
      height: 48px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .menu-icon svg {
      width: 24px;
      height: 24px;
    }
    .menu-card.disabled .menu-icon {
      background: #eef3f7;
      color: var(--text-light);
    }
    .menu-card h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .menu-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .menu-card .arrow {
      margin-top: auto;
      font-size: 14px;
      color: var(--primary);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .menu-card.disabled .arrow {
      color: var(--text-light);
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 15px;
    }
    footer {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 28px 32px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .header-inner { padding: 14px 18px; }
      main { padding: 36px 18px 60px; }
      .welcome h2 { font-size: 26px; }
      .welcome p { font-size: 15px; }
      .user-info { font-size: 13px; gap: 10px; }
      .brand-name { font-size: 14px; }
      .brand-mark { width: 36px; height: 36px; }
      .menu-card { padding: 26px 22px; min-height: auto; }
      .menu-icon { width: 52px; height: 52px; }
      .menu-icon svg { width: 26px; height: 26px; }
      .menu-card h3 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <div class="brand-text">
          <span class="brand-name">대전광역시 고등학교 교육과정 업무담당자 워크스페이스</span>
        </div>
      </div>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div id="content">
      <div class="loading">로그인 정보를 확인하는 중입니다...</div>
    </div>
  </main>

  <footer>
    Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const NOTEBOOKLM_URL = 'https://notebooklm.google.com/notebook/b599e81a-4d0b-4091-b641-d4cf1f61beff';
    
    const ICONS = {
      curriculum: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`,
      track: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2" fill="currentColor"/><path d="M 5 18 Q 5 12 10 11 Q 15 10 15 6" stroke-dasharray="2 2"/><path d="M 15 6 L 15 3 L 20 4.5 L 15 6 Z" fill="currentColor"/></svg>`,
      users: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>`,
      check: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>`,
      bot: `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>`
    };
    
    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      
      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }
      
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('display_name, role, schools(name, code)')
        .eq('id', user.id)
        .single();
      
      if (profileError) {
        document.getElementById('content').innerHTML = 
          `<div class="loading" style="color: var(--admin);">프로필을 불러오지 못했습니다: ${profileError.message}</div>`;
        return;
      }
      
      const isAdmin = profile.role === 'admin';
      const isSupport = profile.role === 'support';
      
      if (isAdmin) {
        document.getElementById('userInfo').innerHTML = `
          <span class="badge badge-admin">교육과정지원단 관리자</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <span class="welcome-tag">관리자 대시보드</span>
            <h2>안녕하세요, ${profile.display_name}님</h2>
            <p>관리자 권한으로 모든 학교의 데이터를 관리할 수 있습니다.</p>
          </div>
          <div class="menu-grid">
            <a class="menu-card" href="curriculum.html">
              <div class="menu-icon">${ICONS.curriculum}</div>
              <div>
                <h3>교육과정 편성표 작성</h3>
                <p>학교별 교육과정 편성표 등록·수정·삭제</p>
              </div>
              <span class="arrow">관리하기 →</span>
            </a>
            <a class="menu-card" href="track.html">
              <div class="menu-icon">${ICONS.track}</div>
              <div>
                <h3>과목 선택 트랙 작성</h3>
                <p>학교별 과목 선택 트랙 관리</p>
              </div>
              <span class="arrow">관리하기 →</span>
            </a>
            <div class="menu-card disabled">
              <div class="menu-icon">${ICONS.users}</div>
              <div>
                <h3>학교·담당자 관리</h3>
                <p>곧 추가될 예정입니다</p>
              </div>
              <span class="arrow">준비 중</span>
            </div>
            <a class="menu-card" href="${NOTEBOOKLM_URL}" target="_blank">
              <div class="menu-icon">${ICONS.bot}</div>
              <div>
                <h3>교육과정 업무 도우미 챗봇</h3>
                <p>NotebookLM 문서 기반 질의응답</p>
              </div>
              <span class="arrow">새 탭에서 열기 ↗</span>
            </a>
          </div>
        `;
      } else if (isSupport) {
        document.getElementById('userInfo').innerHTML = `
          <span class="badge badge-admin">교육과정지원단</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <span class="welcome-tag">교육과정지원단 대시보드</span>
            <h2>안녕하세요, ${profile.display_name}님</h2>
            <p>모든 학교의 교육과정 편성표와 과목 선택 트랙을 조회할 수 있습니다.</p>
          </div>
          <div class="menu-grid">
            <a class="menu-card" href="curriculum.html">
              <div class="menu-icon">${ICONS.curriculum}</div>
              <div>
                <h3>교육과정 편성표 조회</h3>
                <p>학교별 교육과정 편성표 보기</p>
              </div>
              <span class="arrow">조회하기 →</span>
            </a>
            <a class="menu-card" href="track.html">
              <div class="menu-icon">${ICONS.track}</div>
              <div>
                <h3>과목 선택 트랙 조회</h3>
                <p>학교별 과목 선택 트랙 보기</p>
              </div>
              <span class="arrow">조회하기 →</span>
            </a>
            <div class="menu-card disabled">
              <div class="menu-icon">${ICONS.check}</div>
              <div>
                <h3>교육과정 편성 점검 결과</h3>
                <p>곧 추가될 예정입니다</p>
              </div>
              <span class="arrow">준비 중</span>
            </div>
            <a class="menu-card" href="${NOTEBOOKLM_URL}" target="_blank">
              <div class="menu-icon">${ICONS.bot}</div>
              <div>
                <h3>교육과정 업무 도우미 챗봇</h3>
                <p>NotebookLM 문서 기반 질의응답</p>
              </div>
              <span class="arrow">새 탭에서 열기 ↗</span>
            </a>
          </div>
        `;
      } else {
        const schoolName = profile.schools ? profile.schools.name : '소속 학교 미지정';
        document.getElementById('userInfo').innerHTML = `
          <span class="badge badge-school">${schoolName}</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <span class="welcome-tag">${schoolName}</span>
            <h2>안녕하세요, ${profile.display_name}님</h2>
            <p>${schoolName}의 교육과정 작업 공간입니다.</p>
          </div>
          <div class="menu-grid">
            <a class="menu-card" href="curriculum.html">
              <div class="menu-icon">${ICONS.curriculum}</div>
              <div>
                <h3>교육과정 편성표 작성</h3>
                <p>우리 학교 교육과정 편성표 작성하기</p>
              </div>
              <span class="arrow">바로가기 →</span>
            </a>
            <a class="menu-card" href="track.html">
              <div class="menu-icon">${ICONS.track}</div>
              <div>
                <h3>과목 선택 트랙 작성</h3>
                <p>우리 학교 과목 선택 트랙 작성</p>
              </div>
              <span class="arrow">바로가기 →</span>
            </a>
            <div class="menu-card disabled">
              <div class="menu-icon">${ICONS.check}</div>
              <div>
                <h3>교육과정 편성 점검 결과</h3>
                <p>곧 추가될 예정입니다</p>
              </div>
              <span class="arrow">준비 중</span>
            </div>
            <a class="menu-card" href="${NOTEBOOKLM_URL}" target="_blank">
              <div class="menu-icon">${ICONS.bot}</div>
              <div>
                <h3>교육과정 업무 도우미 챗봇</h3>
                <p>NotebookLM 문서 기반 질의응답</p>
              </div>
              <span class="arrow">새 탭에서 열기 ↗</span>
            </a>
          </div>
        `;
      }
    }
    
    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };
    
    init();
  </script>
</body>
</html>
