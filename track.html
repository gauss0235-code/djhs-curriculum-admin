<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <title>대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --border-strong: #b8d4e8;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      --danger: #e57373;
      --danger-soft: #fdeaea;
      --warning: #f4a261;
      --warning-soft: #fef0e3;
      --cat-social: #5a9fd4;
      --cat-social-soft: #e3f0fa;
      --cat-business: #f4a261;
      --cat-business-soft: #fef0e3;
      --cat-engineering: #7cb342;
      --cat-engineering-soft: #eef7e3;
      --cat-medical: #e57373;
      --cat-medical-soft: #fdeaea;
      --cat-other: #9ca3af;
      --cat-other-soft: #f1f5f9;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 32px rgba(74, 144, 217, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark { width: 42px; height: 42px; }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-school { background: var(--primary-soft); color: var(--primary-dark); }
    .badge-admin { background: var(--admin-soft); color: var(--admin); }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: white;
      border: 1.5px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .logout-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 36px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 32px;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .page-header .desc {
      font-size: 16px;
      color: var(--text-muted);
    }
    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1.5px solid var(--border);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .back-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }
    .filter-bar {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 18px 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-soft);
    }
    .filter-bar label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .filter-bar select {
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #f8fbfd;
      color: var(--text);
      flex: 1;
      max-width: 320px;
      cursor: pointer;
    }
    .filter-bar select:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow-soft);
    }
    .empty-state .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-state .icon svg { width: 32px; height: 32px; }
    .empty-state p {
      font-size: 16px;
      margin-bottom: 6px;
      color: var(--text);
      font-weight: 500;
    }
    .empty-state p:last-child {
      color: var(--text-light);
      font-size: 14px;
      font-weight: 400;
    }
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .track-item {
      background: var(--surface);
      border: 2px solid transparent;
      padding: 24px 28px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-soft);
    }
    .track-item:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }
    .track-info { flex: 1; min-width: 0; }
    .track-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .track-title-row h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }
    .category-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .category-social_science { background: var(--cat-social-soft); color: var(--cat-social); }
    .category-business { background: var(--cat-business-soft); color: var(--cat-business); }
    .category-engineering { background: var(--cat-engineering-soft); color: var(--cat-engineering); }
    .category-medical { background: var(--cat-medical-soft); color: var(--cat-medical); }
    .category-other { background: var(--cat-other-soft); color: var(--cat-other); }
    .track-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 6px;
    }
    .track-meta {
      font-size: 13px;
      color: var(--text-light);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .track-meta .meta-warn {
      color: var(--warning);
      font-weight: 600;
    }
    .track-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }
    .open-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .open-btn:hover { background: var(--primary-hover); }
    .icon-btn {
      background: white;
      border: 1.5px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      font-family: inherit;
      transition: all 0.15s ease;
      text-decoration: none;
      display: inline-block;
    }
    .icon-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }
    .icon-btn.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-soft);
    }
    footer {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 28px 32px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .header-inner { padding: 14px 18px; }
      main { padding: 32px 18px 60px; }
      .page-header h2 { font-size: 24px; }
      .track-item { flex-direction: column; align-items: stretch; padding: 20px 22px; }
      .track-actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="dashboard.html">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <span class="brand-name">대전광역시 고등학교 교육과정 업무담당자 워크스페이스</span>
      </a>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div class="page-header">
      <div>
        <h2>과목 선택 트랙 작성</h2>
        <div class="desc" id="pageDesc">계열별 추천 과목 트랙을 확인하세요.</div>
      </div>
      <div class="page-header-actions">
        <a id="addBtn" class="btn-primary" href="track-edit.html" style="display:none">+ 새 트랙 만들기</a>
        <a class="back-btn" href="dashboard.html">← 대시보드로</a>
      </div>
    </div>
    
    <div id="schoolFilter" class="filter-bar" style="display:none">
      <label>학교 선택</label>
      <select id="schoolSelect" onchange="loadTracks()">
        <option value="">학교를 선택하세요</option>
      </select>
    </div>
    
    <div id="trackList">
      <div class="empty-state">
        <div class="icon">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <p>불러오는 중...</p>
      </div>
    </div>
  </main>
  
  <footer>
    Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = null;
    let currentProfile = null;
    let isAdmin = false;
    
    const CATEGORY_LABELS = {
      social_science: '사회과학계열',
      business: '경영·경제계열',
      engineering: '자연공학계열',
      medical: '의료생명계열',
      other: '기타'
    };
    const CATEGORY_ORDER = ['social_science', 'business', 'engineering', 'medical', 'other'];
    
    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      
      const { data: profile } = await supabase
        .from('profiles')
        .select('display_name, role, school_id, schools(name, code)')
        .eq('id', user.id)
        .single();
      currentProfile = profile;
      isAdmin = profile.role === 'admin';
      
      const userInfoEl = document.getElementById('userInfo');
      if (isAdmin) {
        userInfoEl.innerHTML = `
          <span class="badge badge-admin">관리자</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('addBtn').style.display = 'inline-block';
        document.getElementById('schoolFilter').style.display = 'flex';
        document.getElementById('pageDesc').textContent = '학교를 선택해서 등록된 트랙을 관리하세요.';
        await loadSchools();
      } else {
        userInfoEl.innerHTML = `
          <span class="badge badge-school">${profile.schools.name}</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        `;
        document.getElementById('addBtn').style.display = 'inline-block';
        document.getElementById('pageDesc').textContent = `${profile.schools.name}의 과목 선택 트랙입니다.`;
        loadTracks();
      }
    }
    
    async function loadSchools() {
      const { data, error } = await supabase
        .from('schools')
        .select('id, name, code')
        .order('name');
      if (error) { console.error(error); return; }
      const select = document.getElementById('schoolSelect');
      select.innerHTML = '<option value="">학교를 선택하세요</option>' + 
        data.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }
    
    window.loadTracks = async function() {
      const listEl = document.getElementById('trackList');
      
      let schoolId;
      if (isAdmin) {
        schoolId = document.getElementById('schoolSelect').value;
        if (!schoolId) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="icon">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
              </div>
              <p>위에서 학교를 선택하세요</p>
              <p>선택한 학교의 트랙이 표시됩니다.</p>
            </div>
          `;
          return;
        }
      } else {
        schoolId = currentProfile.school_id;
      }
      
      const { data, error } = await supabase
        .from('tracks')
        .select('*, curriculums(title, sheet_type, updated_at)')
        .eq('school_id', schoolId);
      
      if (error) {
        listEl.innerHTML = `<div class="empty-state" style="color: var(--danger);">오류: ${error.message}</div>`;
        return;
      }
      
      if (!data || data.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">
              <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg>
            </div>
            <p>아직 등록된 트랙이 없습니다</p>
            <p>위 버튼으로 새 트랙을 만들어보세요.</p>
          </div>
        `;
        return;
      }
      
      // 정렬: 계열별 → 등록일순
      data.sort((a, b) => {
        const ai = CATEGORY_ORDER.indexOf(a.track_category);
        const bi = CATEGORY_ORDER.indexOf(b.track_category);
        if (ai !== bi) return ai - bi;
        return new Date(a.created_at) - new Date(b.created_at);
      });
      
      listEl.innerHTML = `<div class="track-list">` + data.map(item => {
        const updatedDate = new Date(item.updated_at).toLocaleDateString('ko-KR', {
          year: 'numeric', month: 'long', day: 'numeric'
        });
        const canEdit = isAdmin || (currentProfile.school_id === item.school_id);
        
        // 편성표 변경 감지: 트랙 생성/수정 시점 이후에 편성표가 수정됐는지
        let curriculumInfo = '';
        let warningInfo = '';
        if (item.curriculums) {
          curriculumInfo = `<span>📋 ${item.curriculums.title}</span>`;
          // 편성표가 트랙 마지막 수정보다 나중에 변경됐으면 경고
          if (new Date(item.curriculums.updated_at) > new Date(item.updated_at)) {
            warningInfo = `<span class="meta-warn">⚠ 편성표가 변경되었습니다. 트랙 점검을 권장합니다.</span>`;
          }
        } else if (item.curriculum_id) {
          warningInfo = `<span class="meta-warn">⚠ 연결된 편성표가 삭제되었습니다.</span>`;
        }
        
        // 추천 과목 수 계산
        const subjects = item.recommended_subjects || {};
        const totalSubjects = Object.values(subjects).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : 0), 0);
        
        return `
          <div class="track-item">
            <div class="track-info">
              <div class="track-title-row">
                <h3>${item.title}</h3>
                <span class="category-tag category-${item.track_category}">${CATEGORY_LABELS[item.track_category]}</span>
              </div>
              ${item.description ? `<div class="track-desc">${item.description}</div>` : ''}
              <div class="track-meta">
                ${curriculumInfo}
                <span>추천 과목 ${totalSubjects}개</span>
                <span>최종 수정 ${updatedDate}</span>
                ${warningInfo}
              </div>
            </div>
            <div class="track-actions">
              ${canEdit ? `
                <a class="open-btn" href="track-edit.html?id=${item.id}">수정 →</a>
                <button class="icon-btn danger" onclick="deleteTrack('${item.id}')">삭제</button>
              ` : `
                <a class="open-btn" href="track-edit.html?id=${item.id}">보기 →</a>
              `}
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    };
    
    window.deleteTrack = async function(id) {
      const ok = confirm('정말 삭제하시겠습니까?');
      if (!ok) return;
      const { error } = await supabase.from('tracks').delete().eq('id', id);
      if (error) { alert('삭제 실패: ' + error.message); return; }
      loadTracks();
    };
    
    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };
    
    init();
  </script>
</body>
</html>
