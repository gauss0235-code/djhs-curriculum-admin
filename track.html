<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="shortcut icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <title>과목 선택 트랙 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <meta name="description" content="대전광역시 고등학교별 과목 선택 트랙을 관리합니다.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      /* 배경 (건드리지 않음) */
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --border: #d8e8f3;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      --text-light: #8ba8c2;
      --text-muted: #5d7894;
      
      /* 시뮬레이터 톤 (track-edit과 동일) */
      --sim-text: #2C3E50;
      --sim-text-mid: #6B7280;
      --sim-text-brown: #6B4423;
      --sim-sky-blue: #4A8AB8;
      --sim-beige: #FFF8E7;
      --sim-beige-deep: #FFE9B3;
      --sim-yellow-banner: #FEF3C7;
      --sim-yellow-border: #F59E0B;
      
      /* 계열별 태그 (track-edit 톤) */
      --cat-social-bg: #DBEAFE;
      --cat-social-text: #1D4ED8;
      --cat-business-bg: #FEF3C7;
      --cat-business-text: #B45309;
      --cat-engineering-bg: #DCFCE7;
      --cat-engineering-text: #15803D;
      --cat-medical-bg: #FEE2E2;
      --cat-medical-text: #B91C1C;
      --cat-other-bg: #F3F4F6;
      --cat-other-text: #4B5563;
      
      --check-brown: #4A2E14;
      
      --danger: #DC2626;
      --danger-soft: #FEE2E2;
      --warning: #F59E0B;
      --warning-soft: #FEF3C7;
      
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 2px 8px rgba(120, 80, 30, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--sim-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-school { background: var(--primary-soft); color: var(--primary-dark); }
    .badge-admin { background: var(--admin-soft); color: var(--admin); }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: #374151;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .logout-btn:hover {
      background: #1f2937;
    }
    /* 토스트 메시지 (성공/에러 알림) */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-dark);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-weight: normal;
      font-size: 15px;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      max-width: calc(100vw - 40px);
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    .toast.success { background: #16A34A; }

    /* 정보수정 버튼: 로그아웃과 같은 크기, 색상만 살짝 강조 */
    .profile-btn {
      background: #374151;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .profile-btn:hover {
      background: #1f2937;
    }
    /* 비밀번호 변경 모달 */
    .pw-modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .pw-modal-bg.hidden { display: none; }
    .pw-modal {
      background: white;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .pw-modal h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 24px;
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-weight: normal;
    }
    .pw-modal .pw-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .pw-field { margin-bottom: 16px; }
    .pw-field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .pw-field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .pw-field input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .pw-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .pw-btn-cancel {
      background: white;
      border: 1.5px solid var(--border);
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }
    .pw-btn-cancel:hover { background: var(--bg-sky, #f4f8fc); }
    .pw-btn-submit {
      background: var(--primary);
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      color: white;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .pw-btn-submit:hover { background: var(--primary-hover, var(--primary-dark)); }
    .pw-btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 36px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 32px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .page-header .desc {
      font-size: 16px;
      color: var(--text-muted);
    }
    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    /* === 버튼 (track-edit과 일치) === */
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 5px 14px rgba(74, 144, 217, 0.4); }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #6B7280;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(107, 114, 128, 0.3);
      text-decoration: none;
    }
    .back-btn:hover {
      background: #4B5563;
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(107, 114, 128, 0.4);
    }
    
    /* === 학교 선택 바 === */
    .filter-bar {
      background: white;
      border: 1.5px solid #E5E7EB;
      padding: 18px 24px;
      border-radius: 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-card);
    }
    .filter-bar label {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 15px;
      color: var(--sim-sky-blue);
    }
    .filter-bar select {
      padding: 11px 16px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      color: var(--sim-text);
      flex: 1;
      max-width: 320px;
      cursor: pointer;
    }
    .filter-bar select:focus {
      outline: none;
      border-color: var(--sim-sky-blue);
      box-shadow: 0 0 0 3px rgba(74, 138, 184, 0.15);
    }
    
    /* === 빈 상태 === */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--sim-text-mid);
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow-card);
    }
    .empty-state .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      color: var(--sim-sky-blue);
      background: var(--sim-beige);
      border: 2px dashed var(--sim-yellow-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-state .icon svg { width: 34px; height: 34px; color: var(--sim-yellow-border); }
    .empty-state p {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--sim-sky-blue);
    }
    .empty-state p:last-child {
      font-family: 'Pretendard', sans-serif;
      color: var(--sim-text-mid);
      font-size: 14px;
      font-weight: 400;
    }
    
    /* === 트랙 카드 (track-edit의 subject-card 톤) === */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .track-item {
      background: white;
      border: 2px solid transparent;
      padding: 24px 28px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-soft);
    }
    .track-item:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }
    .track-info { flex: 1; min-width: 0; }
    .track-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .track-title-row h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 18px;
      font-weight: normal;
      color: #2C3E50;
    }
    
    /* 계열 태그 (track-edit과 동일한 컬러풀 스타일) */
    .category-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .category-social_science { background: var(--cat-social-bg); color: var(--cat-social-text); }
    .category-business { background: var(--cat-business-bg); color: var(--cat-business-text); }
    .category-humanities { background: #EDE9FE; color: #6D28D9; }
    .category-engineering { background: var(--cat-engineering-bg); color: var(--cat-engineering-text); }
    .category-medical { background: var(--cat-medical-bg); color: var(--cat-medical-text); }
    .category-arts_sports { background: #FCE7F3; color: #BE185D; }
    .category-custom { background: #E0E7FF; color: #4338CA; }
    .category-other { background: var(--cat-other-bg); color: var(--cat-other-text); }
    
    .track-desc {
      font-size: 14px;
      color: var(--sim-text-mid);
      line-height: 1.6;
      margin-bottom: 6px;
    }
    .track-meta {
      font-size: 13px;
      color: #6B7280;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      background: #F9FAFB;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--sim-text-mid);
    }
    .meta-chip.subjects {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .meta-chip.curriculum {
      background: var(--sim-beige);
      color: var(--sim-text-brown);
    }
    .track-meta .meta-warn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--warning-soft);
      color: var(--warning);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .track-meta .meta-danger {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--danger-soft);
      color: var(--danger);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    
    .track-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }
    
    /* 공통 버튼 스타일 (curriculum 수정/삭제 버튼 크기 기준) */
    .open-btn, .edit-btn, .delete-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      font-family: inherit;
      color: white;
      transition: all 0.15s ease;
      box-sizing: border-box;
      vertical-align: middle;
    }
    
    /* 보기 버튼 (베이지 계통) */
    .open-btn {
      background: #D4A574;
      box-shadow: 0 2px 8px rgba(212, 165, 116, 0.25);
    }
    .open-btn:hover {
      background: #B8895A;
    }
    
    /* 수정 버튼 (curriculum 열기 버튼과 동일 - 하늘색) */
    .edit-btn {
      background: var(--primary);
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .edit-btn:hover {
      background: var(--primary-hover);
    }
    
    /* 삭제 버튼 (핑크) */
    .delete-btn {
      background: #ec6f8e;
      box-shadow: 0 2px 8px rgba(236, 111, 142, 0.25);
    }
    .delete-btn:hover {
      background: #d65878;
    }
    
    footer {
      max-width: 1100px;
      margin: 40px auto 0;
      padding: 28px 32px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .header-inner { padding: 14px 18px; }
      main { padding: 32px 18px 60px; }
      .page-header h2 { font-size: 24px; }
      .page-header .desc { font-size: 14px; }
      .user-info { font-size: 12px; gap: 4px; }
      .profile-btn, .logout-btn { padding: 6px 12px; font-size: 12px; }
      .brand-line1, .brand-line2 { display: block; }
      .brand-name { font-size: 15px; line-height: 1.25; }
      .track-item { flex-direction: column; align-items: stretch; padding: 20px 22px; }
      .track-actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="dashboard.html">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <span class="brand-name"><span class="brand-line1">대전광역시 고등학교</span> <span class="brand-line2">교육과정 업무담당자 워크스페이스</span></span>
      </a>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div class="page-header">
      <div>
        <h2 id="pageTitle">&nbsp;</h2>

      </div>
      <div class="page-header-actions">
        <a id="addBtn" class="btn-primary" href="track-edit.html" style="display:none">+ 새 트랙 만들기</a>
        <a class="back-btn" href="dashboard.html">← 대시보드로</a>
      </div>
    </div>
    
    <div id="schoolFilter" class="filter-bar" style="display:none">
      <label>🏫 학교 선택</label>
      <select id="schoolSelect" onchange="loadTracks()">
        <option value="">학교를 선택하세요</option>
      </select>
    </div>
    
    <div id="trackList">
      <div class="empty-state">
        <div class="icon">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <p>불러오는 중...</p>
      </div>
    </div>
  </main>
  
  <footer>
    Copyright © 대전광역시교육청 고등학교 교육과정지원단. All rights reserved.
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = null;
    let currentProfile = null;
    let isAdmin = false;
    let isSupport = false;
    
    const CATEGORY_LABELS = {
      business: '경영경제계열',
      social_science: '사회과학계열',
      humanities: '인문학계열',
      engineering: '자연공학계열',
      medical: '의료생명계열',
      arts_sports: '예체능계열',
      other: '기타'
    };
    const CATEGORY_ORDER = ['business', 'social_science', 'humanities', 'engineering', 'medical', 'arts_sports', 'other'];
    
    // 카테고리 라벨 가져오기 (custom:XXX 형식 처리)
    function getCategoryLabel(cat) {
      if (!cat) return '미지정';
      if (cat.startsWith('custom:')) return cat.substring(7);
      return CATEGORY_LABELS[cat] || cat;
    }
    function getCategoryClass(cat) {
      if (!cat) return 'category-other';
      if (cat.startsWith('custom:')) return 'category-custom';
      return `category-${cat}`;
    }
    
    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      
      const { data: profile } = await supabase
        .from('profiles')
        .select('display_name, role, school_id, schools(name, code)')
        .eq('id', user.id)
        .single();
      currentProfile = profile;
      isAdmin = profile.role === 'admin';
      isSupport = profile.role === 'support';
      
      const userInfoEl = document.getElementById('userInfo');
      const TITLE_SUFFIX = ' — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스';
      if (isAdmin) {
        userInfoEl.innerHTML = `
          <span class="badge badge-admin">관리자</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="profile-btn" onclick="openPasswordModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>정보수정</button>
          <button class="logout-btn" onclick="handleLogout()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>로그아웃</button>
        `;
        document.getElementById('pageTitle').textContent = '과목 선택 트랙 관리';
        document.title = '과목 선택 트랙 관리' + TITLE_SUFFIX;
        document.getElementById('addBtn').style.display = 'inline-block';
        document.getElementById('schoolFilter').style.display = 'flex';
        document.getElementById('pageDesc').textContent = '학교를 선택해서 등록된 트랙을 관리하세요.';
        await loadSchools();
      } else if (isSupport) {
        userInfoEl.innerHTML = `
          <span class="badge badge-admin">교육과정지원단</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="profile-btn" onclick="openPasswordModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>정보수정</button>
          <button class="logout-btn" onclick="handleLogout()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>로그아웃</button>
        `;
        // 지원단은 조회만: 새 트랙 만들기 버튼 숨김, 학교 선택은 표시
        document.getElementById('pageTitle').textContent = '과목 선택 트랙 조회';
        document.title = '과목 선택 트랙 조회' + TITLE_SUFFIX;
        document.getElementById('schoolFilter').style.display = 'flex';
        document.getElementById('pageDesc').textContent = '학교를 선택해서 등록된 트랙을 조회하세요.';
        await loadSchools();
      } else {
        userInfoEl.innerHTML = `
          <span class="badge badge-school">${profile.schools.name}</span>
          <span class="user-name">${profile.display_name}</span>
          <button class="profile-btn" onclick="openPasswordModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>정보수정</button>
          <button class="logout-btn" onclick="handleLogout()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>로그아웃</button>
        `;
        document.getElementById('pageTitle').textContent = '과목 선택 트랙 작성';
        document.title = '과목 선택 트랙 작성' + TITLE_SUFFIX;
        document.getElementById('addBtn').style.display = 'inline-block';
        document.getElementById('pageDesc').textContent = `${profile.schools.name}의 과목 선택 트랙입니다.`;
        loadTracks();
      }
    }
    
    async function loadSchools() {
      const { data, error } = await supabase
        .from('schools')
        .select('id, name, code')
        .order('name');
      if (error) { console.error(error); return; }
      const select = document.getElementById('schoolSelect');
      select.innerHTML = '<option value="">학교를 선택하세요</option>' + 
        data.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }
    
    window.loadTracks = async function() {
      const listEl = document.getElementById('trackList');
      
      let schoolId;
      if (isAdmin || isSupport) {
        schoolId = document.getElementById('schoolSelect').value;
        if (!schoolId) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="icon">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
              </div>
              <p>위에서 학교를 선택하세요</p>
              <p>선택한 학교의 트랙이 표시됩니다.</p>
            </div>
          `;
          return;
        }
      } else {
        schoolId = currentProfile.school_id;
      }
      
      const { data, error } = await supabase
        .from('tracks')
        .select('*, curriculums(title, sheet_type, updated_at)')
        .eq('school_id', schoolId);
      
      if (error) {
        listEl.innerHTML = `<div class="empty-state" style="color: var(--danger);">오류: ${error.message}</div>`;
        return;
      }
      
      if (!data || data.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">
              <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            </div>
            <p>아직 등록된 트랙이 없어요</p>
            <p>위 버튼으로 새 트랙을 만들어보세요</p>
          </div>
        `;
        return;
      }
      
      // 정렬: 계열별 → 등록일순
      data.sort((a, b) => {
        const ai = CATEGORY_ORDER.indexOf(a.track_category);
        const bi = CATEGORY_ORDER.indexOf(b.track_category);
        if (ai !== bi) return ai - bi;
        return new Date(a.created_at) - new Date(b.created_at);
      });
      
      listEl.innerHTML = `<div class="track-list">` + data.map(item => {
        const updatedDate = new Date(item.updated_at).toLocaleString('ko-KR', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false
        });
        const canEdit = isAdmin || (currentProfile.school_id === item.school_id);
        
        // 편성표 변경 감지
        let curriculumInfo = '';
        let warningInfo = '';
        if (item.curriculums) {
          curriculumInfo = `<span class="meta-chip curriculum">📋 ${item.curriculums.title}</span>`;
          if (new Date(item.curriculums.updated_at) > new Date(item.updated_at)) {
            warningInfo = `<span class="meta-warn">⚠ 편성표가 변경되었습니다. 점검을 권장합니다.</span>`;
          }
        } else if (item.curriculum_id) {
          warningInfo = `<span class="meta-danger">⚠ 연결된 편성표가 삭제되었습니다.</span>`;
        }
        
        // 추천 과목 수 계산 (구/신 형식 모두 호환)
        const subjects = item.recommended_subjects || {};
        let totalCore = 0, totalRecommend = 0;
        for (const semData of Object.values(subjects)) {
          if (Array.isArray(semData)) {
            totalRecommend += semData.length;
          } else if (semData && typeof semData === 'object') {
            totalCore += (semData.core || []).length;
            totalRecommend += (semData.recommend || []).length;
          }
        }
        const totalSubjects = totalCore + totalRecommend;
        
        return `
          <div class="track-item">
            <div class="track-info">
              <div class="track-title-row">
                <h3>${item.title}</h3>
                <span class="category-tag ${getCategoryClass(item.track_category)}">${getCategoryLabel(item.track_category)}</span>
              </div>
              ${item.description ? `<div class="track-desc">${item.description}</div>` : ''}
              <div class="track-meta">
                ${curriculumInfo}
                <span class="meta-chip subjects">⭐ 핵심 권장 ${totalCore} · ✓ 권장 ${totalRecommend}</span>
                <span>최종 수정 ${updatedDate}</span>
                ${warningInfo}
              </div>
            </div>
            <div class="track-actions">
              <a class="open-btn" href="track-view.html?id=${item.id}">보기 →</a>
              ${canEdit ? `
                <a class="edit-btn" href="track-edit.html?id=${item.id}">✎ 수정</a>
                <button class="delete-btn" onclick="deleteTrack('${item.id}')">🗑 삭제</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    };
    
    window.deleteTrack = async function(id) {
      const ok = confirm('정말 삭제하시겠습니까?');
      if (!ok) return;
      const { error } = await supabase.from('tracks').delete().eq('id', id);
      if (error) { alert('삭제 실패: ' + error.message); return; }
      loadTracks();
    };
    
    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };    
    // ====== 토스트 메시지 ======
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = `toast ${type}`; }, 3000);
    }
    
    // ====== 비밀번호 변경 (본인) ======
    window.openPasswordModal = function() {
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwNew').value = '';
      document.getElementById('pwConfirm').value = '';
      document.getElementById('pwModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('pwCurrent').focus(), 50);
    };
    
    window.closePasswordModal = function() {
      document.getElementById('pwModal').classList.add('hidden');
    };
    
    window.submitPasswordChange = async function() {
      const currentPw = document.getElementById('pwCurrent').value;
      const newPw = document.getElementById('pwNew').value;
      const confirmPw = document.getElementById('pwConfirm').value;
      
      if (!currentPw || !newPw || !confirmPw) {
        showToast('❌ 모든 항목을 입력하세요', 'error');
        return;
      }
      if (newPw.length < 6) {
        showToast('❌ 새 비밀번호는 6자 이상이어야 합니다', 'error');
        return;
      }
      if (newPw !== confirmPw) {
        showToast('❌ 새 비밀번호와 확인이 일치하지 않습니다', 'error');
        return;
      }
      if (currentPw === newPw) {
        showToast('❌ 현재 비밀번호와 새 비밀번호가 같습니다', 'error');
        return;
      }
      
      const btn = document.getElementById('pwSubmitBtn');
      btn.disabled = true;
      btn.textContent = '변경 중...';
      
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user || !user.email) {
          showToast('❌ 사용자 정보를 가져올 수 없습니다', 'error');
          return;
        }
        
        const verifyResp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: user.email, password: currentPw })
        });
        
        if (!verifyResp.ok) {
          showToast('❌ 현재 비밀번호가 올바르지 않습니다', 'error');
          return;
        }
        
        const { error } = await supabase.auth.updateUser({ password: newPw });
        if (error) {
          showToast('❌ 비밀번호 변경 실패: ' + error.message, 'error');
          return;
        }
        
        showToast('✅ 비밀번호가 변경되었습니다', 'success');
        closePasswordModal();
      } catch (e) {
        showToast('❌ 오류: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '변경';
      }
    };

    
    init();
  </script>

  <!-- 비밀번호 변경 모달 -->
  <div id="pwModal" class="pw-modal-bg hidden">
    <div class="pw-modal">
      <h3>비밀번호 변경</h3>
      <div class="pw-desc">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</div>
      <div class="pw-field">
        <label>현재 비밀번호</label>
        <input type="password" id="pwCurrent" autocomplete="current-password">
      </div>
      <div class="pw-field">
        <label>새 비밀번호 (6자 이상)</label>
        <input type="password" id="pwNew" autocomplete="new-password">
      </div>
      <div class="pw-field">
        <label>새 비밀번호 확인</label>
        <input type="password" id="pwConfirm" autocomplete="new-password">
      </div>
      <div class="pw-actions">
        <button class="pw-btn-cancel" onclick="closePasswordModal()">취소</button>
        <button class="pw-btn-submit" id="pwSubmitBtn" onclick="submitPasswordChange()">변경</button>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 -->
  <div class="toast" id="toast"></div>

</body>
</html>
