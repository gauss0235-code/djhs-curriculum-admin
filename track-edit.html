<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="shortcut icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <title>트랙 작성 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <meta name="description" content="대전광역시 고등학교 과목 선택 트랙 작성 페이지">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      /* 배경 (건드리지 않음) */
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --border: #d8e8f3;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      --text-light: #8ba8c2;
      --text-muted: #5d7894;
      
      /* 시뮬레이터 톤 */
      --sim-bg: #FFFFFF;
      --sim-text: #2C3E50;
      --sim-text-mid: #6B7280;
      --sim-text-brown: #6B4423;
      --sim-sky-blue: #4A8AB8;
      --sim-sky-blue-light: #87BAD7;
      --sim-beige: #FFF8E7;
      --sim-beige-deep: #FFE9B3;
      --sim-yellow-banner: #FEF3C7;
      --sim-yellow-border: #F59E0B;
      --sim-red-bg: #FEE2E2;
      --sim-red-text: #B91C1C;
      --sim-red-strong: #DC2626;
      
      /* 태그 색상 */
      --tag-fixed-bg: #FEF3C7;
      --tag-fixed-text: #B45309;
      --tag-suneung-bg: #FCE7F3;
      --tag-suneung-text: #BE185D;
      --tag-recommend-bg: #FEF3C7;
      --tag-recommend-text: #B45309;
      --tag-area-bg: #F3F4F6;
      --tag-area-text: #4B5563;
      --tag-general-bg: #DBEAFE;
      --tag-general-text: #1D4ED8;
      --tag-career-bg: #DCFCE7;
      --tag-career-text: #15803D;
      --tag-fusion-bg: #F3E8FF;
      --tag-fusion-text: #7E22CE;
      --tag-common-bg: #E0F2FE;
      --tag-common-text: #0369A1;
      
      /* 핵심/권장 */
      --core-border: #F59E0B;
      --core-bg-tint: #FFFBEB;
      --recommend-border: #3B82F6;
      --recommend-bg-tint: #EFF6FF;
      
      --check-brown: #4A2E14;
      
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 2px 8px rgba(120, 80, 30, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--sim-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-mark { width: 42px; height: 42px; }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
    }
    .user-info { display: flex; align-items: center; gap: 14px; font-size: 14px; }
    .badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .badge-school { background: var(--primary-soft); color: var(--primary-dark); }
    .badge-admin { background: var(--admin-soft); color: var(--admin); }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: white; border: 1.5px solid var(--border);
      padding: 8px 16px; border-radius: 20px; cursor: pointer;
      font-size: 13px; color: var(--text-muted); font-family: inherit;
      transition: all 0.15s ease;
    }
    .logout-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
    
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px 100px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 30px;
      color: var(--sim-sky-blue);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1.5px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      color: var(--sim-text);
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .back-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    
    /* === 폼 카드 (흰색 깔끔) === */
    .form-card {
      background: white;
      border-radius: 20px;
      padding: 26px 28px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }
    .form-card h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 20px;
      color: var(--sim-sky-blue);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-num {
      width: 30px;
      height: 30px;
      background: var(--sim-sky-blue);
      color: white;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .form-card .step-desc {
      font-size: 13px;
      color: var(--sim-text-mid);
      margin-bottom: 18px;
      padding-left: 4px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 12px;
    }
    .form-row.single { grid-template-columns: 1fr; }
    @media (max-width: 700px) {
      .form-row { grid-template-columns: 1fr; }
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--sim-text);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--sim-text);
      background: white;
      transition: all 0.15s ease;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--sim-sky-blue);
      box-shadow: 0 0 0 3px rgba(74, 138, 184, 0.15);
    }
    .field textarea { min-height: 75px; resize: vertical; line-height: 1.5; }
    
    /* 편성표 정보 박스 */
    .curriculum-info {
      background: var(--sim-beige);
      border-left: 4px solid var(--sim-yellow-border);
      padding: 14px 18px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 14px;
      color: var(--sim-text-brown);
      line-height: 1.6;
      display: none;
    }
    .curriculum-info.show { display: block; }
    .curriculum-info strong {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      color: var(--sim-sky-blue);
      font-size: 15px;
    }
    .curriculum-info .school-type {
      display: inline-block;
      padding: 3px 10px;
      background: white;
      border-radius: 10px;
      font-size: 12px;
      margin-left: 6px;
      color: var(--sim-text-brown);
      font-weight: 600;
    }
    
    /* === 학기 섹션 (흰 카드) === */
    .semester-section {
      background: white;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }
    .semester-title {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 22px;
      color: var(--sim-sky-blue);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .semester-icon-box {
      width: 36px;
      height: 36px;
      background: var(--primary-soft);
      color: var(--sim-sky-blue);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .semester-subtitle {
      font-size: 13px;
      color: var(--sim-text-mid);
      margin-bottom: 18px;
      padding-left: 4px;
    }
    
    /* === 학점 알림 배너 (베이지/노랑) === */
    .credit-banner {
      background: linear-gradient(135deg, var(--sim-yellow-banner), #FFE9B3);
      border-radius: 14px;
      padding: 16px 22px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      color: var(--sim-text-brown);
      font-weight: 600;
    }
    .credit-banner .credit-numbers {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 18px;
      color: var(--sim-sky-blue);
    }
    .credit-banner .credit-numbers .green { color: #15803D; }
    
    /* === 학교지정 라벨 영역 === */
    .section-label-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 12px;
    }
    .section-label {
      padding: 7px 16px;
      background: var(--sim-beige-deep);
      color: var(--sim-text-brown);
      border-radius: 12px;
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 14px;
    }
    .section-label-desc {
      font-size: 13px;
      color: var(--sim-text-mid);
    }
    
    /* === 과목 카드 (시뮬레이터 그대로) === */
    .subject-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: var(--sim-beige);
      border: 2px solid #FEE9B3;
      border-radius: 14px;
      margin-bottom: 8px;
      transition: all 0.15s ease;
    }
    .subject-card.choice {
      background: white;
      border-color: #E5E7EB;
    }
    .subject-card.has-core {
      background: var(--core-bg-tint);
      border-color: var(--core-border);
      border-left: 5px solid var(--core-border);
    }
    .subject-card.has-recommend {
      background: var(--recommend-bg-tint);
      border-color: var(--recommend-border);
      border-left: 5px solid var(--recommend-border);
    }
    
    .subject-check {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--check-brown);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .subject-check.empty {
      background: white;
      border: 2px solid #D1D5DB;
      color: transparent;
    }
    
    .subject-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .subject-row-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .subject-name {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--sim-text);
    }
    .subject-row-tags { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .stag {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 7px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .stag-suneung { background: var(--tag-suneung-bg); color: var(--tag-suneung-text); }
    .stag-recommend { background: var(--tag-recommend-bg); color: var(--tag-recommend-text); }
    .stag-area { background: var(--tag-area-bg); color: var(--tag-area-text); }
    .stag-general { background: var(--tag-general-bg); color: var(--tag-general-text); }
    .stag-career { background: var(--tag-career-bg); color: var(--tag-career-text); }
    .stag-fusion { background: var(--tag-fusion-bg); color: var(--tag-fusion-text); }
    .stag-common { background: var(--tag-common-bg); color: var(--tag-common-text); }
    
    .subject-credit {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      color: var(--sim-sky-blue);
      font-size: 17px;
      flex-shrink: 0;
    }
    
    /* === 3단계 선택 버튼 === */
    .level-selector {
      display: inline-flex;
      gap: 0;
      background: #F3F4F6;
      border-radius: 10px;
      padding: 3px;
      flex-shrink: 0;
    }
    .level-btn {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--sim-text-mid);
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .level-btn:hover { background: white; color: var(--sim-text); }
    .level-btn.active.none { background: var(--sim-text-mid); color: white; }
    .level-btn.active.core { 
      background: linear-gradient(135deg, #F59E0B, #EA580C); 
      color: white;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
    }
    .level-btn.active.recommend { 
      background: linear-gradient(135deg, #3B82F6, #1D4ED8); 
      color: white;
      box-shadow: 0 2px 6px rgba(29, 78, 216, 0.25);
    }
    
    /* === 선택군 헤더 (시뮬레이터의 노란 라벨) === */
    .choice-group-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border: 2px solid var(--sim-beige-deep);
      border-radius: 14px;
      padding: 14px 20px;
      margin: 18px 0 10px;
    }
    .choice-group-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .choice-group-badge {
      padding: 6px 14px;
      background: var(--sim-yellow-banner);
      color: var(--tag-fixed-text);
      border-radius: 10px;
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 14px;
    }
    .choice-group-text {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 16px;
      color: var(--sim-text);
    }
    .choice-group-counter {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 14px;
      color: var(--sim-text-mid);
    }
    .choice-group-counter strong {
      color: var(--sim-sky-blue);
      font-size: 16px;
    }
    
    /* === 범례 === */
    .legend-bar {
      background: white;
      border-radius: 14px;
      padding: 14px 22px;
      margin-bottom: 14px;
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: var(--shadow-card);
    }
    .legend-title {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 14px;
      color: var(--sim-sky-blue);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--sim-text);
    }
    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      flex-shrink: 0;
    }
    .legend-dot.fixed { background: var(--sim-beige); border: 2px solid var(--sim-yellow-border); }
    .legend-dot.core { background: var(--core-bg-tint); border: 2px solid var(--core-border); }
    .legend-dot.recommend { background: var(--recommend-bg-tint); border: 2px solid var(--recommend-border); }
    
    /* === 하단 액션 바 === */
    .action-bar {
      position: sticky;
      bottom: 20px;
      background: white;
      border-radius: 16px;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
      border: 2px solid var(--sim-beige-deep);
    }
    .action-stats {
      font-size: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .action-stats .stat-item {
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .action-stats .stat-item.core { background: var(--tag-fixed-bg); color: var(--tag-fixed-text); }
    .action-stats .stat-item.recommend { background: var(--tag-general-bg); color: var(--tag-general-text); }
    .action-stats .stat-item.total { background: #DCFCE7; color: #15803D; }
    .action-stats strong { font-family: 'JalnanGothic', sans-serif; font-size: 16px; }
    
    .action-buttons { display: flex; gap: 8px; }
    .btn-save {
      background: var(--sim-sky-blue);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.15s ease;
      box-shadow: 0 3px 10px rgba(74, 138, 184, 0.3);
    }
    .btn-save:hover { background: #3D7AA3; transform: translateY(-1px); box-shadow: 0 5px 14px rgba(74, 138, 184, 0.4); }
    .btn-save:disabled { background: var(--text-light); cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-cancel {
      background: white;
      border: 1.5px solid #E5E7EB;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--sim-text-mid);
      font-family: inherit;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }
    .btn-cancel:hover { background: #F9FAFB; color: var(--sim-text); }
    
    /* 로딩 */
    .loading-state, .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--sim-text-mid);
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow-card);
    }
    .loading-state .spinner {
      width: 40px; height: 40px;
      margin: 0 auto 16px;
      border: 3px solid var(--sim-beige-deep);
      border-top-color: var(--sim-sky-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .alert {
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    .alert.danger {
      background: var(--sim-red-bg);
      color: var(--sim-red-text);
      border-left: 4px solid var(--sim-red-strong);
    }
    
    @media (max-width: 768px) {
      main { padding: 24px 14px 100px; }
      .page-header h2 { font-size: 24px; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .action-stats { justify-content: center; }
      .subject-card { flex-wrap: wrap; gap: 8px; }
      .level-selector { order: 5; width: 100%; margin-top: 4px; }
      .level-btn { flex: 1; }
      .form-card, .semester-section { padding: 22px 18px; }
      .choice-group-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="dashboard.html">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <span class="brand-name">대전광역시 고등학교 교육과정 업무담당자 워크스페이스</span>
      </a>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div class="page-header">
      <h2 id="pageTitle">새 트랙 만들기</h2>
      <a class="back-btn" href="track.html">← 트랙 목록으로</a>
    </div>

      const sheetIdMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);

      document.getElementById('subjectSelectionWrap').innerHTML = `

      `;
      
      try {
        currentCurriculumData = await loadCurriculumFromSheet(sheetId);

        updateStats();
      } catch (err) {
        document.getElementById('subjectSelectionWrap').innerHTML = `
          <div class="alert danger">
            편성표를 불러올 수 없습니다: ${err.message}

            <strong>확인사항:</strong>
            <br>• 스프레드시트가 '링크가 있는 모든 사용자' 공유 설정인지 확인하세요.
            <br>• 시트 이름이 정확히 '편성표'인지 확인하세요.
          </div>
        `;
      }
    };
    
    function showCurriculumInfo(data) {
      const info = document.getElementById('curriculumInfo');
      info.innerHTML = `
        <strong>${data.schoolName || '학교명 미상'}</strong>

        <br>
        총 ${data.totalSubjects}개 과목 · 학교지정 ${data.fixedCount}개 · 선택 ${data.choiceCount}개
      `;
      info.classList.add('show');
    }
    
    async function loadCurriculumFromSheet(sheetId) {
      const sheetName = encodeURIComponent('편성표');
      const range = `${sheetName}!A1:M500`;
      const fields = encodeURIComponent('sheets(merges,data.rowData.values(formattedValue))');
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?ranges=${range}&fields=${fields}&key=${GOOGLE_API_KEY}`;
      
      const res = await fetch(url);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `${res.status} 오류`);
      }
      
      const data = await res.json();
      const sheet = data.sheets[0];
      const merges = sheet.merges || [];
      const rowData = sheet.data[0]?.rowData || [];
      
      const grid = rowData.map(r => 
        (r.values || []).map(c => (c && c.formattedValue) || '')
      );
      
      const expandedGrid = grid.map(r => [...r]);
      for (const m of merges) {
        const startVal = (grid[m.startRowIndex] || [])[m.startColumnIndex] || '';
        for (let r = m.startRowIndex; r < m.endRowIndex; r++) {
          for (let c = m.startColumnIndex; c < m.endColumnIndex; c++) {
            if (!expandedGrid[r]) expandedGrid[r] = [];
            expandedGrid[r][c] = startVal;
          }
        }
      }
      
      const metaRow = expandedGrid[1] || [];
      let schoolName = '', schoolType = '';
      for (let i = 0; i < metaRow.length; i++) {
        const cell = (metaRow[i] || '').toString().trim();
        if (cell.replace(/\s/g, '').includes('학교명')) {
          schoolName = (metaRow[i+1] || '').toString().trim();
        }
        if (cell.replace(/\s/g, '').includes('학교유형')) {
          schoolType = (metaRow[i+1] || '').toString().trim();
        }
      }
      
      const dataStartRow = 3;
      const COL = {
        section: 0, area: 1, subject: 2, type: 3,
        baseCredit: 4, completion: 5,
        sem: { '1-1': 6, '1-2': 7, '2-1': 8, '2-2': 9, '3-1': 10, '3-2': 11 },
        totalCredit: 12,
      };
      
      let endRow = expandedGrid.length;
      for (let r = dataStartRow; r < expandedGrid.length; r++) {
        const text = (expandedGrid[r] || []).join(' ');
        if (text.includes('편성 조건') && text.includes('점검')) { endRow = r; break; }
      }
      
      const semesters = {};
      for (const sem of Object.keys(COL.sem)) {
        semesters[sem] = { fixed: [], choiceGroups: {}, choiceOrder: [] };
      }
      
      let totalSubjects = 0, fixedCount = 0, choiceCount = 0;
      
      for (let r = dataStartRow; r < endRow; r++) {
        const row = expandedGrid[r] || [];
        const sectionRaw = (row[COL.section] || '').toString().trim();
        const area = (row[COL.area] || '').toString().trim();
        const subject = (row[COL.subject] || '').toString().trim();
        const type = (row[COL.type] || '').toString().trim();
        const baseCredit = parseFloat(row[COL.baseCredit]) || 0;
        const completion = (row[COL.completion] || '').toString().trim();
        
        if (!subject) continue;
        if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(sectionRaw)) continue;
        if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(subject)) continue;
        
        const isFixed = sectionRaw.includes('학교') && sectionRaw.includes('지정');
        
        const totalCreditCell = (row[COL.totalCredit] || '').toString().trim();
        const totalCreditMatch = totalCreditCell.match(/(\d+(?:\.\d+)?)/);
        const rowTotalCredit = totalCreditMatch ? parseFloat(totalCreditMatch[1]) : null;
        
        for (const [semKey, semCol] of Object.entries(COL.sem)) {
          const cellVal = (row[semCol] || '').toString().trim();
          if (!cellVal) continue;
          
          const isCrossSem = cellVal.includes('학기교차') || cellVal.includes('교차');
          const creditMatch = cellVal.match(/(\d+(?:\.\d+)?)/);
          let cellCredit = creditMatch ? parseFloat(creditMatch[1]) : null;
          
          let credit;
          if (cellCredit !== null && baseCredit > 0 && cellCredit > baseCredit * 1.5) {
            credit = (rowTotalCredit !== null && rowTotalCredit <= baseCredit + 1) ? rowTotalCredit : baseCredit;
          } else if (rowTotalCredit !== null && rowTotalCredit <= baseCredit + 1 && rowTotalCredit > 0) {
            credit = rowTotalCredit;
          } else if (cellCredit !== null) {
            credit = cellCredit;
          } else {
            credit = baseCredit;
          }
          
          const subjInfo = { name: subject, area, type, credit, baseCredit, crossSem: isCrossSem, rowIndex: r };
          
          if (isFixed) {
            semesters[semKey].fixed.push(subjInfo);
            fixedCount++;
          } else {
            let groupName = '선택';
            let takeN = null, takeMin = null, takeMax = null;
            const groupMatch = completion.match(/(선택군\s*[A-Z\d]+|[A-Z]\s*그룹|선택\s*\w+)/);
            if (groupMatch) groupName = groupMatch[1].replace(/\s+/g, '');
            
            const rangeMatch = completion.match(/택\s*(\d+)\s*[~∼\-–]\s*(\d+)/);
            if (rangeMatch) {
              takeMin = parseInt(rangeMatch[1]);
              takeMax = parseInt(rangeMatch[2]);
              takeN = takeMax;
            } else {
              const takeMatch = completion.match(/택\s*(\d+)/);
              if (takeMatch) takeN = parseInt(takeMatch[1]);
            }
            
            if (!semesters[semKey].choiceGroups[groupName]) {
              semesters[semKey].choiceGroups[groupName] = {
                name: groupName, takeN, takeMin, takeMax, subjects: []
              };
              semesters[semKey].choiceOrder.push(groupName);
            }
            semesters[semKey].choiceGroups[groupName].subjects.push(subjInfo);
            choiceCount++;
          }
          totalSubjects++;
        }
      }
      
      function pairCrossSem(sem1Key, sem2Key) {
        const sem1Cross = semesters[sem1Key].fixed.filter(s => s.crossSem).sort((a,b) => a.rowIndex - b.rowIndex);
        const sem2Cross = semesters[sem2Key].fixed.filter(s => s.crossSem).sort((a,b) => a.rowIndex - b.rowIndex);
        const sem1RowIdx = new Set(sem1Cross.map(s => s.rowIndex));
        const sem2RowIdx = new Set(sem2Cross.map(s => s.rowIndex));
        const commonRowIdx = [...sem1RowIdx].filter(idx => sem2RowIdx.has(idx)).sort((a,b) => a - b);
        commonRowIdx.forEach((rowIdx, i) => {
          if (i % 2 === 0) {
            const idx = semesters[sem2Key].fixed.findIndex(s => s.rowIndex === rowIdx);
            if (idx >= 0) semesters[sem2Key].fixed.splice(idx, 1);
          } else {
            const idx = semesters[sem1Key].fixed.findIndex(s => s.rowIndex === rowIdx);
            if (idx >= 0) semesters[sem1Key].fixed.splice(idx, 1);
          }
        });
      }
      pairCrossSem('1-1', '1-2');
      pairCrossSem('2-1', '2-2');
      pairCrossSem('3-1', '3-2');
      
      return { semesters, schoolName, schoolType, totalSubjects, fixedCount, choiceCount };
    }
    
    function renderSubjectSelection(data) {
      const wrap = document.getElementById('subjectSelectionWrap');
      
      const legendHtml = `
        <div class="legend-bar">
          <span class="legend-title">📌 표시 안내</span>
          <span class="legend-item"><span class="legend-dot fixed"></span>학교지정 (자동 필수)</span>
          <span class="legend-item"><span class="legend-dot core"></span>⭐ 핵심 권장</span>
          <span class="legend-item"><span class="legend-dot recommend"></span>✓ 권장</span>
        </div>
      `;
      
      const semHtml = SEMESTERS.map(sem => renderSemester(sem, data.semesters[sem.key])).join('');
      wrap.innerHTML = legendHtml + semHtml;
    }
    
    function renderSemester(sem, semData) {
      if (!semData || (semData.fixed.length === 0 && Object.keys(semData.choiceGroups).length === 0)) {
        return `
          <div class="semester-section">
            <div class="semester-title">
              <span class="semester-icon-box">📅</span>
              ${sem.label}
            </div>
            <p style="color:var(--text-light);font-size:13px;text-align:center;padding:20px">
              이 학기에 등록된 과목이 없습니다.
            </p>
          </div>
        `;
      }
      
      // 학교지정 과목
      const fixedCredit = semData.fixed.reduce((s, x) => s + (x.credit || 0), 0);
      const fixedHtml = semData.fixed.length > 0 ? `
        <div class="section-label-row">
          <span class="section-label">학교 지정</span>
          <span class="section-label-desc">자동으로 들어가는 필수 과목이에요</span>
        </div>
        ${semData.fixed.map(s => `
          <div class="subject-card">
            <span class="subject-check">✓</span>
            <div class="subject-info">
              <div class="subject-row-top">
                <span class="subject-name">${escapeHtml(s.name)}</span>
                <span class="subject-row-tags">
                  ${isSuneung(s.name) ? '<span class="stag stag-suneung">📋 수능출제과목</span>' : ''}
                  <span class="stag stag-area">${escapeHtml(s.area)}</span>
                  ${s.type ? `<span class="stag ${getTypeTagClass(s.type)}">${escapeHtml(s.type)}</span>` : ''}
                </span>
              </div>
            </div>
            <span class="subject-credit">${s.credit}학점</span>
          </div>
        `).join('')}
      ` : '';
      
      // 선택 그룹별
      const choiceHtml = semData.choiceOrder.map(groupName => {
        const group = semData.choiceGroups[groupName];
        return `
          <div class="choice-group-row">
            <div class="choice-group-left">
              <span class="choice-group-badge">${escapeHtml(group.name)}</span>
            </div>
            <span class="choice-group-counter" id="counter-${sem.key}-${escapeAttr(groupName)}"><strong>0</strong>과목 선택됨</span>
          </div>
          ${group.subjects.map(s => `
            <div class="subject-card choice" id="row-${sem.key}-${escapeAttr(s.name)}" data-group="${escapeAttr(groupName)}">
              <span class="subject-check empty">✓</span>
              <div class="subject-info">
                <div class="subject-row-top">
                  <span class="subject-name">${escapeHtml(s.name)}</span>
                  <span class="subject-row-tags">
                    ${isSuneung(s.name) ? '<span class="stag stag-suneung">📋 수능출제과목</span>' : ''}
                    <span class="stag stag-area">${escapeHtml(s.area)}</span>
                    ${s.type ? `<span class="stag ${getTypeTagClass(s.type)}">${escapeHtml(s.type)}</span>` : ''}
                  </span>
                </div>
              </div>
              <span class="subject-credit">${s.credit}학점</span>
              <div class="level-selector">
                <button type="button" class="level-btn active none" data-level="none"
                  onclick="setLevel('${sem.key}', '${escapeJsStr(s.name)}', null, this)">안 함</button>
                <button type="button" class="level-btn core" data-level="core"
                  onclick="setLevel('${sem.key}', '${escapeJsStr(s.name)}', 'core', this)">⭐ 핵심 권장</button>
                <button type="button" class="level-btn recommend" data-level="recommend"
                  onclick="setLevel('${sem.key}', '${escapeJsStr(s.name)}', 'recommend', this)">✓ 권장</button>
              </div>
            </div>
          `).join('')}
        `;
      }).join('');
      
      return `
        <div class="semester-section">
          <div class="semester-title">
            <span class="semester-icon-box">📅</span>
            ${sem.label}을 채워볼까요?
          </div>
          <div class="semester-subtitle">학교지정 과목은 자동으로 들어갑니다. 추천 과목을 선택해주세요.</div>
          
          <div class="credit-banner" id="banner-${sem.key}">
            <span>현재 ${sem.label} 학점</span>
            <span class="credit-numbers"><span class="green">${fixedCredit}</span> 학점</span>
          </div>
          
          ${fixedHtml}
          ${choiceHtml}
        </div>
      `;
    }
    
    window.setLevel = function(semKey, subjectName, level, btn) {
      if (!selections[semKey]) selections[semKey] = {};
      if (level === null) {
        delete selections[semKey][subjectName];
      } else {
        selections[semKey][subjectName] = level;
      }
      
      const row = btn.closest('.subject-card');
      row.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      row.classList.remove('has-core', 'has-recommend');
      const checkEl = row.querySelector('.subject-check');
      if (level === 'core') {
        row.classList.add('has-core');
        checkEl.classList.remove('empty');
      } else if (level === 'recommend') {
        row.classList.add('has-recommend');
        checkEl.classList.remove('empty');
      } else {
        checkEl.classList.add('empty');
      }
      
      updateStats();
    };
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(s) {
      return String(s).replace(/["'<>\s]/g, '_');
    }
    function escapeJsStr(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
    
    function updateStats() {
      let totalCore = 0, totalRecommend = 0, totalCredit = 0;
      
      if (currentCurriculumData) {
        for (const semKey of Object.keys(currentCurriculumData.semesters)) {
          const semData = currentCurriculumData.semesters[semKey];
          let semCredit = 0;
          for (const s of semData.fixed) {
            semCredit += s.credit || 0;
            totalCredit += s.credit || 0;
          }
          const semSelections = selections[semKey] || {};
          // 선택군별 카운터
          const groupCounters = {};
          for (const group of Object.values(semData.choiceGroups)) {
            groupCounters[group.name] = 0;
            for (const s of group.subjects) {
              const lv = semSelections[s.name];
              if (lv === 'core' || lv === 'recommend') {
                semCredit += s.credit || 0;
                totalCredit += s.credit || 0;
                groupCounters[group.name]++;
                if (lv === 'core') totalCore++;
                else totalRecommend++;
              }
            }
          }
          // 학기 배너 학점 업데이트
          const banner = document.getElementById(`banner-${semKey}`);
          if (banner) {
            const numEl = banner.querySelector('.credit-numbers');
            if (numEl) numEl.innerHTML = `<span class="green">${semCredit}</span> 학점`;
          }
          // 선택군 카운터 업데이트
          for (const [groupName, count] of Object.entries(groupCounters)) {
            const counterEl = document.getElementById(`counter-${semKey}-${escapeAttr(groupName)}`);
            if (counterEl) {
              counterEl.innerHTML = `<strong>${count}</strong>과목 선택됨`;
            }
          }
        }
      }
      
      document.getElementById('coreCount').textContent = totalCore;
      document.getElementById('recommendCount').textContent = totalRecommend;
      document.getElementById('totalCredit').textContent = totalCredit;
    }
    
    window.saveTrack = async function() {
      const school_id = isAdmin ? document.getElementById('formSchool').value : currentProfile.school_id;
      const curriculum_id = document.getElementById('formCurriculum').value;
      const title = document.getElementById('formTitle').value.trim();
      let track_category = document.getElementById('formCategory').value;
      const customText = document.getElementById('formCategoryCustom').value.trim();
      const description = document.getElementById('formDesc').value.trim();
      
      if (!school_id) { alert('학교를 선택해주세요.'); return; }
      if (!curriculum_id) { alert('교육과정 편성표를 선택해주세요.'); return; }
      if (!title) { alert('과목 선택 트랙 제목을 입력해주세요.'); return; }
      
      // 직접입력 처리: 입력한 텍스트를 카테고리로 사용
      if (track_category === 'custom') {
        if (!customText) { alert('계열명을 입력해주세요.'); return; }
        track_category = 'custom:' + customText;
      }
      
      const recommended_subjects = {};
      for (const [semKey, semSel] of Object.entries(selections)) {
        const core = [], recommend = [];
        for (const [name, lv] of Object.entries(semSel)) {
          if (lv === 'core') core.push(name);
          else if (lv === 'recommend') recommend.push(name);
        }
        if (core.length > 0 || recommend.length > 0) {
          recommended_subjects[semKey] = { core, recommend };
        }
      }
      
      const payload = {
        school_id, curriculum_id, title, track_category,
        description: description || null,
        recommended_subjects,
      };
      
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '저장 중...';
      
      try {
        if (editingId) {
          const { error } = await supabase.from('tracks').update(payload).eq('id', editingId);
          if (error) throw error;
        } else {
          payload.created_by = currentUser.id;
          const { error } = await supabase.from('tracks').insert(payload);
          if (error) throw error;
        }
        alert('저장되었습니다.');
        window.location.href = 'track.html';
      } catch (err) {
        alert('저장 실패: ' + err.message);
        btn.disabled = false;
        btn.textContent = '저장하기';
      }
    };
    
    async function loadExistingTrack(id) {
      const { data, error } = await supabase
        .from('tracks').select('*').eq('id', id).single();
      if (error || !data) {
        alert('트랙을 불러올 수 없습니다.');
        window.location.href = 'track.html';
        return;
      }
      
      document.getElementById('pageTitle').textContent = '트랙 수정';
      document.getElementById('formTitle').value = data.title;
      // 계열 복원 (직접입력 'custom:...' 형식 처리)
      if (data.track_category && data.track_category.startsWith('custom:')) {
        document.getElementById('formCategory').value = 'custom';
        document.getElementById('formCategoryCustom').value = data.track_category.substring(7);
        document.getElementById('formCategoryCustom').style.display = 'block';
      } else {
        document.getElementById('formCategory').value = data.track_category;
      }
      document.getElementById('formDesc').value = data.description || '';
      
      if (isAdmin) {
        document.getElementById('formSchool').value = data.school_id;
        currentSchoolId = data.school_id;
        await loadCurriculums();
      }
      
      if (data.curriculum_id) {
        document.getElementById('formCurriculum').value = data.curriculum_id;
        
        for (const [semKey, semData] of Object.entries(data.recommended_subjects || {})) {
          if (!selections[semKey]) selections[semKey] = {};
          if (Array.isArray(semData)) {
            for (const name of semData) selections[semKey][name] = 'recommend';
          } else if (semData && typeof semData === 'object') {
            for (const name of (semData.core || [])) selections[semKey][name] = 'core';
            for (const name of (semData.recommend || [])) selections[semKey][name] = 'recommend';
          }
        }
        
        await onCurriculumChange();
        
        setTimeout(() => {
          for (const [semKey, semSel] of Object.entries(selections)) {
            for (const [name, lv] of Object.entries(semSel)) {
              const row = document.getElementById(`row-${semKey}-${escapeAttr(name)}`);
              if (!row) continue;
              const btn = row.querySelector(`.level-btn[data-level="${lv}"]`);
              if (btn) {
                row.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                row.classList.remove('has-core', 'has-recommend');
                const checkEl = row.querySelector('.subject-check');
                if (lv === 'core') {
                  row.classList.add('has-core');
                  checkEl.classList.remove('empty');
                } else if (lv === 'recommend') {
                  row.classList.add('has-recommend');
                  checkEl.classList.remove('empty');
                }
              }
            }
          }
          updateStats();
        }, 400);
      }
    }
    
    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };
    
    init();
  </script>
</body>
