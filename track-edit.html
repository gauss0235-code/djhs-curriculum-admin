<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <title>트랙 작성 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      /* 기본 배경 (건드리지 않음) */
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-soft: #e3f0fa;
      --primary-dark: #2d5a8a;
      --admin: #ec6f8e;
      --admin-soft: #fde7ed;
      
      /* 시뮬레이터 톤 (내부 카드용) */
      --beige: #FFF8E7;
      --beige-deep: #FFE9B3;
      --beige-card: #FFFBF0;
      --beige-soft: #FEF7E0;
      --brown: #6B4423;
      --brown-dark: #4A2E14;
      --sky-blue-dark: #4A8AB8;
      --sky-blue: #87BAD7;
      --check-brown: #4A2E14;
      
      /* 태그 색상 */
      --tag-fixed-bg: #FEF3C7;
      --tag-fixed-text: #B45309;
      --tag-core-bg: #FED7AA;
      --tag-core-text: #9A3412;
      --tag-recommend-bg: #DBEAFE;
      --tag-recommend-text: #1D4ED8;
      --tag-credit-bg: #DCFCE7;
      --tag-credit-text: #15803D;
      --tag-area-bg: #E0F2FE;
      --tag-area-text: #0369A1;
      
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-beige: 0 4px 14px rgba(120, 80, 30, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-mark { width: 42px; height: 42px; }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 17px;
      color: var(--primary-dark);
      letter-spacing: -0.01em;
    }
    .user-info { display: flex; align-items: center; gap: 14px; font-size: 14px; }
    .badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .badge-school { background: var(--primary-soft); color: var(--primary-dark); }
    .badge-admin { background: var(--admin-soft); color: var(--admin); }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: white; border: 1.5px solid var(--border);
      padding: 8px 16px; border-radius: 20px; cursor: pointer;
      font-size: 13px; color: var(--text-muted); font-family: inherit;
      transition: all 0.15s ease;
    }
    .logout-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 28px 100px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 30px;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1.5px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .back-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    
    /* === 시뮬레이터 톤의 카드 (베이지) === */
    .form-card {
      background: var(--beige-card);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-beige);
    }
    .form-card h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 22px;
      color: var(--sky-blue-dark);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-card .step-num {
      width: 32px;
      height: 32px;
      background: var(--sky-blue-dark);
      color: white;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .form-card .step-desc {
      font-size: 13px;
      color: var(--brown);
      margin-bottom: 20px;
      padding-left: 4px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }
    .form-row.single { grid-template-columns: 1fr; }
    @media (max-width: 700px) {
      .form-row { grid-template-columns: 1fr; }
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 6px;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--beige-deep);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: white;
      transition: all 0.15s ease;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--sky-blue-dark);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .field textarea {
      min-height: 75px;
      resize: vertical;
      line-height: 1.5;
    }
    
    /* 편성표 정보 박스 */
    .curriculum-info {
      background: var(--beige);
      border-left: 4px solid #F59E0B;
      padding: 16px 20px;
      border-radius: 12px;
      margin-top: 14px;
      font-size: 14px;
      color: var(--brown);
      line-height: 1.6;
      display: none;
    }
    .curriculum-info.show { display: block; }
    .curriculum-info strong {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      color: var(--sky-blue-dark);
      font-size: 16px;
    }
    .curriculum-info .school-type {
      display: inline-block;
      padding: 3px 10px;
      background: white;
      border-radius: 10px;
      font-size: 12px;
      margin-left: 6px;
      color: var(--brown);
      font-weight: 600;
    }
    
    /* 범례 칩들 */
    .legend-bar {
      background: var(--beige-card);
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: var(--shadow-beige);
    }
    .legend-title {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 14px;
      color: var(--brown);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--brown);
    }
    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      flex-shrink: 0;
    }
    .legend-dot.fixed { background: var(--tag-fixed-bg); border: 2px solid var(--tag-fixed-text); }
    .legend-dot.core { background: var(--tag-core-bg); border: 2px solid var(--tag-core-text); }
    .legend-dot.recommend { background: var(--tag-recommend-bg); border: 2px solid var(--tag-recommend-text); }
    
    /* === 학기 섹션 === */
    .semester-section {
      background: var(--beige-card);
      border-radius: 20px;
      padding: 26px 28px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-beige);
    }
    .semester-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px dashed var(--beige-deep);
    }
    .semester-title {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 22px;
      color: var(--sky-blue-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .semester-icon {
      width: 36px;
      height: 36px;
      background: var(--sky-blue-dark);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      font-family: 'JalnanGothic', sans-serif;
    }
    .semester-stats {
      font-size: 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .semester-stats .stat {
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: 700;
      background: white;
      border: 1.5px solid var(--beige-deep);
      color: var(--brown);
    }
    .semester-stats .stat.core-stat {
      background: var(--tag-core-bg);
      color: var(--tag-core-text);
      border-color: var(--tag-core-text);
    }
    .semester-stats .stat.recommend-stat {
      background: var(--tag-recommend-bg);
      color: var(--tag-recommend-text);
      border-color: var(--tag-recommend-text);
    }
    .semester-stats .stat strong {
      font-family: 'JalnanGothic', sans-serif;
      font-size: 14px;
    }
    
    /* === 학교지정 영역 (시뮬레이터의 노란 알림 박스 느낌) === */
    .fixed-banner {
      background: linear-gradient(135deg, #FFF8E7, #FFE9B3);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--brown);
    }
    .fixed-banner .badge-fixed {
      background: #F59E0B;
      color: white;
      padding: 5px 12px;
      border-radius: 10px;
      font-family: 'JalnanGothic', sans-serif;
      font-size: 13px;
      flex-shrink: 0;
    }
    
    /* === 과목 카드 (시뮬레이터 스타일) === */
    .subject-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      border: 2px solid transparent;
      border-radius: 14px;
      margin-bottom: 8px;
      transition: all 0.15s ease;
    }
    .subject-card.fixed {
      background: var(--beige);
      border-color: var(--beige-deep);
    }
    .subject-card.has-core {
      background: #FFFBEB;
      border-left: 5px solid #F59E0B;
    }
    .subject-card.has-recommend {
      background: #EFF6FF;
      border-left: 5px solid #3B82F6;
    }
    
    .subject-check {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--check-brown);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .subject-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .subject-row-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .subject-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--brown-dark);
    }
    .subject-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .stag {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 7px;
      font-weight: 700;
      white-space: nowrap;
    }
    .stag-fixed { background: var(--tag-fixed-bg); color: var(--tag-fixed-text); }
    .stag-area { background: var(--tag-area-bg); color: var(--tag-area-text); }
    .subject-credit {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      color: var(--sky-blue-dark);
      font-size: 16px;
      flex-shrink: 0;
    }
    
    /* 3단계 선택 버튼 */
    .level-selector {
      display: inline-flex;
      gap: 0;
      background: #F5F1E8;
      border: 1.5px solid var(--beige-deep);
      border-radius: 10px;
      padding: 3px;
      flex-shrink: 0;
    }
    .level-btn {
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--brown);
      font-family: inherit;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .level-btn:hover { background: white; }
    .level-btn.active.none { background: var(--brown); color: white; }
    .level-btn.active.core { 
      background: linear-gradient(135deg, #F59E0B, #EA580C); 
      color: white;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
    }
    .level-btn.active.recommend { 
      background: linear-gradient(135deg, #3B82F6, #1D4ED8); 
      color: white;
      box-shadow: 0 2px 6px rgba(29, 78, 216, 0.25);
    }
    
    /* 선택군 헤더 */
    .choice-group-header {
      background: linear-gradient(135deg, #FED7AA, #FB923C);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      margin: 16px 0 10px;
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .choice-group-header .take-info {
      background: rgba(255,255,255,0.25);
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-family: 'Pretendard', sans-serif;
      font-weight: 700;
    }
    
    .area-group { margin-bottom: 14px; }
    .area-title {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 15px;
      color: var(--brown);
      margin-bottom: 8px;
      padding-left: 4px;
    }
    
    /* 하단 액션 바 (시뮬레이터 톤) */
    .action-bar {
      position: sticky;
      bottom: 20px;
      background: var(--beige-card);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -4px 20px rgba(120, 80, 30, 0.15);
      flex-wrap: wrap;
      border: 2px solid var(--beige-deep);
    }
    .action-stats {
      font-size: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .action-stats .stat-item {
      padding: 7px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
    }
    .action-stats .stat-item.core { background: var(--tag-core-bg); color: var(--tag-core-text); }
    .action-stats .stat-item.recommend { background: var(--tag-recommend-bg); color: var(--tag-recommend-text); }
    .action-stats .stat-item.total {
      background: var(--tag-credit-bg);
      color: var(--tag-credit-text);
    }
    .action-stats strong {
      font-family: 'JalnanGothic', sans-serif;
      font-size: 16px;
    }
    
    .action-buttons { display: flex; gap: 8px; }
    .btn-save {
      background: linear-gradient(135deg, #4A8AB8, #2D5A8A);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      transition: all 0.15s ease;
      box-shadow: 0 3px 10px rgba(74, 138, 184, 0.3);
    }
    .btn-save:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(74, 138, 184, 0.4); }
    .btn-save:disabled {
      background: var(--text-light);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-cancel {
      background: white;
      border: 1.5px solid var(--beige-deep);
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--brown);
      font-family: inherit;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }
    .btn-cancel:hover { background: var(--beige); }
    
    /* 로딩 / 알림 */
    .loading-state, .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--brown);
      background: var(--beige-card);
      border-radius: 20px;
      box-shadow: var(--shadow-beige);
    }
    .loading-state .spinner {
      width: 40px; height: 40px;
      margin: 0 auto 16px;
      border: 3px solid var(--beige-deep);
      border-top-color: var(--sky-blue-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .alert {
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    .alert.danger {
      background: #FEE2E2;
      color: #991B1B;
      border-left: 4px solid #DC2626;
    }
    
    @media (max-width: 768px) {
      main { padding: 24px 16px 100px; }
      .page-header h2 { font-size: 24px; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .action-stats { justify-content: center; }
      .subject-card { flex-wrap: wrap; }
      .level-selector { order: 4; width: 100%; }
      .level-btn { flex: 1; }
      .form-card { padding: 22px 20px; }
      .semester-section { padding: 22px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="dashboard.html">
        <div class="brand-mark"><img src="images/logo.png" alt="대전광역시교육청"></div>
        <span class="brand-name">대전광역시 고등학교 교육과정 업무담당자 워크스페이스</span>
      </a>
      <div class="user-info" id="userInfo"></div>
    </div>
  </header>
  
  <main>
    <div class="page-header">
      <h2 id="pageTitle">새 트랙 만들기</h2>
      <a class="back-btn" href="track.html">← 트랙 목록으로</a>
    </div>
    
    <!-- 1단계: 트랙 기본 정보 -->
    <div class="form-card">
      <h3><span class="step-num">1</span>트랙 기본 정보</h3>
      <div class="step-desc">트랙의 제목과 계열, 설명을 입력해주세요</div>
      <div class="form-row">
        <div class="field" id="schoolField" style="display:none">
          <label>학교 *</label>
          <select id="formSchool" onchange="onSchoolChange()"></select>
        </div>
        <div class="field">
          <label>계열 *</label>
          <select id="formCategory">
            <option value="social_science">사회과학계열</option>
            <option value="business">경영경제계열</option>
            <option value="engineering">자연공학계열</option>
            <option value="medical">의료생명계열</option>
            <option value="other">기타</option>
          </select>
        </div>
      </div>
      <div class="form-row single">
        <div class="field">
          <label>트랙 제목 *</label>
          <input type="text" id="formTitle" placeholder="예: 2027학년도 입학생 사회과학계열 과목 선택 트랙">
        </div>
      </div>
      <div class="form-row single">
        <div class="field">
          <label>설명</label>
          <textarea id="formDesc" placeholder="이 트랙에 대한 설명이나 진로 안내를 입력하세요"></textarea>
        </div>
      </div>
    </div>
    
    <!-- 2단계: 편성표 선택 -->
    <div class="form-card">

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    const GOOGLE_API_KEY = 'AIzaSyBC95kjuGRE0cgsHHWWco0-MnBt9XiPfCY';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = null;

    const SEMESTERS = [
      { key: '1-1', label: '1학년 1학기', short: '1-1' },
      { key: '1-2', label: '1학년 2학기', short: '1-2' },

    async function init() {

      const params = new URLSearchParams(window.location.search);

    async function loadSchools() {
      const { data } = await supabase
        .from('schools').select('id, name, code').order('name');

    async function loadCurriculums() {
      const select = document.getElementById('formCurriculum');
      if (!currentSchoolId) {
        select.innerHTML = '<option value="">먼저 학교를 선택하세요</option>';
        return;
      }
      const { data } = await supabase
        .from('curriculums')
        .select('id, title, sheet_type, spreadsheet_url, updated_at')
        .eq('school_id', currentSchoolId)
        .order('created_at', { ascending: false });
      
      if (!data || data.length === 0) {
        select.innerHTML = '<option value="">등록된 편성표가 없습니다</option>';
        return;
      }
      
      const TYPE_LABELS = { practice: '연습용', first_draft: '1차 제출본', final: '최종본' };
      select.innerHTML = '<option value="">편성표를 선택하세요</option>' + 
        data.map(c => `<option value="${c.id}" data-url="${c.spreadsheet_url}">${c.title} (${TYPE_LABELS[c.sheet_type] || c.sheet_type})</option>`).join('');
    }
    
    window.onCurriculumChange = async function() {
      const select = document.getElementById('formCurriculum');
      const opt = select.options[select.selectedIndex];
      const url = opt ? opt.dataset.url : null;
      if (!url) {
        document.getElementById('curriculumInfo').classList.remove('show');
        document.getElementById('subjectSelectionWrap').innerHTML = '';
        document.getElementById('actionBar').style.display = 'none';
        currentCurriculumData = null;
        return;
      }
      
      const sheetIdMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (!sheetIdMatch) {
        alert('스프레드시트 URL 형식이 올바르지 않습니다.');
        return;
      }
      const sheetId = sheetIdMatch[1];
      
      document.getElementById('subjectSelectionWrap').innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>편성표를 분석하는 중입니다...</p>
        </div>
      `;
      
      try {
        currentCurriculumData = await loadCurriculumFromSheet(sheetId);
        showCurriculumInfo(currentCurriculumData);
        renderSubjectSelection(currentCurriculumData);
        document.getElementById('actionBar').style.display = 'flex';
        updateStats();
      } catch (err) {
        document.getElementById('subjectSelectionWrap').innerHTML = `
          <div class="alert danger">
            편성표를 불러올 수 없습니다: ${err.message}
            <br><br>
            <strong>확인사항:</strong>
            <br>• 스프레드시트가 '링크가 있는 모든 사용자' 공유 설정인지 확인하세요.
            <br>• 시트 이름이 정확히 '편성표'인지 확인하세요.
          </div>
        `;
      }
    };
    
    function showCurriculumInfo(data) {
      const info = document.getElementById('curriculumInfo');
      info.innerHTML = `
        <strong>${data.schoolName || '학교명 미상'}</strong>
        <span class="school-type">${data.schoolType || '학교 유형 미상'}</span>
        <br>
        총 ${data.totalSubjects}개 과목 · 학교지정 ${data.fixedCount}개 · 선택 ${data.choiceCount}개
      `;
      info.classList.add('show');
    }
    
    async function loadCurriculumFromSheet(sheetId) {
      const sheetName = encodeURIComponent('편성표');
      const range = `${sheetName}!A1:M500`;
      const fields = encodeURIComponent('sheets(merges,data.rowData.values(formattedValue))');
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?ranges=${range}&fields=${fields}&key=${GOOGLE_API_KEY}`;
      
      const res = await fetch(url);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `${res.status} 오류`);
      }
      
      const data = await res.json();
      const sheet = data.sheets[0];
      const merges = sheet.merges || [];
      const rowData = sheet.data[0]?.rowData || [];
      
      const grid = rowData.map(r => 
        (r.values || []).map(c => (c && c.formattedValue) || '')
      );
      
      const expandedGrid = grid.map(r => [...r]);
      for (const m of merges) {
        const startVal = (grid[m.startRowIndex] || [])[m.startColumnIndex] || '';
        for (let r = m.startRowIndex; r < m.endRowIndex; r++) {
          for (let c = m.startColumnIndex; c < m.endColumnIndex; c++) {
            if (!expandedGrid[r]) expandedGrid[r] = [];
            expandedGrid[r][c] = startVal;
          }
        }
      }
      
      const metaRow = expandedGrid[1] || [];
      let schoolName = '';
      let schoolType = '';
      for (let i = 0; i < metaRow.length; i++) {
        const cell = (metaRow[i] || '').toString().trim();
        if (cell.replace(/\s/g, '').includes('학교명')) {
          schoolName = (metaRow[i+1] || '').toString().trim();
        }
        if (cell.replace(/\s/g, '').includes('학교유형')) {
          schoolType = (metaRow[i+1] || '').toString().trim();
        }
      }
      
      const dataStartRow = 3;
      const COL = {
        section: 0, area: 1, subject: 2, type: 3,
        baseCredit: 4, completion: 5,
        sem: { '1-1': 6, '1-2': 7, '2-1': 8, '2-2': 9, '3-1': 10, '3-2': 11 },
        totalCredit: 12,
      };
      
      let endRow = expandedGrid.length;
      for (let r = dataStartRow; r < expandedGrid.length; r++) {
        const text = (expandedGrid[r] || []).join(' ');
        if (text.includes('편성 조건') && text.includes('점검')) {
          endRow = r;
          break;
        }
      }
      
      const semesters = {};
      for (const sem of Object.keys(COL.sem)) {
        semesters[sem] = { fixed: [], choiceGroups: {}, choiceOrder: [] };
      }
      
      let totalSubjects = 0, fixedCount = 0, choiceCount = 0;
      
      for (let r = dataStartRow; r < endRow; r++) {
        const row = expandedGrid[r] || [];
        const sectionRaw = (row[COL.section] || '').toString().trim();
        const area = (row[COL.area] || '').toString().trim();
        const subject = (row[COL.subject] || '').toString().trim();
        const type = (row[COL.type] || '').toString().trim();
        const baseCredit = parseFloat(row[COL.baseCredit]) || 0;
        const completion = (row[COL.completion] || '').toString().trim();
        
        if (!subject) continue;
        if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(sectionRaw)) continue;
        if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(subject)) continue;
        
        const isFixed = sectionRaw.includes('학교') && sectionRaw.includes('지정');
        
        const totalCreditCell = (row[COL.totalCredit] || '').toString().trim();
        const totalCreditMatch = totalCreditCell.match(/(\d+(?:\.\d+)?)/);
        const rowTotalCredit = totalCreditMatch ? parseFloat(totalCreditMatch[1]) : null;
        
        for (const [semKey, semCol] of Object.entries(COL.sem)) {
          const cellVal = (row[semCol] || '').toString().trim();
          if (!cellVal) continue;
          
          const isCrossSem = cellVal.includes('학기교차') || cellVal.includes('교차');
          const creditMatch = cellVal.match(/(\d+(?:\.\d+)?)/);
          let cellCredit = creditMatch ? parseFloat(creditMatch[1]) : null;
          
          let credit;
          if (cellCredit !== null && baseCredit > 0 && cellCredit > baseCredit * 1.5) {
            credit = (rowTotalCredit !== null && rowTotalCredit <= baseCredit + 1) ? rowTotalCredit : baseCredit;
          } else if (rowTotalCredit !== null && rowTotalCredit <= baseCredit + 1 && rowTotalCredit > 0) {
            credit = rowTotalCredit;
          } else if (cellCredit !== null) {
            credit = cellCredit;
          } else {
            credit = baseCredit;
          }
          
          const subjInfo = { name: subject, area, type, credit, baseCredit, crossSem: isCrossSem, rowIndex: r };
          
          if (isFixed) {
            semesters[semKey].fixed.push(subjInfo);
            fixedCount++;
          } else {
            let groupName = '선택';
            let takeN = null, takeMin = null, takeMax = null;
            const groupMatch = completion.match(/(선택군\s*[A-Z\d]+|[A-Z]\s*그룹|선택\s*\w+)/);
            if (groupMatch) groupName = groupMatch[1].replace(/\s+/g, '');
            
            const rangeMatch = completion.match(/택\s*(\d+)\s*[~∼\-–]\s*(\d+)/);
            if (rangeMatch) {
              takeMin = parseInt(rangeMatch[1]);
              takeMax = parseInt(rangeMatch[2]);
              takeN = takeMax;
            } else {
              const takeMatch = completion.match(/택\s*(\d+)/);
              if (takeMatch) takeN = parseInt(takeMatch[1]);
            }
            
            if (!semesters[semKey].choiceGroups[groupName]) {
              semesters[semKey].choiceGroups[groupName] = {
                name: groupName, takeN, takeMin, takeMax, subjects: []
              };
              semesters[semKey].choiceOrder.push(groupName);
            }
            semesters[semKey].choiceGroups[groupName].subjects.push(subjInfo);
            choiceCount++;
          }
          totalSubjects++;
        }
      }
      
      function pairCrossSem(sem1Key, sem2Key) {
        const sem1Cross = semesters[sem1Key].fixed.filter(s => s.crossSem).sort((a,b) => a.rowIndex - b.rowIndex);
        const sem2Cross = semesters[sem2Key].fixed.filter(s => s.crossSem).sort((a,b) => a.rowIndex - b.rowIndex);
        const sem1RowIdx = new Set(sem1Cross.map(s => s.rowIndex));
        const sem2RowIdx = new Set(sem2Cross.map(s => s.rowIndex));
        const commonRowIdx = [...sem1RowIdx].filter(idx => sem2RowIdx.has(idx)).sort((a,b) => a - b);
        commonRowIdx.forEach((rowIdx, i) => {
          if (i % 2 === 0) {
            const idx = semesters[sem2Key].fixed.findIndex(s => s.rowIndex === rowIdx);
            if (idx >= 0) semesters[sem2Key].fixed.splice(idx, 1);
          } else {
            const idx = semesters[sem1Key].fixed.findIndex(s => s.rowIndex === rowIdx);
            if (idx >= 0) semesters[sem1Key].fixed.splice(idx, 1);
          }
        });
      }
      pairCrossSem('1-1', '1-2');
      pairCrossSem('2-1', '2-2');
      pairCrossSem('3-1', '3-2');
      
      return { semesters, schoolName, schoolType, totalSubjects, fixedCount, choiceCount };
    }
    
    function renderSubjectSelection(data) {
      const wrap = document.getElementById('subjectSelectionWrap');
      
      const legendHtml = `
        <div class="legend-bar">
          <span class="legend-title">📌 선택 수준</span>
          <span class="legend-item"><span class="legend-dot fixed"></span>학교지정 (자동 필수)</span>
          <span class="legend-item"><span class="legend-dot core"></span>⭐ 핵심 (꼭 들었으면 하는 과목)</span>
          <span class="legend-item"><span class="legend-dot recommend"></span>✓ 권장 (들으면 좋은 과목)</span>
        </div>
      `;
      
      const semHtml = SEMESTERS.map(sem => renderSemester(sem, data.semesters[sem.key])).join('');
      wrap.innerHTML = legendHtml + semHtml;
    }
    
    function renderSemester(sem, semData) {
      if (!semData || (semData.fixed.length === 0 && Object.keys(semData.choiceGroups).length === 0)) {
        return `
          <div class="semester-section">
            <div class="semester-header">
              <div class="semester-title">
                <span class="semester-icon">${sem.short}</span>
                ${sem.label}
              </div>
            </div>
            <p style="color:var(--text-light);font-size:13px;text-align:center;padding:20px">
              이 학기에 등록된 과목이 없습니다.
            </p>
          </div>
        `;
      }
      
      // 학교지정 영역
      const fixedHtml = semData.fixed.length > 0 ? `
        <div class="fixed-banner">
          <span class="badge-fixed">학교 지정</span>
          <span>자동으로 들어가는 필수 과목이에요</span>
        </div>
        ${semData.fixed.map(s => `
          <div class="subject-card fixed">
            <span class="subject-check">✓</span>
            <div class="subject-info">
              <div class="subject-row-top">
                <span class="subject-name">${escapeHtml(s.name)}</span>
                <span class="subject-tags">
                  <span class="stag stag-area">${escapeHtml(s.area)}</span>
                  <span class="stag stag-fixed">학교지정</span>
                </span>
              </div>
            </div>
            <span class="subject-credit">${s.credit}학점</span>
          </div>
        `).join('')}
      ` : '';
      
      // 선택 그룹별
      const choiceHtml = semData.choiceOrder.map(groupName => {
        const group = semData.choiceGroups[groupName];
        const takeText = group.takeMin && group.takeMax 
          ? `${group.takeMin}~${group.takeMax}개 선택`
          : group.takeN ? `${group.takeN}개 선택` : '선택';
        return `
          <div class="area-group">
            <div class="choice-group-header">
              <span>${escapeHtml(group.name)}</span>
              <span class="take-info">${takeText}</span>
            </div>
            ${group.subjects.map(s => `
              <div class="subject-card" id="row-${sem.key}-${escapeAttr(s.name)}">
                <div class="subject-info">
                  <div class="subject-row-top">
                    <span class="subject-name">${escapeHtml(s.name)}</span>
                    <span class="subject-tags">
                      <span class="stag stag-area">${escapeHtml(s.area)}</span>
                    </span>
                  </div>
                </div>
                <span class="subject-credit">${s.credit}학점</span>
                <div class="level-selector">
                  <button type="button" class="level-btn active none" data-level="none"
                    onclick="setLevel('${sem.key}', '${escapeJsStr(s.name)}', null, this)">안 함</button>
                  <button type="button" class="level-btn core" data-level="core"
                    onclick="setLevel('${sem.key}', '${escapeJsStr(s.name)}', 'core', this)">⭐ 핵심</button>
                  <button type="button" class="level-btn recommend" data-level="recommend"
                    onclick="setLevel('${sem.key}', '${escapeJsStr(s.name)}', 'recommend', this)">✓ 권장</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
      
      return `
        <div class="semester-section">
          <div class="semester-header">
            <div class="semester-title">
              <span class="semester-icon">${sem.short}</span>
              ${sem.label}
            </div>
            <div class="semester-stats">
              <span class="stat">필수 <strong>${semData.fixed.length}</strong></span>
              <span class="stat core-stat" id="stat-core-${sem.key}">⭐ 핵심 <strong>0</strong></span>
              <span class="stat recommend-stat" id="stat-recommend-${sem.key}">✓ 권장 <strong>0</strong></span>
            </div>
          </div>
          ${fixedHtml}
          ${choiceHtml}
        </div>
      `;
    }
    
    window.setLevel = function(semKey, subjectName, level, btn) {
      if (!selections[semKey]) selections[semKey] = {};
      if (level === null) {
        delete selections[semKey][subjectName];
      } else {
        selections[semKey][subjectName] = level;
      }
      
      const row = btn.closest('.subject-card');
      row.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      row.classList.remove('has-core', 'has-recommend');
      if (level === 'core') row.classList.add('has-core');
      else if (level === 'recommend') row.classList.add('has-recommend');
      
      updateStats();
    };
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(s) {
      return String(s).replace(/["'<>\s]/g, '_');
    }
    function escapeJsStr(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
    
    function updateStats() {
      let totalCore = 0, totalRecommend = 0, totalCredit = 0;
      
      if (currentCurriculumData) {
        for (const semKey of Object.keys(currentCurriculumData.semesters)) {
          const semData = currentCurriculumData.semesters[semKey];
          for (const s of semData.fixed) {
            totalCredit += s.credit || 0;
          }
          let semCore = 0, semRecommend = 0;
          const semSelections = selections[semKey] || {};
          for (const group of Object.values(semData.choiceGroups)) {
            for (const s of group.subjects) {
              const lv = semSelections[s.name];
              if (lv === 'core') {
                totalCore++;
                semCore++;
                totalCredit += s.credit || 0;
              } else if (lv === 'recommend') {
                totalRecommend++;
                semRecommend++;
                totalCredit += s.credit || 0;
              }
            }
          }
          const coreEl = document.getElementById(`stat-core-${semKey}`);
          if (coreEl) coreEl.innerHTML = `⭐ 핵심 <strong>${semCore}</strong>`;
          const recEl = document.getElementById(`stat-recommend-${semKey}`);
          if (recEl) recEl.innerHTML = `✓ 권장 <strong>${semRecommend}</strong>`;
        }
      }
      
      document.getElementById('coreCount').textContent = totalCore;
      document.getElementById('recommendCount').textContent = totalRecommend;
      document.getElementById('totalCredit').textContent = totalCredit;
    }
    
    window.saveTrack = async function() {
      const school_id = isAdmin ? document.getElementById('formSchool').value : currentProfile.school_id;
      const curriculum_id = document.getElementById('formCurriculum').value;
      const title = document.getElementById('formTitle').value.trim();
      const track_category = document.getElementById('formCategory').value;
      const description = document.getElementById('formDesc').value.trim();
      
      if (!school_id) { alert('학교를 선택해주세요.'); return; }
      if (!curriculum_id) { alert('편성표를 선택해주세요.'); return; }
      if (!title) { alert('트랙 제목을 입력해주세요.'); return; }
      
      const recommended_subjects = {};
      for (const [semKey, semSel] of Object.entries(selections)) {
        const core = [];
        const recommend = [];
        for (const [name, lv] of Object.entries(semSel)) {
          if (lv === 'core') core.push(name);
          else if (lv === 'recommend') recommend.push(name);
        }
        if (core.length > 0 || recommend.length > 0) {
          recommended_subjects[semKey] = { core, recommend };
        }
      }
      
      const payload = {
        school_id, curriculum_id, title, track_category,
        description: description || null,
        recommended_subjects,
      };
      
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '저장 중...';
      
      try {
        if (editingId) {
          const { error } = await supabase.from('tracks').update(payload).eq('id', editingId);
          if (error) throw error;
        } else {
          payload.created_by = currentUser.id;
          const { error } = await supabase.from('tracks').insert(payload);
          if (error) throw error;
        }
        alert('저장되었습니다.');
        window.location.href = 'track.html';
      } catch (err) {
        alert('저장 실패: ' + err.message);
        btn.disabled = false;
        btn.textContent = '저장하기';
      }
    };
    
    async function loadExistingTrack(id) {
      const { data, error } = await supabase
        .from('tracks').select('*').eq('id', id).single();
      if (error || !data) {
        alert('트랙을 불러올 수 없습니다.');
        window.location.href = 'track.html';
        return;
      }
      
      document.getElementById('pageTitle').textContent = '트랙 수정';
      document.getElementById('formTitle').value = data.title;
      document.getElementById('formCategory').value = data.track_category;
      document.getElementById('formDesc').value = data.description || '';
      
      if (isAdmin) {
        document.getElementById('formSchool').value = data.school_id;
        currentSchoolId = data.school_id;
        await loadCurriculums();
      }
      
      if (data.curriculum_id) {
        document.getElementById('formCurriculum').value = data.curriculum_id;
        
        for (const [semKey, semData] of Object.entries(data.recommended_subjects || {})) {
          if (!selections[semKey]) selections[semKey] = {};
          if (Array.isArray(semData)) {
            for (const name of semData) selections[semKey][name] = 'recommend';
          } else if (semData && typeof semData === 'object') {
            for (const name of (semData.core || [])) selections[semKey][name] = 'core';
            for (const name of (semData.recommend || [])) selections[semKey][name] = 'recommend';
          }
        }
        
        await onCurriculumChange();
        
        setTimeout(() => {
          for (const [semKey, semSel] of Object.entries(selections)) {
            for (const [name, lv] of Object.entries(semSel)) {
              const row = document.getElementById(`row-${semKey}-${escapeAttr(name)}`);
              if (!row) continue;
              const btn = row.querySelector(`.level-btn[data-level="${lv}"]`);
              if (btn) {
                row.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                row.classList.remove('has-core', 'has-recommend');
                if (lv === 'core') row.classList.add('has-core');
                else if (lv === 'recommend') row.classList.add('has-recommend');
              }
            }
          }
          updateStats();
        }, 400);
      }
    }
    
    window.handleLogout = async function() {
      const ok = confirm('로그아웃 하시겠습니까?');
      if (!ok) return;
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };
    
    init();
  </script>
</body>
