<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="shortcut icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <title>학교·담당자 관리 — 대전광역시 고등학교 교육과정 업무담당자 워크스페이스</title>
  <meta name="description" content="학교 및 담당자 계정 관리 페이지">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face {
      font-family: 'JalnanGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg-sky: #e8f4fc;
      --bg-sky-deep: #d4ecf8;
      --surface: #ffffff;
      --border: #d8e8f3;
      --border-strong: #b8d4e8;
      --text: #1e3a5f;
      --text-muted: #5d7894;
      --text-light: #8ba8c2;
      --primary: #4a90d9;
      --primary-hover: #3a7ec0;
      --primary-dark: #2d5a8a;
      --primary-soft: #f0f7fc;
      --danger: #ec6f8e;
      --danger-soft: #fdf2f4;
      --shadow-soft: 0 4px 20px rgba(74, 144, 217, 0.08);
      --shadow-card: 0 8px 28px rgba(74, 144, 217, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-sky-deep) 100%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-area img { width: 40px; height: 40px; object-fit: contain; }
    .logo-area .site-name {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 16px;
      color: var(--primary-dark);
      font-weight: normal;
    }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-admin { background: var(--primary-soft); color: var(--primary-dark); }
    .user-name { font-size: 14px; color: var(--text-muted); }
    .logout-btn {
      background: white;
      border: 1.5px solid var(--border);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
    }
    .logout-btn:hover { background: var(--bg-sky); }
    main { max-width: 1200px; margin: 0 auto; padding: 48px 32px 80px; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 36px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 32px;
      font-weight: normal;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .page-header .desc { font-size: 16px; color: var(--text-muted); }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
      transition: all 0.15s ease;
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .back-btn {
      background: #6B7280;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .back-btn:hover { background: #4B5563; transform: translateY(-1px); }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }
    .tab {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      font-family: inherit;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s ease;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 700;
    }
    .list-grid { display: grid; gap: 14px; }
    .list-item {
      background: white;
      border: 2px solid transparent;
      padding: 22px 26px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-soft);
    }
    .list-item:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }
    .list-info { flex: 1; min-width: 0; }
    .list-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .list-title {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 18px;
      color: #2C3E50;
      font-weight: normal;
    }
    .list-meta {
      font-size: 13px;
      color: #6B7280;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .role-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .role-admin { background: #FEE2E2; color: #B91C1C; }
    .role-support { background: #DBEAFE; color: #1D4ED8; }
    .role-school { background: #DCFCE7; color: #15803D; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      font-family: inherit;
      color: white;
      transition: all 0.15s ease;
      box-sizing: border-box;
      vertical-align: middle;
      background: var(--primary);
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .icon-btn:hover { background: var(--primary-hover); }
    .icon-btn.danger {
      background: #ec6f8e;
      box-shadow: 0 2px 8px rgba(236, 111, 142, 0.25);
    }
    .icon-btn.danger:hover { background: #d65878; }
    .icon-btn.warn {
      background: #f59e0b;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
    }
    .icon-btn.warn:hover { background: #d97706; }
    .icon-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: white;
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 58, 95, 0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: white;
      border-radius: 20px;
      padding: 32px;
      max-width: 540px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h3 {
      font-family: 'JalnanGothic', 'Pretendard', sans-serif;
      font-size: 24px;
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-weight: normal;
    }
    .modal .modal-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .form-hint { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .email-input-wrap { display: flex; align-items: center; gap: 8px; }
    .email-input-wrap input { flex: 1; }
    .email-input-wrap .domain { font-size: 14px; color: var(--text-muted); font-weight: 600; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .modal-actions button {
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      border: none;
    }
    .btn-cancel {
      background: white;
      color: var(--text);
      border: 1.5px solid var(--border) !important;
    }
    .btn-cancel:hover { background: var(--bg-sky); }
    .btn-submit {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.25);
    }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .loading-overlay.active { display: flex; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-dark);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 300;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    .toast.success { background: #16A34A; }
    @media (max-width: 768px) {
      main { padding: 28px 16px 60px; }
      .page-header h2 { font-size: 24px; }
      .list-item { flex-direction: column; align-items: stretch; padding: 20px 22px; }
      .modal { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-area">
      <img src="images/logo.png" alt="대전광역시교육청 심볼">
      <span class="site-name">대전광역시 고등학교 교육과정 업무담당자 워크스페이스</span>
    </div>
    <div class="user-info" id="userInfo"></div>
  </header>
  <main>
    <div class="page-header">
      <div>
        <h2>학교·담당자 관리</h2>
        <div class="desc">학교 등록 및 담당자 계정을 관리합니다.</div>
      </div>
      <div class="header-actions">
        <button class="btn-primary" id="addBtn" onclick="showAddForm()">+ 새 담당자 등록</button>
        <a class="back-btn" href="dashboard.html">← 대시보드로</a>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="users" onclick="switchTab('users')">담당자 목록</button>
      <button class="tab" data-tab="schools" onclick="switchTab('schools')">학교 목록</button>
    </div>
    <div id="content"></div>
  </main>

  <!-- 담당자 등록/수정 모달 -->
  <div class="modal-backdrop" id="userModal">
    <div class="modal">
      <h3 id="userModalTitle">새 담당자 등록</h3>
      <div class="modal-desc" id="userModalDesc">담당자 정보를 입력하세요. 등록하면 계정이 자동으로 생성됩니다.</div>
      <div class="form-group">
        <label>역할 *</label>
        <select id="formRole" onchange="onRoleChange()">
          <option value="school">학교 담당자</option>
          <option value="support">교육과정지원단</option>
        </select>
      </div>
      <div class="form-group" id="schoolFormGroup">
        <label>소속 학교 *</label>
        <select id="formSchool">
          <option value="">학교를 선택하세요</option>
        </select>
      </div>
      <div class="form-group" id="emailFormGroup">
        <label>이메일 *</label>
        <div class="email-input-wrap">
          <input type="text" id="formEmail" placeholder="예: djhs" autocomplete="off">
          <span class="domain">@djsch.kr</span>
        </div>
        <div class="form-hint">@djsch.kr 앞부분만 입력하세요</div>
      </div>
      <div class="form-group" id="passwordFormGroup">
        <label>비밀번호 *</label>
        <input type="text" id="formPassword" placeholder="예: djhs1234" autocomplete="off">
        <div class="form-hint">최소 6자 이상</div>
      </div>
      <div class="form-group">
        <label>담당자 이름 *</label>
        <input type="text" id="formDisplayName" placeholder="예: 대전고 교육과정 업무담당자" autocomplete="off">
        <div class="form-hint">로그인 후 화면 상단에 표시되는 이름입니다</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeUserModal()">취소</button>
        <button class="btn-submit" id="userSubmitBtn" onclick="submitUser()">등록</button>
      </div>
    </div>
  </div>

  <!-- 비밀번호 변경 모달 -->
  <div class="modal-backdrop" id="passwordModal">
    <div class="modal">
      <h3>비밀번호 변경</h3>
      <div class="modal-desc" id="passwordModalDesc">새 비밀번호를 입력하세요.</div>
      <div class="form-group">
        <label>새 비밀번호 *</label>
        <input type="text" id="newPassword" placeholder="새 비밀번호 (최소 6자)" autocomplete="off">
        <div class="form-hint">담당자에게 새 비밀번호를 안내해주세요</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closePasswordModal()">취소</button>
        <button class="btn-submit" id="passwordSubmitBtn" onclick="submitPassword()">변경</button>
      </div>
    </div>
  </div>

  <!-- 학교 등록/수정 모달 -->
  <div class="modal-backdrop" id="schoolModal">
    <div class="modal">
      <h3 id="schoolModalTitle">새 학교 등록</h3>
      <div class="modal-desc">학교 정보를 입력하세요.</div>
      <div class="form-group">
        <label>학교명 *</label>
        <input type="text" id="schoolFormName" placeholder="예: 한밭고" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학교 약자 (code) *</label>
        <input type="text" id="schoolFormCode" placeholder="예: hbhs" autocomplete="off">
        <div class="form-hint">기존 학교와 중복되지 않는 영문 약자</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSchoolModal()">취소</button>
        <button class="btn-submit" id="schoolSubmitBtn" onclick="submitSchool()">등록</button>
      </div>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
  <div class="toast" id="toast"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const SUPABASE_URL = 'https://nzsgvjdotnvqpzhehfsg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ALakaYU4jTYEIQas_nWrsQ_An3IK9_h';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    window.supabase = supabase;
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/admin-user`;

    let currentUser = null;
    let currentProfile = null;
    let schools = [];
    let users = [];
    let activeTab = 'users';
    let editingUserId = null;
    let editingSchoolId = null;
    let passwordTargetUserId = null;

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      const { data: profile } = await supabase
        .from('profiles')
        .select('*, schools(name, code)')
        .eq('id', user.id)
        .single();
      if (!profile || profile.role !== 'admin') {
        alert('관리자만 접근 가능한 페이지입니다.');
        window.location.href = 'dashboard.html';
        return;
      }
      currentProfile = profile;
      document.getElementById('userInfo').innerHTML = `
        <span class="badge badge-admin">교육과정지원단 관리자</span>
        <span class="user-name">${profile.display_name}</span>
        <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
      `;
      await loadSchools();
      await loadUsers();
      render();
    }

    async function loadSchools() {
      const { data, error } = await supabase.from('schools').select('*').order('name');
      if (error) { console.error(error); return; }
      schools = data || [];
      const select = document.getElementById('formSchool');
      select.innerHTML = '<option value="">학교를 선택하세요</option>' +
        schools.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    }

    async function loadUsers() {
      try {
        const result = await callEdgeFunction('list-users', {});
        users = result.users || [];
      } catch (err) {
        console.error('loadUsers failed:', err);
        users = [];
      }
    }

    function render() {
      const content = document.getElementById('content');
      if (activeTab === 'users') renderUsers(content);
      else renderSchools(content);
    }

    function renderUsers(content) {
      if (users.length === 0) {
        content.innerHTML = '<div class="empty"><p>등록된 담당자가 없습니다</p></div>';
        return;
      }
      const ROLE_LABELS = { admin: '관리자', support: '교육과정지원단', school: '학교 담당자' };
      content.innerHTML = '<div class="list-grid">' + users.map(u => {
        const schoolName = u.schools ? u.schools.name : '-';
        const roleClass = `role-${u.role}`;
        const roleLabel = ROLE_LABELS[u.role] || u.role;
        const isSelf = u.id === currentUser.id;
        return `
          <div class="list-item">
            <div class="list-info">
              <div class="list-title-row">
                <span class="list-title">${escapeHtml(u.display_name)}</span>
                <span class="role-tag ${roleClass}">${roleLabel}</span>
                ${isSelf ? '<span class="role-tag role-admin">본인</span>' : ''}
              </div>
              <div class="list-meta">
                <span>🏫 ${escapeHtml(schoolName)}</span>
                <span>📧 ${escapeHtml(u.email || '-')}</span>
              </div>
            </div>
            <div class="actions">
              <button class="icon-btn" onclick="editUser('${u.id}')">✎ 수정</button>
              <button class="icon-btn warn" onclick="showPasswordModal('${u.id}', '${escapeHtml(u.display_name)}')">🔑 비밀번호</button>
              ${!isSelf ? `<button class="icon-btn danger" onclick="deleteUser('${u.id}', '${escapeHtml(u.display_name)}')">🗑 삭제</button>` : ''}
            </div>
          </div>
        `;
      }).join('') + '</div>';
    }

    function renderSchools(content) {
      if (schools.length === 0) {
        content.innerHTML = '<div class="empty"><p>등록된 학교가 없습니다</p></div>';
        return;
      }
      content.innerHTML = '<div class="list-grid">' + schools.map(s => `
        <div class="list-item">
          <div class="list-info">
            <div class="list-title-row">
              <span class="list-title">${escapeHtml(s.name)}</span>
              <span class="role-tag role-school">code: ${escapeHtml(s.code)}</span>
            </div>
          </div>
          <div class="actions">
            <button class="icon-btn" onclick="editSchool('${s.id}')">✎ 수정</button>
            <button class="icon-btn danger" onclick="deleteSchool('${s.id}', '${escapeHtml(s.name)}')">🗑 삭제</button>
          </div>
        </div>
      `).join('') + '</div>';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[m]));
    }

    function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = `toast ${type}`; }, 3000);
    }

    async function callEdgeFunction(action, body) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('로그인이 필요합니다');
      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${session.access_token}`,
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ action, ...body }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '요청 처리 실패');
      return result;
    }

    window.switchTab = function(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      const addBtn = document.getElementById('addBtn');
      if (tab === 'users') {
        addBtn.textContent = '+ 새 담당자 등록';
        addBtn.onclick = () => showAddForm();
      } else {
        addBtn.textContent = '+ 새 학교 등록';
        addBtn.onclick = () => showAddSchoolForm();
      }
      render();
    };

    window.showAddForm = function() {
      editingUserId = null;
      document.getElementById('userModalTitle').textContent = '새 담당자 등록';
      document.getElementById('userModalDesc').textContent = '담당자 정보를 입력하세요. 등록하면 계정이 자동으로 생성됩니다.';
      document.getElementById('formRole').value = 'school';
      document.getElementById('formSchool').value = '';
      document.getElementById('formEmail').value = '';
      document.getElementById('formPassword').value = '';
      document.getElementById('formDisplayName').value = '';
      document.getElementById('emailFormGroup').style.display = '';
      document.getElementById('passwordFormGroup').style.display = '';
      document.getElementById('userSubmitBtn').textContent = '등록';
      onRoleChange();
      document.getElementById('userModal').classList.add('active');
    };

    window.onRoleChange = function() {
      const role = document.getElementById('formRole').value;
      document.getElementById('schoolFormGroup').style.display = (role === 'school') ? '' : 'none';
    };

    window.closeUserModal = function() {
      document.getElementById('userModal').classList.remove('active');
    };

    window.editUser = function(id) {
      const user = users.find(u => u.id === id);
      if (!user) return;
      editingUserId = id;
      document.getElementById('userModalTitle').textContent = '담당자 정보 수정';
      document.getElementById('userModalDesc').textContent = '담당자의 역할, 학교, 이름을 수정합니다. (이메일/비밀번호는 별도 변경)';
      document.getElementById('formRole').value = user.role;
      document.getElementById('formSchool').value = user.school_id || '';
      document.getElementById('formDisplayName').value = user.display_name || '';
      document.getElementById('emailFormGroup').style.display = 'none';
      document.getElementById('passwordFormGroup').style.display = 'none';
      document.getElementById('userSubmitBtn').textContent = '수정';
      onRoleChange();
      document.getElementById('userModal').classList.add('active');
    };

    window.submitUser = async function() {
      const role = document.getElementById('formRole').value;
      const school_id = document.getElementById('formSchool').value;
      const display_name = document.getElementById('formDisplayName').value.trim();
      if (!display_name) { alert('담당자 이름을 입력하세요.'); return; }
      if (role === 'school' && !school_id) { alert('소속 학교를 선택하세요.'); return; }
      const submitBtn = document.getElementById('userSubmitBtn');
      submitBtn.disabled = true;
      try {
        if (editingUserId) {
          // 이름 중복 체크 (본인 제외)
          const duplicate = users.find(u => 
            u.display_name === display_name && u.id !== editingUserId
          );
          if (duplicate) {
            submitBtn.disabled = false;
            alert('이미 같은 이름의 담당자가 존재합니다.');
            return;
          }
          showLoading();
          const { error } = await supabase.from('profiles').update({
            role,
            school_id: role === 'school' ? school_id : null,
            display_name
          }).eq('id', editingUserId);
          hideLoading();
          if (error) { showToast('수정 실패: ' + error.message, 'error'); return; }
          showToast('✅ 담당자 정보가 수정되었습니다', 'success');
        } else {
          const emailPrefix = document.getElementById('formEmail').value.trim();
          const password = document.getElementById('formPassword').value.trim();
          if (!emailPrefix || !password) { alert('이메일과 비밀번호를 입력하세요.'); return; }
          if (!/^[a-zA-Z0-9_]+$/.test(emailPrefix)) { alert('이메일 앞부분은 영문/숫자/언더스코어만 가능합니다.'); return; }
          if (password.length < 6) { alert('비밀번호는 최소 6자 이상이어야 합니다.'); return; }
          const email = `${emailPrefix}@djsch.kr`;
          showLoading();
          await callEdgeFunction('create', {
            email, password, display_name, role,
            school_id: role === 'school' ? school_id : null,
          });
          hideLoading();
          showToast(`✅ ${display_name} 계정이 생성되었습니다`, 'success');
        }
        closeUserModal();
        await loadUsers();
        render();
      } catch (err) {
        hideLoading();
        showToast('❌ ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    };

    window.showPasswordModal = function(userId, userName) {
      passwordTargetUserId = userId;
      document.getElementById('passwordModalDesc').textContent = `"${userName}"의 새 비밀번호를 입력하세요.`;
      document.getElementById('newPassword').value = '';
      document.getElementById('passwordModal').classList.add('active');
    };

    window.closePasswordModal = function() {
      document.getElementById('passwordModal').classList.remove('active');
      passwordTargetUserId = null;
    };

    window.submitPassword = async function() {
      const newPassword = document.getElementById('newPassword').value.trim();
      if (!newPassword) { alert('새 비밀번호를 입력하세요.'); return; }
      if (newPassword.length < 6) { alert('비밀번호는 최소 6자 이상이어야 합니다.'); return; }
      const submitBtn = document.getElementById('passwordSubmitBtn');
      submitBtn.disabled = true;
      try {
        showLoading();
        await callEdgeFunction('password', {
          user_id: passwordTargetUserId,
          new_password: newPassword,
        });
        hideLoading();
        showToast('✅ 비밀번호가 변경되었습니다', 'success');
        closePasswordModal();
      } catch (err) {
        hideLoading();
        showToast('❌ ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    };

    window.deleteUser = async function(id, name) {
      if (!confirm(`정말 "${name}" 담당자를 삭제하시겠습니까?\n\n⚠️ 계정과 모든 관련 데이터가 삭제됩니다.\n이 작업은 되돌릴 수 없습니다.`)) return;
      try {
        showLoading();
        await callEdgeFunction('delete', { user_id: id });
        hideLoading();
        showToast(`✅ "${name}" 계정이 삭제되었습니다`, 'success');
        await loadUsers();
        render();
      } catch (err) {
        hideLoading();
        showToast('❌ ' + err.message, 'error');
      }
    };

    window.showAddSchoolForm = function() {
      editingSchoolId = null;
      document.getElementById('schoolModalTitle').textContent = '새 학교 등록';
      document.getElementById('schoolFormName').value = '';
      document.getElementById('schoolFormCode').value = '';
      document.getElementById('schoolModal').classList.add('active');
    };

    window.closeSchoolModal = function() {
      document.getElementById('schoolModal').classList.remove('active');
    };

    window.editSchool = function(id) {
      const school = schools.find(s => s.id === id);
      if (!school) return;
      editingSchoolId = id;
      document.getElementById('schoolModalTitle').textContent = '학교 정보 수정';
      document.getElementById('schoolFormName').value = school.name;
      document.getElementById('schoolFormCode').value = school.code;
      document.getElementById('schoolModal').classList.add('active');
    };

    window.submitSchool = async function() {
      const name = document.getElementById('schoolFormName').value.trim();
      const code = document.getElementById('schoolFormCode').value.trim().toLowerCase();
      if (!name || !code) { alert('학교명과 약자를 입력하세요.'); return; }
      if (!/^[a-z0-9_]+$/.test(code)) { alert('학교 약자는 영문 소문자/숫자만 가능합니다.'); return; }
      const submitBtn = document.getElementById('schoolSubmitBtn');
      submitBtn.disabled = true;
      try {
        showLoading();
        if (editingSchoolId) {
          const { error } = await supabase.from('schools').update({ name, code }).eq('id', editingSchoolId);
          if (error) throw new Error(error.message);
          showToast('✅ 학교 정보가 수정되었습니다', 'success');
        } else {
          const { error } = await supabase.from('schools').insert({ name, code });
          if (error) {
            if (error.code === '23505') throw new Error('이미 같은 약자(code)의 학교가 존재합니다');
            throw new Error(error.message);
          }
          showToast('✅ 학교가 등록되었습니다', 'success');
        }
        hideLoading();
        closeSchoolModal();
        await loadSchools();
        render();
      } catch (err) {
        hideLoading();
        showToast('❌ ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    };

    window.deleteSchool = async function(id, name) {
      if (!confirm(`정말 "${name}" 학교를 삭제하시겠습니까?\n\n⚠️ 이 학교 소속 담당자/편성표/트랙이 있으면 삭제할 수 없습니다.`)) return;
      try {
        showLoading();
        const { error } = await supabase.from('schools').delete().eq('id', id);
        hideLoading();
        if (error) {
          if (error.code === '23503') showToast('❌ 이 학교 소속 데이터가 있어 삭제할 수 없습니다', 'error');
          else showToast('❌ ' + error.message, 'error');
          return;
        }
        showToast(`✅ "${name}" 학교가 삭제되었습니다`, 'success');
        await loadSchools();
        render();
      } catch (err) {
        hideLoading();
        showToast('❌ ' + err.message, 'error');
      }
    };

    window.handleLogout = async function() {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };

    init();
  </script>
</body>
</html>
